<title>エアホッケー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1634'/%3E%3Ccircle cx='32' cy='40' r='14' fill='%233ec9ff'/%3E%3Ccircle cx='32' cy='40' r='6' fill='%23bff0ff'/%3E%3Ccircle cx='40' cy='18' r='8' fill='%23f4f6ff' stroke='%23ff5d7a' stroke-width='3'/%3E%3C/svg%3E">
<script>
/* ---------------------------------------------------------------------
   エアホッケー（1ファイルで動くブラウザゲーム）
   調整しやすい数値は、このすぐ下の定数にまとめています。
   --------------------------------------------------------------------- */
// ===== 00_config.js =====
'use strict';
/* =====================================================================
   調整用の定数（手触りを変えたいときは、まずここを触る）
   速さの単位は「台の長さ(L)/秒」。台の長さが変わっても体感が変わらない。
   ===================================================================== */
const TUNE = {
  PUCK_MAX_SPEED: 2.0,     // パックの最高速度（台長/秒）。ラリーが続くと上がる
  RESTITUTION: 0.7,        // マレットとの反発の強さ（1より小さい＝止まったマレットでは勢いが吸収される）
  WALL_RESTITUTION: 0.94,  // 壁との反発（当たったときだけ、わずかに勢いが落ちる）
  FLOOR_DRAG: 0.03,        // 台の上での減速（1秒あたりの割合。ほとんど減速せず滑り続ける）
  RALLY_POWER_GAIN: 0.04,  // ラリー1回ごとに上がる、打ち返しの強さの倍率
  RALLY_POWER_MAX: 1.7,    // 打ち返しの強さの倍率の上限
  RALLY_SPEED_GAIN: 0.08,  // ラリー1回ごとに上がる、最高速度の上限（台長/秒）
  RALLY_SPEED_MAX: 3.4,    // ラリーで上がる最高速度の、さらに上限（台長/秒）
  SECOND_PUCK_RALLY: 10,   // このラリー回数でパックが2個になる
  GAUGE_PER_HIT: 0.1,      // パックを弾くたびに溜まるゲージの量（満タン＝1）
  WIN_SCORE: 7,            // 勝利点数
  NET_SEND_HZ: 30,         // 通信の送信頻度（回/秒）
};

/* 台の寸法。割合は台の幅 W が基準 */
const GEO = {
  TABLE_LEN: 1000,         // 台の長さ（物理の単位）
  ASPECT_MIN: 0.42,        // 台の縦横比（幅÷長さ）の下限・上限。超える画面では余白を背景で埋める
  ASPECT_MAX: 0.85,
  CORNER_RATIO: 0.24,      // ゴール側の斜めの壁の大きさ（台幅の割合。2割以上）
  MALLET_R_RATIO: 0.075,   // マレットの半径（直径が台幅の15%）
  PUCK_R_RATIO: 0.05,      // パックの半径
  GOAL_RATIO: 0.40,        // ゴールの幅
  TOP_GUARD: 44,           // スマホのブラウザで開いたとき、画面の上端からこの幅（px）には台もボタンも置かない（ノッチ・時計・サイト名の表示に隠れないように）
  TOP_GUARD_FULL: 62,      // iPhone で画面の一番上まで描いている（ステータスバーの下まで広がっている）ときの幅（px）
};

/* 物理の細かい値 */
const PHYS = {
  MALLET_V_SMOOTH: 0.03,   // マレットの速さをなめらかにする時定数（秒）
  MALLET_V_MAX: 4.5,       // マレットの速さの上限（台長/秒）
  HIT_COOLDOWN: 0.10,      // 同じマレットとの接触を1回の打ち返しとみなす間隔（秒）
  HIT_MIN_SPEED: 0.08,     // これより弱い接触は打ち返しに数えない（台長/秒）
  SUBSTEP: 1 / 120,        // 1フレームをこの長さ以下に分けて進める（秒）
  STALL_TIME: 7,           // パックがほぼ止まったままこの秒数たつと、中央から出し直す
};

/* 必殺技 */
const SKILL = {
  FAST_BOOST: 1.55,        // 剛速球：最高速度の上限が何倍になるか（上限の速さで飛ぶ）
  CURVE_RATE: 2.0,         // カーブ：1秒あたりに曲がる角度（ラジアン）
  SPLIT_ANGLE: 0.2,        // 分身：3つの進む向きのずれ（ラジアン）
  SPLIT_LIFE: 5,           // 分身：消えるまでの時間（秒）
  VANISH_FROM: 0.12,       // 消える球：飛んだ距離（台長の割合）がここから薄くなり
  VANISH_FULL: 0.20,       //   ここで見えなくなり
  VANISH_BACK: 0.50,       //   ここから見えはじめ
  VANISH_END: 0.60,        //   ここで完全に見える
  WALL_TIME: 3.5,          // 防壁：出ている時間（秒）
  WALL_THICK: 0.03,        // 防壁：厚み（台幅の割合）
  HEAVY_TIME: 3.0,         // 重い腕：続く時間（秒）
  HEAVY_LAG: 0.20,         // 重い腕：指に遅れてついてくる時間（秒）
  HEAVY_V_MAX: 1.0,        // 重い腕：マレットの最高速度（台長/秒）
  ZIG_PERIOD: 0.15,        // 稲妻：折れ曲がる間隔（秒）
  ZIG_ANGLE: 0.75,         // 稲妻：1回に折れ曲がる角度（ラジアン）
  MINI_SCALE: 0.55,        // ミニ球：パックの大きさ（元の何倍か）
  GIANT_SCALE: 1.65,       // 巨大化：マレットの大きさ（元の何倍か）
  GIANT_TIME: 4.0,         // 巨大化：続く時間（秒）
  SHOCK_RANGE: 0.5,        // 衝撃波：届く距離（台長の割合）
  SHOCK_POWER: 2.4,        // 衝撃波：吹き飛ばす速さ（台長/秒。近いほど強い）
  WIDE_SCALE: 1.7,         // ゴール拡大：相手のゴールの幅（元の何倍か。斜めの壁までが上限）
  WIDE_TIME: 4.0,          // ゴール拡大：続く時間（秒）
  MIRROR_TIME: 3.5,        // 反転：相手の左右の操作が逆になる時間（秒）
  FREEZE: 0,               // 発動時に止まる時間（秒）。技はいきなり使われるのが面白いので、止めない
};

/* ステージの仕掛け（位置・大きさは台の割合。上下左右とも対称に置く） */
const STG = {
  BUMPER_KICK: 0.35,       // バンパー：当たったとき、さらに押し出す速さ（台長/秒）
  SPRING_E: 1.5,           // バネの壁：反発の強さ（1より大きいと速く跳ね返る）
  ARROW_ACCEL: 3.2,        // 矢印の床：加速の強さ（台長/秒²）
  SLOW_DRAG: 3.4,          // 減速の床：1秒あたりの減速
  SWEEP_PERIOD: 5.0,       // 往復する壁：1往復の時間（秒）
  SWEEP_LEN: 0.30,         // 往復する壁：長さ（台幅の割合）
  SHUTTER_OPEN: 2.4,       // シャッター：開いている時間（秒）
  SHUTTER_CLOSED: 1.8,     // シャッター：半分ふさがっている時間（秒）
  SHUTTER_MOVE: 0.35,      // シャッター：動く時間（秒）
  SHUTTER_WARN: 0.6,       // シャッター：閉まる前に予告が光る時間（秒）
  PULSE_PERIOD: 6.0,       // ゴールの幅：1往復の時間（秒）
  PULSE_MIN: 0.13,         // ゴールの半幅の最小・最大（台幅の割合）
  PULSE_MAX: 0.25,
  LIGHT_R: 3.2,            // 暗いステージ：マレットの明かりの半径（マレット半径の何倍か）
  DARK_ALPHA: 0.92,        // 暗いステージ：暗さ（1で真っ暗）
};

/* 試合の進行（秒） */
const FLOW = {
  COUNTDOWN: 3,            // 試合開始前のカウントダウン
  SERVE_WAIT: 1.2,         // 得点後、次のサーブまでの間
  GOAL_PAUSE: 1.7,         // 得点の演出の長さ
};

/* 演出 */
const FX = {
  PARTICLE_MAX: 600,       // 同時に出せる粒の数
  TRAIL_TIME: 0.16,        // パックの残像の長さ（秒）
  HITSTOP_POWER: 1.6,      // この強さ（台長/秒）以上の打ち返しで、ほんの一瞬止まる
  HITSTOP_MAX: 0.055,      // その止まる時間の上限（秒）
  SHAKE_HIT: 5,            // 強打の画面の揺れ（px）
  SHAKE_GOAL: 16,          // 得点の画面の揺れ（px）
  SHAKE_SKILL: 10,         // 必殺技の画面の揺れ（px）
};

/* CPU の強さ */
const AI = {
  SPEED: 2.6,              // ふだんの動く速さ（台長/秒）
  STRIKE_STRONG: 3.6,      // 強く打つときの振りの速さ（台長/秒）
  STRIKE_WEAK: 1.1,        // 弱く当てるときの振りの速さ（台長/秒）
  STRONG_RATE: 0.6,        // 強く打つ割合
  THINK: 0.06,             // 状況を読み直す間隔（秒）
  AIM_ERROR: 0.06,         // 狙いのぶれ（台幅の割合）
  SKILL_DELAY: [0.4, 2.2], // ゲージが満タンになってから技を使うまでの間（秒）
};

/* 通信 */
const NET = {
  PEER_PREFIX: 'airhockey-neo-',              // PeerJS の ID の先頭（部屋コードの前につける）
  CODE_LEN: 4,                                // 部屋コードの文字数
  CODE_CHARS: 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789',  // 見間違えやすい文字（I・O・0・1）は使わない
  CONNECT_TIMEOUT: 15,                        // つながるまで待つ時間（秒）
  LOST_TIMEOUT: 6,                            // この秒数なにも届かなければ切れたとみなす
  INTERP_DELAY: 0.06,                         // 相手のマレットとパックを補間するための遅れ（秒）
  ICE_SERVERS: [                              // つながりにくい環境では TURN サーバーをここに足す
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
  ],
  PEER_SERVER: null,                          // 自分で PeerServer を立てるときだけ { host, port, path, secure } を書く（ふだんは PeerJS の公開サーバー）
  PEERJS_URLS: [                              // PeerJS の読み込み先（上から順に試す）
    'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
    'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
  ],
  PROTO: 2,                                   // 通信の約束ごとの版（技を足したので 2）
};

/* 色。役割ごとに分ける */
const COLORS = {
  me: '#3ec9ff',           // 自分（下側）
  opp: '#ff5d7a',          // 相手（上側）
  ready: '#ffd23f',        // ゲージ満タン
  puck: '#f4f6ff',
  table: '#0b1634',
  line: '#2b4a94',
  wall: '#9fb6ff',
  ui: '#5b7cff',
};

/* 必殺技。attack＝発動後の次のショットにかかる／defense・disrupt＝押した瞬間に効く */
const SKILL_TYPE = {
  attack:  { label: '攻撃', color: '#ff9f43' },
  defense: { label: '守り', color: '#3ddc97' },
  disrupt: { label: '妨害', color: '#b46bff' },
};
/* 説明文は句読点を使わず、短い区切りごとに改行（\n）する */
const SKILLS = [
  { id: 'fast',     name: '剛速球',     type: 'attack',  desc: '次のショットが\n炎をまとって\n超高速で飛ぶ' },
  { id: 'curve',    name: 'カーブ',     type: 'attack',  desc: '次のショットが\n大きく曲がる' },
  { id: 'split',    name: '分身',       type: 'attack',  desc: '3つに分かれる\nどれか1つでも\n入れば1点' },
  { id: 'vanish',   name: '消える球',   type: 'attack',  desc: '次のショットが\n途中で見えなくなる' },
  { id: 'zigzag',   name: '稲妻',       type: 'attack',  desc: '次のショットが\n左右にジグザグに\n折れ曲がる' },
  { id: 'mini',     name: 'ミニ球',     type: 'attack',  desc: '次のショットの\nパックが小さくなる' },
  { id: 'wall',     name: '防壁',       type: 'defense', desc: '自分のゴール前に\n数秒だけ壁が出る' },
  { id: 'giant',    name: '巨大化',     type: 'defense', desc: '自分のマレットが\n数秒だけ大きくなる' },
  { id: 'shock',    name: '衝撃波',     type: 'defense', desc: '近くのパックを\n相手の陣地へ\n吹き飛ばす' },
  { id: 'heavy',    name: '重い腕',     type: 'disrupt', desc: '相手のマレットが\n数秒重くなる' },
  { id: 'widegoal', name: 'ゴール拡大', type: 'disrupt', desc: '相手のゴールが\n数秒だけ広くなる' },
  { id: 'mirror',   name: '反転',       type: 'disrupt', desc: '相手の左右の操作が\n数秒だけ逆になる' },
];

/* ステージ（仕掛けの中身は 13_stage.js）。仕掛けは1ステージ1〜2個、上下対称 */
const STAGE_META = [
  { id: 'pillars', name: 'ピラーズ',     desc: '中央の柱とバンパーが\nパックを弾く' },
  { id: 'sweeper', name: 'スイーパー',   desc: '中央線の上を\n壁が左右に往復する' },
  { id: 'spring',  name: 'スプリング',   desc: '壁の一部がバネ\n当たると速く跳ね返る' },
  { id: 'boost',   name: 'ブースト',     desc: '矢印の床で加速\n中央の床でゆっくりに' },
  { id: 'warp',    name: 'ワープ',       desc: '左の壁の穴に入ると\n右の壁から出てくる' },
  { id: 'shutter', name: 'シャッター',   desc: 'ゴールが一定の間隔で\n半分ふさがる' },
  { id: 'pulse',   name: 'ゴールゆらぎ', desc: 'ゴールの幅が\n広がったり\n狭まったりする' },
  { id: 'dark',    name: '暗闇',         desc: 'マレットの周りしか\n見えない\n音でパックを追う' },
];
const STAGE_COLOR = {
  pillar: '#8fa3d1', bumper: '#ff5ccf', spring: '#b6ff3d', mover: '#eef2ff',
  warp: '#9d7bff', arrow: '#ffb347', slow: '#2ec4c4', shutter: '#ffe066',
};

</script>
<style>
:root {
  --bg: #04070f;
  --panel: rgba(10, 16, 42, .9);
  --line: rgba(120, 150, 255, .22);
  --text: #e8eeff;
  --sub: #9fb0dc;
  --ui: #5b7cff;
  --me: #3ec9ff;
  --opp: #ff5d7a;
  --gold: #ffd23f;
  --attack: #ff9f43;
  --defense: #3ddc97;
  --disrupt: #b46bff;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --st: max(env(safe-area-inset-top, 0px), var(--guard-top, 0px));   /* 上端：ノッチ・時計・サイト名の表示に隠れない幅（JS が --guard-top を決める） */
  --sb: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }   /* 長押しのメニューを出さない */
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: var(--font); overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
canvas#game { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
.hidden { display: none !important; }

/* ---- 画面（重ねる板） ---- */
.screen {
  position: fixed; inset: 0; display: none; flex-direction: column; z-index: 10;
  padding: calc(var(--st) + 10px) 16px calc(var(--sb) + 14px);
  background: radial-gradient(120% 80% at 50% 0%, rgba(30, 50, 130, .35), rgba(4, 7, 15, .55) 60%);
}
.screen.show { display: flex; animation: screenIn .38s cubic-bezier(.2, .9, .25, 1.1) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }

/* ---- タイトル ---- */
.title-wrap { margin: auto; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
.logo { position: relative; padding-top: 8px; }
.logo h1 {
  margin: 0; font-size: clamp(44px, 15vw, 72px); font-weight: 900; letter-spacing: .02em; line-height: 1.05;
  display: flex; flex-direction: column; align-items: center;
  background: linear-gradient(100deg, #9ff0ff 0%, #ffffff 30%, #7fa2ff 55%, #ffffff 70%, #9ff0ff 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 14px rgba(62, 201, 255, .55)) drop-shadow(0 4px 0 rgba(20, 30, 90, .9));
  animation: sheen 4.5s linear infinite, logoIn .9s cubic-bezier(.2, 1.4, .3, 1) both;
}
.logo h1 span:last-child { margin-top: -4px; }
@keyframes sheen { from { background-position: 0% 0; } to { background-position: 250% 0; } }
@keyframes logoIn { from { opacity: 0; transform: scale(1.6) rotate(-4deg); } to { opacity: 1; transform: none; } }
.logo-puck {
  position: absolute; width: 34px; height: 34px; border-radius: 50%; right: -22px; top: 6px;
  background: radial-gradient(circle at 35% 30%, #fff, #c9d4f0 55%, #8a97b8);
  box-shadow: 0 0 0 4px var(--opp) inset, 0 0 22px rgba(255, 93, 122, .8);
  animation: puckBob 2.4s ease-in-out infinite, puckIn .9s .2s cubic-bezier(.2, 1.5, .3, 1) both;
}
@keyframes puckBob { 0%, 100% { transform: translateY(0) rotate(0deg); box-shadow: 0 0 0 4px var(--opp) inset, 0 0 16px rgba(255, 93, 122, .6); } 50% { transform: translateY(-8px) rotate(180deg); box-shadow: 0 0 0 4px var(--opp) inset, 0 0 30px rgba(255, 93, 122, 1); } }
@keyframes puckIn { from { opacity: 0; translate: 160px -60px; } to { opacity: 1; translate: 0 0; } }
.logo-tag { margin-top: 10px; color: var(--gold); font-weight: 800; letter-spacing: .12em; font-size: 15px; text-shadow: 0 0 12px rgba(255, 210, 63, .6); animation: fadeUp .6s .35s both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; }
.menu > * { animation: fadeUp .45s both; }
.menu > *:nth-child(2) { animation-delay: .08s; }
.menu > *:nth-child(3) { animation-delay: .16s; }
.hint { color: var(--sub); font-size: 13px; line-height: 1.7; margin: 0; word-break: keep-all; overflow-wrap: anywhere; }

/* ---- ボタン ---- */
.btn {
  appearance: none; border: 0; border-radius: 16px; padding: 14px 18px; font: 800 17px var(--font); color: #fff;
  cursor: pointer; position: relative; overflow: hidden; transition: transform .12s, box-shadow .2s, filter .2s; touch-action: manipulation;
}
.btn:active { transform: scale(.96); }
.btn.big { padding: 18px; font-size: 20px; }
.btn.small { padding: 9px 16px; font-size: 14px; }
.btn.primary { background: linear-gradient(180deg, #7b97ff, #4b64e8); box-shadow: 0 6px 0 #2a3a9a, 0 0 26px rgba(91, 124, 255, .55); }
.btn.primary:active { box-shadow: 0 2px 0 #2a3a9a, 0 0 18px rgba(91, 124, 255, .5); transform: translateY(4px) scale(.98); }
.btn.secondary { background: rgba(20, 32, 80, .85); box-shadow: inset 0 0 0 2px rgba(62, 201, 255, .65), 0 0 18px rgba(62, 201, 255, .25); color: #cfefff; }
.btn.ghost { background: transparent; color: var(--sub); box-shadow: inset 0 0 0 1.5px rgba(159, 176, 220, .35); }
.btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .28) 50%, transparent 70%); transform: translateX(-120%); }
.btn.primary::after { animation: btnShine 3.2s 1s infinite; }
@keyframes btnShine { 0% { transform: translateX(-120%); } 30%, 100% { transform: translateX(120%); } }
.btn[disabled] { filter: grayscale(.7) brightness(.7); }

/* ---- 上の帯と下の帯 ---- */
.bar { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
.bar h2 { margin: 0; font-size: 20px; font-weight: 900; flex: 1; }
.step { color: var(--gold); font-size: 13px; font-weight: 800; }
.back { appearance: none; border: 0; background: rgba(255, 255, 255, .07); color: var(--sub); font: 800 14px var(--font); padding: 9px 14px; border-radius: 12px; }
.back::before { content: "‹ "; }
.foot { display: flex; gap: 10px; padding-top: 12px; }
.foot .btn { flex: 1; }

/* ---- 選択のカード ---- */
.cards { flex: 1; display: grid; gap: 10px; align-content: start; padding: 4px 2px 8px; }
.cards.skills { grid-template-columns: 1fr 1fr; }
.cards.stages { grid-template-columns: 1fr 1fr; }
.card {
  position: relative; border-radius: 16px; padding: 10px; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--line);
  display: flex; flex-direction: column; gap: 6px; text-align: left; color: var(--text); font-family: var(--font);
  transition: transform .18s cubic-bezier(.2, 1.4, .3, 1), box-shadow .2s; animation: cardIn .45s both; border: 0; appearance: none;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }
.card.sel { transform: scale(1.03); box-shadow: inset 0 0 0 2.5px var(--c, var(--ui)), 0 0 22px var(--c, var(--ui)); }
.card.sel::before { content: "えらんだ"; position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 900; color: #0a0f24; background: var(--c, var(--ui)); padding: 2px 7px; border-radius: 8px; }
.card .ic { width: 64px; height: 64px; }
.card, .back, button { touch-action: manipulation; }   /* ダブルタップで拡大しない */
.card .nm { font-size: 17px; font-weight: 900; }
.card .ds { font-size: 12px; color: var(--sub); line-height: 1.5; white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere; }   /* 文の区切りは句読点でなく改行 */
.badge { align-self: center; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 8px; color: #0a0f24; }
.card { align-items: center; text-align: center; }   /* 技もステージも、マーク・名前・説明を中央にそろえる */
.card.stage canvas { margin-top: 16px; }   /* 「えらんだ」の札と重ならないように */
.card.stage canvas { width: 76px; height: 120px; }

/* ---- ロビー ---- */
.lobby { flex: 1; display: flex; flex-direction: column; gap: 14px; align-items: center; padding-top: 6px; }
.panel { width: 100%; max-width: 380px; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: fadeUp .4s both; }
.or { text-align: center; color: var(--sub); font-size: 13px; position: relative; }
.or::before, .or::after { content: ""; position: absolute; top: 50%; width: 32%; height: 1px; background: var(--line); }
.or::before { left: 0; } .or::after { right: 0; }
.lbl { color: var(--sub); font-size: 13px; font-weight: 700; }
.join { display: flex; gap: 10px; }
.join input {
  flex: 1; min-width: 0; font: 900 26px var(--font); letter-spacing: .3em; text-align: center; text-transform: uppercase;
  background: rgba(0, 0, 0, .35); color: #fff; border: 0; border-radius: 14px; padding: 10px; box-shadow: inset 0 0 0 2px rgba(91, 124, 255, .5);
  -webkit-user-select: text; user-select: text; touch-action: manipulation;
}
.join input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--me), 0 0 16px rgba(62, 201, 255, .4); }
.code { font-size: 54px; font-weight: 900; letter-spacing: .25em; text-align: center; color: var(--gold); text-shadow: 0 0 22px rgba(255, 210, 63, .55); padding-left: .25em; }
.url { font-size: 12px; color: #cfe0ff; word-break: break-all; background: rgba(0, 0, 0, .3); border-radius: 10px; padding: 10px; -webkit-user-select: text; user-select: text; }
.row { display: flex; gap: 10px; }
.row .btn { flex: 1; font-size: 15px; padding: 12px 10px; }
.status { color: var(--sub); font-size: 14px; text-align: center; min-height: 1.6em; padding: 0 10px; line-height: 1.6; white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere; }
.status.err { color: #ff9aac; }

/* ---- 待ち・結果 ---- */
.wait, .result { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; width: 100%; max-width: 360px; }
.wait p { color: var(--text); font-weight: 800; font-size: 17px; margin: 0; line-height: 1.6; }
.spinner { display: flex; gap: 10px; }
.spinner i { width: 16px; height: 16px; border-radius: 50%; background: var(--me); box-shadow: 0 0 14px var(--me); animation: bounce 1s infinite ease-in-out; }
.spinner i:nth-child(2) { animation-delay: .15s; background: var(--gold); box-shadow: 0 0 14px var(--gold); }
.spinner i:nth-child(3) { animation-delay: .3s; background: var(--opp); box-shadow: 0 0 14px var(--opp); }
@keyframes bounce { 0%, 100% { transform: translateY(0) scale(.8); opacity: .6; } 50% { transform: translateY(-14px) scale(1); opacity: 1; } }
.result-title { font-size: clamp(56px, 20vw, 88px); font-weight: 900; line-height: 1.1; animation: slam .7s cubic-bezier(.2, 1.6, .3, 1) both; }
.result-title.small { font-size: 34px; animation: fadeUp .4s both; }
.result-title.win { background: linear-gradient(180deg, #fff6c4, var(--gold) 55%, #ff9f43); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(255, 210, 63, .7)); }
.result-title.lose { color: #c6cde6; filter: drop-shadow(0 0 10px rgba(255, 93, 122, .5)); }
@keyframes slam { from { opacity: 0; transform: scale(2.6) rotate(-6deg); } to { opacity: 1; transform: none; } }
.result-score { font-size: 40px; font-weight: 900; letter-spacing: .08em; animation: fadeUp .5s .3s both; }
.result-score .me { color: var(--me); } .result-score .opp { color: var(--opp); }
.note { color: var(--sub); font-size: 14px; margin: 0; line-height: 1.7; min-height: 1em; white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere; }

/* ---- 試合中の一時停止ボタン（左上の角） ---- */
.pause-btn {
  position: fixed; z-index: 5; width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0;
  background: rgba(8, 14, 36, .55); box-shadow: inset 0 0 0 1.5px rgba(159, 176, 220, .35);
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.pause-btn i { width: 4px; height: 14px; border-radius: 2px; background: #c9d4f5; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--sb) + 26px); transform: translate(-50%, 30px); z-index: 30; opacity: 0;
  background: rgba(10, 16, 40, .95); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 800;
  box-shadow: inset 0 0 0 1.5px rgba(91, 124, 255, .5), 0 10px 30px rgba(0, 0, 0, .5); transition: .25s; pointer-events: none; width: max-content; max-width: 88vw; text-align: center; white-space: pre-line; word-break: keep-all; overflow-wrap: anywhere;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" async></script>
<script>
// ===== 01_util.js =====
'use strict';
/* =====================================================================
   小さな道具
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeOutBack = t => { t = clamp(t, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeInCubic = t => Math.pow(clamp(t, 0, 1), 3);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/* 色 '#rrggbb' → [r,g,b] と、明るさを変えた色・透明度つきの色 */
const rgbCache = new Map();
function rgb(hex) {
  let v = rgbCache.get(hex);
  if (!v) { const n = parseInt(hex.slice(1), 16); v = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; rgbCache.set(hex, v); }
  return v;
}
function rgba(hex, a) { const c = rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function shade(hex, k) {           // k>0 で白へ、k<0 で黒へ
  const c = rgb(hex).map(v => Math.round(k >= 0 ? v + (255 - v) * k : v * (1 + k)));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function mix(h1, h2, t) {
  const a = rgb(h1), b = rgb(h2);
  return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join('');
}

/* 端末に保存（使えない環境でも動くように） */
const store = {
  get(k, d) { try { const v = localStorage.getItem('airhockey_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('airhockey_' + k, JSON.stringify(v)); } catch (e) { /* 保存できなくても続ける */ } },
};

let toastTimer = 0;
function toast(msg, sec = 2.2) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), sec * 1000);
}

const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
/* 一時的に別のキャンバスへ描く（ステージの見本・技のアイコンに使う） */
function withCtx(c, fn) { const keep = ctx; ctx = c; try { fn(); } finally { ctx = keep; } }

// ===== 02_layout.js =====
'use strict';
/* =====================================================================
   画面と台の対応
   台の座標：x 0..W（左→右）、y 0..L（上→下）。y=0 が上のゴール（プレイヤー1が守る）、y=L が下のゴール（プレイヤー0が守る）
   flip=true（オンラインのゲスト）のときは台を180°回して表示し、自分のゴールが画面の下に来る
   ===================================================================== */
const Layout = {
  vw: 1, vh: 1, dpr: 1,
  safe: { t: 0, b: 0, l: 0, r: 0 },
  W: 500, L: GEO.TABLE_LEN, aspect: 0.5,
  scale: 1, ox: 0, oy: 0, flip: false,
  locked: false,        // 試合中は台の形を変えない（画面が変わったら収め直すだけ）
  onResize: [],

  measureSafe() {
    const probe = el('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;' +
      'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
    document.body.appendChild(probe);
    const cs = getComputedStyle(probe);
    this.safe = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
                  b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    probe.remove();
    const g = this.topGuard();                                      // 上端はノッチ・時計・サイト名の表示にかぶるので、少なくともこれだけ空ける
    this.safe.t = Math.max(this.safe.t, g);
    document.documentElement.style.setProperty('--guard-top', g + 'px');   // メニュー画面も同じだけ下げる
  },
  /* 上端に空ける幅（px）。スマホのブラウザで開いているときだけ（ホーム画面から開いたアプリ表示では safe-area に任せる） */
  topGuard() {
    const mm = q => !!(window.matchMedia && window.matchMedia(q).matches);
    const touch = mm('(pointer: coarse)') || (navigator.maxTouchPoints || 0) > 0;
    const app = mm('(display-mode: standalone)') || mm('(display-mode: fullscreen)') || navigator.standalone === true;
    if (!touch || app) return 0;
    let g = GEO.TOP_GUARD;
    const ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const sh = Math.max(screen.width || 0, screen.height || 0);
    if (ios && sh && window.innerHeight >= sh - 4) g = Math.max(g, GEO.TOP_GUARD_FULL);   // 画面の一番上（ステータスバーの下）まで描いているとき
    return g;
  },

  resize() {
    this.vw = Math.max(1, window.innerWidth);
    this.vh = Math.max(1, window.innerHeight);
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);          // 3倍の画面でも2倍で描く（見た目はほぼ同じで、ずっと軽い）
    canvas.width = Math.round(this.vw * this.dpr);
    canvas.height = Math.round(this.vh * this.dpr);
    canvas.style.width = this.vw + 'px';
    canvas.style.height = this.vh + 'px';
    this.measureSafe();
    if (!this.locked) this.setTableFromView(); else this.fit();
    for (const f of this.onResize) f();
  },

  /* CPU戦・ホスト：画面の縦横比に合わせて台の長さを決める */
  setTableFromView() {
    const h = Math.max(1, this.vh - this.safe.t - this.safe.b);
    this.aspect = clamp(this.vw / h, GEO.ASPECT_MIN, GEO.ASPECT_MAX);
    this.W = this.L * this.aspect;
    this.flip = false;
    this.fit();
  },
  /* ゲスト：ホストの台をそのまま使い、画面に収まるよう縮小。180°回転 */
  setTableFromAspect(aspect, flip) {
    this.aspect = clamp(aspect, GEO.ASPECT_MIN, GEO.ASPECT_MAX);
    this.W = this.L * this.aspect;
    this.flip = !!flip;
    this.fit();
  },
  /* 台を画面に収める（左右は画面の端いっぱい、上下は safe-area の内側。上端は topGuard の分も空ける） */
  fit() {
    const availH = Math.max(1, this.vh - this.safe.t - this.safe.b);
    this.scale = Math.min(this.vw / this.W, availH / this.L);
    this.ox = (this.vw - this.W * this.scale) / 2;
    this.oy = this.safe.t + (availH - this.L * this.scale) / 2;
  },

  toScreen(x, y) {
    if (this.flip) { x = this.W - x; y = this.L - y; }
    return { x: this.ox + x * this.scale, y: this.oy + y * this.scale };
  },
  toTable(sx, sy) {
    let x = (sx - this.ox) / this.scale, y = (sy - this.oy) / this.scale;
    if (this.flip) { x = this.W - x; y = this.L - y; }
    return { x, y };
  },
  deltaToTable(dx, dy) {
    const k = (this.flip ? -1 : 1) / this.scale;
    return { x: dx * k, y: dy * k };
  },
  /* 描画先を台の座標にする（c は描画先。省略時は画面） */
  applyTable(c = ctx) {
    const s = this.scale * this.dpr * (this.flip ? -1 : 1);
    const tx = (this.ox + (this.flip ? this.W * this.scale : 0)) * this.dpr;
    const ty = (this.oy + (this.flip ? this.L * this.scale : 0)) * this.dpr;
    c.setTransform(s, 0, 0, s, tx, ty);
  },
  /* 描画先を画面の座標（CSS px）にする */
  applyScreen(c = ctx) { c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); },

  init() {
    const r = () => this.resize();
    window.addEventListener('resize', r);
    window.addEventListener('orientationchange', () => setTimeout(r, 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', r);
    this.resize();
  },
};

// ===== 03_events.js =====
'use strict';
/* =====================================================================
   出来事の知らせ（当たった・得点した・技を使った…）
   演出・効果音・通信がそれぞれ受け取る。オンラインのゲストは、ホストから届いた出来事を同じ形で流す
   主な出来事と中身：
     mhit   [owner, power, x, y, nx, ny]   マレットで打ち返した（power は台長/秒）
     mtouch [owner, power, x, y]           マレットに軽く触れた
     hit    [kind, power, x, y, nx, ny]    壁・柱などに当たった（kind: wall/pillar/bumper/spring/sweeper/shutter/barrier）
     warp   [x1, y1, x2, y2]               ワープ穴を通った
     pop    [x, y, owner]                  分身が消えた
     goal   [scorer, x]                    得点
     skill  [owner, id]                    必殺技を発動した
     shot   [owner, id, x, y, vx, vy]      構えていた攻撃の技がショットにかかった
     second [x, y]                         2個目のパックが出た
     rally  [n]                            ラリー回数が増えた
     full   [owner]                        ゲージが満タンになった
     count  [n]                            カウントダウン（3,2,1,0=スタート）
     over   [winner]                       試合終了
   ===================================================================== */
const Events = {
  listeners: [],
  on(f) { this.listeners.push(f); },
  emit(type, ...a) { for (const f of this.listeners) f(type, a); },
};

// ===== 10_table.js =====
'use strict';
/* =====================================================================
   台の形
   - 左右の壁は画面の端（x=0, x=W）
   - 四隅は45°の斜めの壁（大きさ D）
   - goalHalf[owner]：そのプレイヤーが守るゴールの半幅（0＝下のゴール、1＝上のゴール）
   ===================================================================== */
const Table = {
  W: 500, L: GEO.TABLE_LEN, D: 120, mr: 37, pr: 25,
  goalHalf: [100, 100], goalBase: [100, 100], goalScale: [1, 1],
  walls: [],

  setup(W) {
    this.W = W;
    this.L = GEO.TABLE_LEN;
    this.D = W * GEO.CORNER_RATIO;
    this.mr = W * GEO.MALLET_R_RATIO;
    this.pr = W * GEO.PUCK_R_RATIO;
    const g = this.defaultGoal();
    this.goalBase = [g, g];
    this.goalScale = [1, 1];
    this.goalHalf = [g, g];
    this.buildWalls();
  },
  defaultGoal() { return this.W * GEO.GOAL_RATIO / 2; },
  goalY(owner) { return owner === 0 ? this.L : 0; },
  goalHalfMax() { return (this.W - 2 * this.D) / 2 - this.pr * 0.15; },
  /* ゴールの幅＝もとの幅（ステージで変わる）×必殺技の倍率。斜めの壁までが上限 */
  clampGoal() {
    const mx = this.goalHalfMax(), mn = this.pr * 1.3;
    for (const o of [0, 1]) this.goalHalf[o] = clamp(this.goalBase[o] * this.goalScale[o], mn, mx);
  },
  /* ゴール拡大の倍率をなめらかに変える（毎フレーム1回） */
  updateGoals(dt) {
    for (const o of [0, 1]) {
      const target = typeof Skills !== 'undefined' && Skills.state ? Skills.goalScale(o) : 1;
      this.goalScale[o] = dt > 0 ? this.goalScale[o] + (target - this.goalScale[o]) * (1 - Math.exp(-dt * 8)) : target;
    }
    this.clampGoal();
  },

  wall(ax, ay, bx, by, kind = 'wall', e = TUNE.WALL_RESTITUTION, side = -1) {
    return { ax, ay, bx, by, r: 0, vx: 0, vy: 0, e, kind, side };
  },

  /* 壁を作り直す（ゴールの幅が変わるステージがあるので、毎フレーム呼ぶ） */
  buildWalls() {
    const { W, L, D } = this, w = [];
    // 左右の壁。バネやワープ穴は Stage.sideZones で区間ごとに差し替える
    const zones = (typeof Stage !== 'undefined' && Stage.sideZones || []).slice().sort((a, b) => a.y0 - b.y0);
    for (const side of [0, 1]) {
      const x = side === 0 ? 0 : W;
      let y = D;
      for (const z of zones) {
        if (z.y0 > y) w.push(this.wall(x, y, x, z.y0, 'wall', TUNE.WALL_RESTITUTION, side));
        w.push(this.wall(x, z.y0, x, z.y1, z.kind, z.e != null ? z.e : TUNE.WALL_RESTITUTION, side));
        y = z.y1;
      }
      w.push(this.wall(x, y, x, L - D, 'wall', TUNE.WALL_RESTITUTION, side));
    }
    // 斜めの壁
    w.push(this.wall(0, D, D, 0), this.wall(W - D, 0, W, D), this.wall(0, L - D, D, L), this.wall(W - D, L, W, L - D));
    // ゴールの両側の壁（端がゴールポストになる）
    const g1 = this.goalHalf[1], g0 = this.goalHalf[0];
    w.push(this.wall(D, 0, W / 2 - g1, 0), this.wall(W / 2 + g1, 0, W - D, 0));
    w.push(this.wall(D, L, W / 2 - g0, L), this.wall(W / 2 + g0, L, W - D, L));
    this.walls = w;
  },

  /* マレットが動ける範囲：自分の陣地（半分）の中で、壁と斜めの壁の内側 */
  clampMallet(owner, x, y, mr = this.mr) {
    const { W, L, D } = this;
    let yy = owner === 0 ? y : L - y;           // 下側の人の向きにそろえて考える
    x = clamp(x, mr, W - mr);
    yy = clamp(yy, L / 2 + mr, L - mr);
    const k = D + mr * Math.SQRT2;
    let pen = k - (x + (L - yy));               // 左下の斜めの壁
    if (pen > 0) { x += pen / 2; yy -= pen / 2; }
    pen = k - ((W - x) + (L - yy));             // 右下の斜めの壁
    if (pen > 0) { x -= pen / 2; yy -= pen / 2; }
    x = clamp(x, mr, W - mr);
    yy = clamp(yy, L / 2 + mr, L - mr);
    return { x, y: owner === 0 ? yy : L - yy };
  },

  /* 必殺技ボタン（自分のゴール側の、斜めの壁の外の三角形）。台の外（画面の下の余白）へはみ出した所も含む */
  inButton(owner, x, y) {
    const { W, L, D } = this;
    const yy = owner === 0 ? L - y : y;
    if (yy > D) return false;
    return x + yy < D || (W - x) + yy < D;
  },
};

// ===== 11_collide.js =====
'use strict';
/* =====================================================================
   連続衝突判定の計算
   点 p が速度 v で T 秒動くあいだに、図形（円・カプセル）の半径 R の範囲に入る最初の時刻を求める。
   当たれば { t, nx, ny }（nx,ny は図形からパックへ向かう法線）、当たらなければ null
   ===================================================================== */
function sweepCircle(px, py, vx, vy, T, cx, cy, R) {
  const dx = px - cx, dy = py - cy;
  const b = dx * vx + dy * vy;
  if (b >= 0) return null;                          // 離れていく・すれ違う
  const a = vx * vx + vy * vy;
  if (a < 1e-12) return null;
  const c = dx * dx + dy * dy - R * R;
  let t;
  if (c <= 0) t = 0;                                // すでに重なっていて近づいている
  else {
    const disc = b * b - a * c;
    if (disc < 0) return null;
    t = (-b - Math.sqrt(disc)) / a;
    if (t < 0 || t > T) return null;
  }
  const hx = dx + vx * t, hy = dy + vy * t, hl = Math.hypot(hx, hy) || 1;
  return { t, nx: hx / hl, ny: hy / hl };
}

function sweepCapsule(px, py, vx, vy, T, ax, ay, bx, by, R) {
  const sx = bx - ax, sy = by - ay, len = Math.hypot(sx, sy);
  if (len < 1e-9) return sweepCircle(px, py, vx, vy, T, ax, ay, R);
  const ux = sx / len, uy = sy / len, nx = -uy, ny = ux;
  const d = (px - ax) * nx + (py - ay) * ny;        // 線分からの符号つき距離
  const side = d >= 0 ? 1 : -1;
  const dd = d * side, vn = (vx * nx + vy * ny) * side;
  let best = null;
  if (vn < 0) {                                     // 平らな面
    const t = dd <= R ? 0 : (dd - R) / -vn;
    if (t <= T) {
      const along = (px + vx * t - ax) * ux + (py + vy * t - ay) * uy;
      if (along >= 0 && along <= len) best = { t, nx: nx * side, ny: ny * side };
    }
  }
  const h1 = sweepCircle(px, py, vx, vy, T, ax, ay, R);   // 両端の丸い所
  if (h1 && (!best || h1.t < best.t)) best = h1;
  const h2 = sweepCircle(px, py, vx, vy, T, bx, by, R);
  if (h2 && (!best || h2.t < best.t)) best = h2;
  return best;
}

/* 点と線分の最短距離（重なりの確認用） */
function segDist(px, py, ax, ay, bx, by) {
  const sx = bx - ax, sy = by - ay, l2 = sx * sx + sy * sy;
  let t = l2 > 0 ? ((px - ax) * sx + (py - ay) * sy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = ax + sx * t, cy = ay + sy * t, dx = px - cx, dy = py - cy;
  return { d: Math.hypot(dx, dy), dx, dy };
}

// ===== 12_physics.js =====
'use strict';
/* =====================================================================
   物理（台の平面上で計算する）
   - パック：連続衝突判定で、壁・仕掛け・マレットをすり抜けない
   - マレット：指（またはCPU）の目標位置へ動く。速さは毎フレーム計算して、なめらかにする
   - 跳ね返り：パックとマレットの相対速度で計算（反発 0.7）
   ===================================================================== */
const Physics = {
  pucks: [],
  mallets: [],
  rally: 0,
  nextId: 1,
  onMalletHit: null,       // (puck, mallet, power, nx, ny) 打ち返しが数えられたとき（Match が設定）

  /* ラリーが続くほど上がる、打ち返しの強さの倍率 */
  power() { return Math.min(1 + TUNE.RALLY_POWER_GAIN * this.rally, TUNE.RALLY_POWER_MAX); },
  /* パックの最高速度（物理単位/秒）。ラリーで上限が上がる。剛速球はさらに上がる */
  maxSpeed(p) {
    const cap = Math.min(TUNE.PUCK_MAX_SPEED + TUNE.RALLY_SPEED_GAIN * this.rally, TUNE.RALLY_SPEED_MAX);
    return cap * Table.L * (p && p.boost || 1);
  },

  newPuck(x, y, vx = 0, vy = 0) {
    return { id: this.nextId++, x, y, vx, vy, r: Table.pr, lastHit: -1, cool: [0, 0], boost: 1, curve: 0,
             vis: 1, ghost: false, owner: -1, life: 0, dead: false, vanish: false, travel: 0,
             evCool: 0, still: 0, trail: [], born: 0 };
  },
  makeMallet(owner, x, y) {
    return { owner, x, y, px: x, py: y, tx: x, ty: y, vx: 0, vy: 0, ivx: 0, ivy: 0, r: Table.mr,
             heavy: false, speedLimit: 0, remote: false, rvx: 0, rvy: 0,
             active: true };                       // active=false：指を離していてマレットが消えている（パックは素通り）
  },

  /* マレットを目標位置へ動かし、速さを計算する */
  updateMallets(dt, only) {
    dt = Math.max(dt, 1e-4);
    const L = Table.L, vmax = PHYS.MALLET_V_MAX * L;
    const a = 1 - Math.exp(-dt / PHYS.MALLET_V_SMOOTH);
    for (const m of this.mallets) {
      if (only != null && m.owner !== only) continue;
      m.px = m.x; m.py = m.y;
      if (!m.active) { m.tx = m.x; m.ty = m.y; m.vx = m.vy = m.ivx = m.ivy = 0; continue; }
      let nx = m.tx, ny = m.ty;
      if (m.heavy && !m.remote) {                      // 重い腕：指に遅れてついてくる（相手の端末で動かすマレットは、向こうで遅れをかけ済み）
        const k = 1 - Math.exp(-dt / SKILL.HEAVY_LAG);
        nx = m.x + (m.tx - m.x) * k; ny = m.y + (m.ty - m.y) * k;
      }
      let capV = PHYS.MALLET_V_MAX;
      if (m.speedLimit) capV = Math.min(capV, m.speedLimit);
      if (m.heavy && !m.remote) capV = Math.min(capV, SKILL.HEAVY_V_MAX);
      if (m.remote) capV = PHYS.MALLET_V_MAX * 3;      // 相手の端末で動かしているマレットは、届いた位置へ追いつく
      const cap = capV * L * dt, dx = nx - m.x, dy = ny - m.y, dd = Math.hypot(dx, dy);
      if (dd > cap) { nx = m.x + dx * cap / dd; ny = m.y + dy * cap / dd; }
      const c = Table.clampMallet(m.owner, nx, ny, m.r);
      m.x = c.x; m.y = c.y;
      m.ivx = (m.x - m.px) / dt; m.ivy = (m.y - m.py) / dt;          // その場の速さ
      const tvx = m.remote ? m.rvx : m.ivx, tvy = m.remote ? m.rvy : m.ivy;
      m.vx += (tvx - m.vx) * a; m.vy += (tvy - m.vy) * a;            // なめらかにした速さ（打ち返しに使う）
      const sp = Math.hypot(m.vx, m.vy);
      if (sp > vmax) { m.vx *= vmax / sp; m.vy *= vmax / sp; }
    }
  },

  /* パックが当たる相手：壁・仕掛け・防壁・マレット */
  obstacles() {
    const obs = Table.walls.concat(Stage.shapes, Skills.shapes());
    for (const m of this.mallets) {
      if (!m.active) continue;                         // 消えているマレットには当たらない
      obs.push({ ax: m.px, ay: m.py, bx: m.px, by: m.py, r: m.r, vx: m.ivx, vy: m.ivy, mallet: m, kind: 'mallet' });
    }
    return obs;
  },

  /* 1フレーム進める。得点があれば得点者(0/1)、なければ -1 */
  step(dt) {
    dt = Math.max(dt, 1e-4);
    Table.clampGoal();
    Table.buildWalls();
    const obs = this.obstacles();
    const L = Table.L, n = Math.max(1, Math.ceil(dt / PHYS.SUBSTEP)), h = dt / n;
    const drag = Math.exp(-TUNE.FLOOR_DRAG * h);
    let result = -1;
    for (let s = 0; s < n && result < 0; s++) {
      const e0 = s * h;
      for (const p of this.pucks) {
        if (p.dead) continue;
        p.cool[0] -= h; p.cool[1] -= h; p.evCool -= h;
        Stage.applyZones(p, h);
        p.vx *= drag; p.vy *= drag;
        if (p.zig) Skills.stepZig(p, h);               // 稲妻：一定の間隔で折れ曲がる
        if (p.curve) {                                 // カーブ：進む向きがだんだん曲がる
          const a = p.curve * h, ca = Math.cos(a), sa = Math.sin(a);
          const vx = p.vx * ca - p.vy * sa, vy = p.vx * sa + p.vy * ca;
          p.vx = vx; p.vy = vy;
        }
        const x0 = p.x, y0 = p.y;
        movePuck(p, h, obs, e0);
        resolveOverlaps(p, obs, e0 + h);
        sanity(p);
        p.travel += Math.hypot(p.x - x0, p.y - y0);
        if (p.ghost) {                                 // 分身：時間切れで消える（ゴールに入ったときは下で得点にする）
          p.life -= h;
          if (p.life <= 0) p.dead = true;
        }
      }
      collidePucks(this.pucks);
      for (const p of this.pucks) {                    // 分身も、相手のゴールに入れば本物と同じく1点（どれか1つが入れば終わり）
        if (p.dead) continue;
        if (p.y < -p.r) {                              // 上のゴールに入った → 下の人(0)の得点
          if (p.ghost && p.owner !== 0) { p.dead = true; continue; }   // 打った人の自分のゴールに入った分身は、点にせず消す（自分のマレットをすり抜けるので）
          result = 0; p.scored = 0; break;
        }
        if (p.y > L + p.r) {
          if (p.ghost && p.owner !== 1) { p.dead = true; continue; }
          result = 1; p.scored = 1; break;
        }
      }
    }
    if (result < 0) for (const p of this.pucks) if (!p.dead) { unpinch(p, dt); sanity(p); }
    if (this.pucks.some(p => p.dead)) this.pucks = this.pucks.filter(p => !p.dead);
    return result;
  },

  /* 当たった音・演出の知らせ（同じパックから続けて出すぎないようにする） */
  hitEvent(p, kind, power, x, y, nx, ny) {
    if (power < 0.03) return;
    if (p.evCool > 0 && power < 0.5) return;
    p.evCool = 0.045;
    Events.emit('hit', kind, power, x, y, nx, ny, p.ghost ? 1 : 0);
  },
};

function clampSpeed(p) {
  const mx = Physics.maxSpeed(p), s2 = p.vx * p.vx + p.vy * p.vy;
  if (s2 > mx * mx) { const k = mx / Math.sqrt(s2); p.vx *= k; p.vy *= k; }
}

/* 連続衝突判定：当たる時刻まで進める→跳ね返す→残りの時間でまた進める */
function movePuck(p, dt, obs, e0) {
  let tr = dt, el = e0;
  for (let it = 0; it < 16 && tr > 1e-9; it++) {
    let best = null, bo = null;
    for (const o of obs) {
      if (o.off || (p.ghost && o.mallet && o.mallet.owner === p.owner)) continue;   // 分身は、打った人のマレットをすり抜ける
      // 動いている相手は、相手を止めた座標系（相対速度）で考える
      const hh = sweepCapsule(p.x - o.vx * el, p.y - o.vy * el, p.vx - o.vx, p.vy - o.vy, tr,
                              o.ax, o.ay, o.bx, o.by, p.r + o.r);
      if (hh && (!best || hh.t < best.t)) { best = hh; bo = o; }
    }
    if (!best) { p.x += p.vx * tr; p.y += p.vy * tr; return; }
    p.x += p.vx * best.t; p.y += p.vy * best.t;
    tr -= best.t; el += best.t;
    respond(p, bo, best.nx, best.ny);
    if (p.dead) return;
  }
  if (tr > 1e-9) { p.x += p.vx * tr; p.y += p.vy * tr; }
}

/* 当たった後の速度 */
function respond(p, o, nx, ny) {
  if (o.mallet) { respondMallet(p, o.mallet, nx, ny); return; }
  if (o.kind === 'warp') {                             // ワープ穴：反対側の壁から出てくる（向きと速さはそのまま）
    const x1 = p.x;
    p.x = o.side === 0 ? Table.W - p.r - 0.01 : p.r + 0.01;
    p.trail.length = 0;
    Events.emit('warp', x1, p.y, p.x, p.y);
    return;
  }
  const L = Table.L;
  const vn = (p.vx - o.vx) * nx + (p.vy - o.vy) * ny;
  if (vn >= 0) return;
  const k = (1 + o.e) * vn;
  p.vx -= k * nx; p.vy -= k * ny;
  if (o.kick) { p.vx += nx * o.kick * L; p.vy += ny * o.kick * L; }   // バンパーの押し出し
  if (p.zig) p.zig.dir = -p.zig.dir;                   // 稲妻：跳ね返ると左右も入れ替わるので、次に折れる向きも入れ替える（跳ね返った向きを中心にジグザグを続ける）
  clampSpeed(p);
  o.flash = 1;
  Physics.hitEvent(p, o.kind, -vn / L, p.x - nx * p.r, p.y - ny * p.r, nx, ny);
}

/*
  マレットとの跳ね返り（相対速度で計算）
    v_p' = v_m − e (v_p − v_m)   … 法線方向の成分
  止まったマレット（v_m=0）では v_p' = −e v_p で勢いが e 倍に落ちる。
  マレットを引きながら受ける（v_m ≒ v_p·e/(1+e)）と、パックはほぼ止まる。
  ラリーが続くほど、マレットが押し込む成分に強さの倍率がかかる。
*/
function respondMallet(p, m, nx, ny) {
  if (p.ghost) {                                       // 分身：相手のマレットに触れるとパッと消える
    p.dead = true;
    Events.emit('pop', p.x, p.y, p.owner);
    return;
  }
  const L = Table.L, P = Physics.power();
  const solve = (vx, vy) => {
    const vmn = vx * nx + vy * ny;
    const s = vmn > 0 ? vmn * (P - 1) : 0;
    const mx = vx + nx * s, my = vy + ny * s;
    return (p.vx - mx) * nx + (p.vy - my) * ny;
  };
  let vn = solve(m.vx, m.vy);                          // まず、なめらかにした速さで
  if (vn >= 0) vn = solve(m.ivx, m.ivy);               // 離れて見えるときは、その場の速さで
  if (vn < 0) {
    const k = (1 + TUNE.RESTITUTION) * vn;
    p.vx -= k * nx; p.vy -= k * ny;
    clampSpeed(p);
    const power = -vn / L;
    if (power > PHYS.HIT_MIN_SPEED && p.cool[m.owner] <= 0) {
      p.cool[m.owner] = PHYS.HIT_COOLDOWN;
      if (Physics.onMalletHit) Physics.onMalletHit(p, m, power, nx, ny);
    } else if (power > 0.03 && p.evCool <= 0) {
      p.evCool = 0.06;
      Events.emit('mtouch', m.owner, power, p.x - nx * p.r, p.y - ny * p.r);
    }
    return;
  }
  const v0 = (p.vx - m.ivx) * nx + (p.vy - m.ivy) * ny;   // どちらでも離れて見える：くっついたまま（反発なし）
  if (v0 < 0) { p.vx -= v0 * nx; p.vy -= v0 * ny; clampSpeed(p); }
}

/* 重なりの深さと押し出す向き。台の壁（太さ0の線）と防壁は、台の内側へだけ押し出す
   （中心が線の外へ出てしまっても、外へ押し出さないようにするため） */
function overlapOf(p, o, tEnd) {
  const ax = o.ax + o.vx * tEnd, ay = o.ay + o.vy * tEnd, bx = o.bx + o.vx * tEnd, by = o.by + o.vy * tEnd;
  const R = p.r + o.r;
  if (o.r === 0 || o.kind === 'barrier') {
    const sx = bx - ax, sy = by - ay, len = Math.hypot(sx, sy);
    if (len < 1e-9) return null;
    let nx = -sy / len, ny = sx / len;
    if ((Table.W / 2 - ax) * nx + (Table.L / 2 - ay) * ny < 0) { nx = -nx; ny = -ny; }
    const along = ((p.x - ax) * sx + (p.y - ay) * sy) / (len * len);
    if (along < 0 || along > 1) {                       // 線の端（ゴールポスト）：丸として扱う
      const ex = along < 0 ? ax : bx, ey = along < 0 ? ay : by, dx = p.x - ex, dy = p.y - ey, d = Math.hypot(dx, dy);
      if (d >= R - 1e-6 || d < 1e-9) return null;
      return { nx: dx / d, ny: dy / d, depth: R - d };
    }
    const d = (p.x - ax) * nx + (p.y - ay) * ny;
    if (d >= R - 1e-6 || d < -R * 3) return null;       // 大きく外にいるもの（ゴールの奥など）は相手にしない
    return { nx, ny, depth: R - d };
  }
  const q = segDist(p.x, p.y, ax, ay, bx, by);
  if (q.d >= R - 1e-6) return null;
  if (q.d > 1e-9) return { nx: q.dx / q.d, ny: q.dy / q.d, depth: R - q.d };
  const cx = Table.W / 2 - p.x, cy = Table.L / 2 - p.y, cd = Math.hypot(cx, cy) || 1;
  return { nx: cx / cd, ny: cy / cd, depth: R };
}

/* 万一めり込んだときの押し出し（連続衝突判定の取りこぼしに備える） */
function resolveOverlaps(p, obs, tEnd) {
  for (let pass = 0; pass < 2; pass++) {
    for (const o of obs) {
      if (p.dead) return;
      if (o.off || o.kind === 'warp' || (p.ghost && o.mallet && o.mallet.owner === p.owner)) continue;
      const h = overlapOf(p, o, tEnd);
      if (!h) continue;
      p.x += h.nx * h.depth; p.y += h.ny * h.depth;
      respond(p, o, h.nx, h.ny);
    }
  }
}

/* 壁や仕掛けとの重なりだけを押し出す（マレットとの挟み込みの処理に使う） */
function pushOutStatic(p, tEnd) {
  const list = Stage.shapes.concat(Skills.shapes(), Table.walls);   // 台の壁を最後に：往復する壁と台の壁に挟まれても、台の外へは押し出さない
  for (let pass = 0; pass < 2; pass++) {
    for (const o of list) {
      if (o.off) continue;                               // 挟み込みのときは、ワープ穴も壁として扱う（マレットで台の外へ押し出さない）
      const h = overlapOf(p, o, tEnd);
      if (!h) continue;
      p.x += h.nx * h.depth; p.y += h.ny * h.depth;
      const vn = p.vx * h.nx + p.vy * h.ny;
      if (vn < 0) { p.vx -= vn * h.nx; p.vy -= vn * h.ny; }
    }
  }
}

/* パックがマレットと壁に挟まれたとき：パックを壁の内側に残し、マレットのほうを押し戻す */
function unpinch(p, dt) {
  pushOutStatic(p, 0);                                 // マレットに押されて壁にめり込んでいたら、まず台の内側へ戻す
  for (const m of Physics.mallets) {
    if (!m.active || (p.ghost && m.owner === p.owner)) continue;
    let dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy);
    const R = p.r + m.r;
    if (d >= R - 0.01) continue;
    const nx = d > 1e-6 ? dx / d : 0, ny = d > 1e-6 ? dy / d : (m.owner === 0 ? -1 : 1);
    p.x = m.x + nx * R; p.y = m.y + ny * R;
    pushOutStatic(p, 0);
    dx = p.x - m.x; dy = p.y - m.y; d = Math.hypot(dx, dy);
    if (d < R - 0.01) {
      const ux = d > 1e-6 ? dx / d : nx, uy = d > 1e-6 ? dy / d : ny;
      const c = Table.clampMallet(m.owner, p.x - ux * R, p.y - uy * R, m.r);
      m.x = c.x; m.y = c.y;
    }
    const vn = (p.vx - m.ivx) * nx + (p.vy - m.ivy) * ny;
    if (vn < 0) { p.vx -= vn * nx; p.vy -= vn * ny; clampSpeed(p); }
  }
}

/* パック同士の衝突（2個のとき）。分身とは当たらない */
function collidePucks(pucks) {
  for (let i = 0; i < pucks.length; i++) {
    for (let j = i + 1; j < pucks.length; j++) {
      const a = pucks[i], b = pucks[j];
      if (a.ghost || b.ghost || a.dead || b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), R = a.r + b.r;
      if (d >= R || d < 1e-9) continue;
      const nx = dx / d, ny = dy / d, push = (R - d) / 2;
      a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
      const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (vn >= 0) continue;
      const k = vn * (1 + TUNE.WALL_RESTITUTION) / 2;
      a.vx += k * nx; a.vy += k * ny; b.vx -= k * nx; b.vy -= k * ny;
      clampSpeed(a); clampSpeed(b);
      if (a.evCool <= 0) { a.evCool = 0.05; Events.emit('hit', 'puck', -vn / Table.L, a.x + nx * a.r, a.y + ny * a.r, nx, ny, 0); }
    }
  }
}

/* 念のための安全装置：数値が壊れた・台の外へ出たときに戻す */
function sanity(p) {
  const { W, L } = Table;
  if (!isFinite(p.x) || !isFinite(p.y) || !isFinite(p.vx) || !isFinite(p.vy)) {
    p.x = W / 2; p.y = L / 2; p.vx = 0; p.vy = 0; return;
  }
  if (p.x < p.r - 2) { p.x = p.r; p.vx = Math.abs(p.vx); }
  if (p.x > W - p.r + 2) { p.x = W - p.r; p.vx = -Math.abs(p.vx); }
  const inMouth = g => Math.abs(p.x - W / 2) < g;
  if (p.y < p.r && !inMouth(Table.goalHalf[1])) {
    if (p.y < -p.r * 0.5) { p.y = p.r; p.vy = Math.abs(p.vy); }
  }
  if (p.y > L - p.r && !inMouth(Table.goalHalf[0])) {
    if (p.y > L + p.r * 0.5) { p.y = L - p.r; p.vy = -Math.abs(p.vy); }
  }
}

// ===== 13_stage.js =====
'use strict';
/* =====================================================================
   ステージの仕掛け
     shapes    … パックが跳ね返るカプセル（柱・バンパー・往復する壁・シャッター）
     sideZones … 左右の壁の区間の差し替え（バネ・ワープ穴）。Table.buildWalls が使う
     zones     … 床（矢印で加速・減速の床）
   どの仕掛けも上下・左右に対称に置く（ゲストは台を180°回して見るので、どちらから見ても同じ形）
   ===================================================================== */
const Stage = {
  id: 'pillars', t: 0, dark: false,
  shapes: [], sideZones: [], zones: [], sweeper: null, shutters: [],
  shutterInfo: { side: 0, cover: 0, warn: 0 },

  load(id) {
    const { W, L } = Table;
    this.id = id; this.t = 0; this.dark = false;
    Table.goalBase = [Table.defaultGoal(), Table.defaultGoal()];   // ゴールの幅は、ステージごとに元へ戻す
    this.shapes = []; this.sideZones = []; this.zones = [];
    this.sweeper = null; this.shutters = [];
    this.shutterInfo = { side: 0, cover: 0, warn: 0 };

    const circle = (x, y, r, kind, extra) =>
      Object.assign({ ax: x, ay: y, bx: x, by: y, r, vx: 0, vy: 0, e: TUNE.WALL_RESTITUTION, kind, flash: 0 }, extra);
    const bumper = (x, y, r) => circle(x, y, r, 'bumper', { e: 1, kick: STG.BUMPER_KICK });
    const pillar = (x, y, r) => circle(x, y, r, 'pillar');
    const four = (x, y, make) => {                  // 上下左右に対称な4か所（重なる場所は1つ）
      const seen = new Set();
      for (const q of [[x, y], [W - x, y], [x, L - y], [W - x, L - y]]) {
        const key = q[0].toFixed(2) + ',' + q[1].toFixed(2);
        if (!seen.has(key)) { seen.add(key); this.shapes.push(make(q[0], q[1])); }
      }
    };

    switch (id) {
      case 'pillars':                               // 中央の柱と、4つのバンパー
        this.shapes.push(pillar(W / 2, L / 2, W * 0.065));
        four(W * 0.22, L * 0.38, (x, y) => bumper(x, y, W * 0.042));
        break;
      case 'sweeper':                               // 中央線の上を左右に往復する壁
        this.sweeper = circle(W / 2, L / 2, W * 0.022, 'sweeper');
        this.shapes.push(this.sweeper);
        this.updateSweeper();
        break;
      case 'spring':                                // 左右の壁の一部がバネ + 中央の柱
        this.sideZones = [
          { y0: L * 0.30, y1: L * 0.40, kind: 'spring', e: STG.SPRING_E },
          { y0: L * 0.60, y1: L * 0.70, kind: 'spring', e: STG.SPRING_E },
        ];
        this.shapes.push(pillar(W / 2, L / 2, W * 0.05));
        break;
      case 'boost': {                               // 矢印の床（自分の陣地から相手のゴールへ向けて加速）+ 中央の減速の床
        const x0 = W * 0.05, x1 = W * 0.33;
        this.zones.push(
          { type: 'arrow', x0, x1, y0: L * 0.58, y1: L * 0.78, dx: 0, dy: -1 },
          { type: 'arrow', x0: W - x1, x1: W - x0, y0: L * 0.58, y1: L * 0.78, dx: 0, dy: -1 },
          { type: 'arrow', x0, x1, y0: L * 0.22, y1: L * 0.42, dx: 0, dy: 1 },
          { type: 'arrow', x0: W - x1, x1: W - x0, y0: L * 0.22, y1: L * 0.42, dx: 0, dy: 1 },
          { type: 'slow', x0: W * 0.36, x1: W * 0.64, y0: L * 0.44, y1: L * 0.56 });
        break;
      }
      case 'warp':                                  // 左の壁の穴 ⇔ 右の壁の穴 + 中央のバンパー
        this.sideZones = [
          { y0: L * 0.36, y1: L * 0.46, kind: 'warp' },
          { y0: L * 0.54, y1: L * 0.64, kind: 'warp' },
        ];
        this.shapes.push(bumper(W / 2, L / 2, W * 0.045));
        break;
      case 'shutter':                               // ゴール前のシャッター + 中央の柱
        for (const owner of [0, 1]) {
          const s = circle(W / 2, Table.goalY(owner), W * 0.03, 'shutter', { off: true, owner });
          this.shutters.push(s);
          this.shapes.push(s);
        }
        this.shapes.push(pillar(W / 2, L / 2, W * 0.05));
        this.updateShutters();
        break;
      case 'pulse':                                 // ゴールの幅が広がったり狭まったり + 4つのバンパー
        four(W * 0.22, L * 0.5, (x, y) => bumper(x, y, W * 0.04));
        this.updatePulse();
        break;
      case 'dark':                                  // 暗いステージ：中央線に柱を3本（当たった音で位置が分かる）
        this.dark = true;
        this.shapes.push(pillar(W * 0.25, L / 2, W * 0.045), pillar(W * 0.5, L / 2, W * 0.06), pillar(W * 0.75, L / 2, W * 0.045));
        break;
    }
  },

  /* 時間を進める（ゲストは、ホストから届いた時刻を set で入れる） */
  update(dt) { this.set(this.t + dt, dt); },
  set(t, dt = 0) {
    this.t = t;
    for (const s of this.shapes) if (s.flash > 0) s.flash = Math.max(0, s.flash - dt * 4);
    if (this.sweeper) this.updateSweeper();
    if (this.shutters.length) this.updateShutters();
    if (this.id === 'pulse') this.updatePulse();
  },

  /* 往復する壁：sin で左右に動く。速度も持たせて、動く壁に当たったときの跳ね返りを正しくする */
  updateSweeper() {
    const s = this.sweeper, W = Table.W, hl = W * STG.SWEEP_LEN / 2;
    const A = W / 2 - hl - s.r - W * 0.02, w = TAU / STG.SWEEP_PERIOD;
    const cx = W / 2 + A * Math.sin(w * this.t);
    s.ax = cx - hl; s.bx = cx + hl; s.ay = s.by = Table.L / 2;
    s.vx = A * w * Math.cos(w * this.t); s.vy = 0;
  },

  /* シャッター：開く → 左半分をふさぐ → 開く → 右半分をふさぐ（上下のゴールは同時） */
  updateShutters() {
    const O = STG.SHUTTER_OPEN, C = STG.SHUTTER_CLOSED, M = STG.SHUTTER_MOVE, cyc = 2 * (O + C);
    const t = ((this.t % cyc) + cyc) % cyc;
    let side = 0, cover = 0, warn = 0, next = -1;
    if (t >= O && t < O + C) { side = -1; const k = t - O; cover = Math.min(1, k / M, (C - k) / M); }
    else if (t >= 2 * O + C) { side = 1; const k = t - (2 * O + C); cover = Math.min(1, k / M, (C - k) / M); }
    else {                                           // 開いている間：閉まる直前に予告
      const until = t < O ? O - t : 2 * O + C - t;
      next = t < O ? -1 : 1;
      warn = until < STG.SHUTTER_WARN ? 1 - until / STG.SHUTTER_WARN : 0;
    }
    cover = clamp(cover, 0, 1);
    this.shutterInfo = { side: side || next, cover, warn };
    for (const s of this.shutters) {
      const gh = Table.goalHalf[s.owner], cx = Table.W / 2;
      s.off = cover < 0.02;
      if (side < 0) { s.ax = cx - gh; s.bx = cx - gh + gh * cover; }
      else { s.bx = cx + gh; s.ax = cx + gh - gh * cover; }
      s.ay = s.by = Table.goalY(s.owner);
      s.cover = cover;
    }
  },

  /* ゴールの幅：両方のゴールが同時に広がったり狭まったりする */
  updatePulse() {
    const W = Table.W, mid = (STG.PULSE_MIN + STG.PULSE_MAX) / 2, amp = (STG.PULSE_MAX - STG.PULSE_MIN) / 2;
    const gh = W * (mid + amp * Math.sin(TAU * this.t / STG.PULSE_PERIOD));
    Table.goalBase = [gh, gh];
  },

  /* 床の効果：矢印は向きへ加速、減速の床はゆっくりにする */
  applyZones(p, h) {
    for (const z of this.zones) {
      if (p.x < z.x0 || p.x > z.x1 || p.y < z.y0 || p.y > z.y1) continue;
      if (z.type === 'arrow') {
        const a = STG.ARROW_ACCEL * Table.L * h;
        p.vx += z.dx * a; p.vy += z.dy * a;
        clampSpeed(p);
        p.zoneArrow = 0.15;
      } else {
        const k = Math.exp(-STG.SLOW_DRAG * h);
        p.vx *= k; p.vy *= k;
        p.zoneSlow = 0.15;
      }
    }
  },
};

// ===== 14_skills.js =====
'use strict';
/* =====================================================================
   必殺技
   - 攻撃（剛速球・カーブ・分身・消える球・稲妻・ミニ球）：押したあと、次に弾いたショットにかかる
   - 守り（防壁・巨大化・衝撃波）・妨害（重い腕・ゴール拡大・反転）：押した瞬間に効く
   技はいきなり使われるのが面白いので、発動の瞬間の演出（止まる・揺れる・音）は出さない。
   効いている間の様子（壁・大きなマレット・重り など）だけが見える。
   状態は Skills.state にまとめる（オンラインではホストから送る）。数値は、その効果を受けている人ごと
   ===================================================================== */
const Skills = {
  state: null,
  freeze: 0,                                                       // 発動で止まる残り時間（いまは 0 のまま）

  fresh() { return { armed: [null, null], wall: [0, 0], heavy: [0, 0], giant: [0, 0], wide: [0, 0], mirror: [0, 0] }; },
  reset() { this.state = this.fresh(); this.freeze = 0; },
  /* 得点後の仕切り直し：時間で効く技は消える。構え中の技は次のショットまで持ち越す */
  resetPoint() {
    const armed = this.state.armed;
    this.state = this.fresh();
    this.state.armed = armed;
    this.freeze = 0;
    this.applyMallets(0);
  },

  /* 防壁：ゴールの口をふさぐ壁 */
  shapes() {
    const out = [];
    for (const owner of [0, 1]) {
      if (this.state.wall[owner] <= 0) continue;
      const gy = Table.goalY(owner), gh = Table.goalHalf[owner], cx = Table.W / 2;
      out.push({ ax: cx - gh - Table.pr * 0.3, ay: gy, bx: cx + gh + Table.pr * 0.3, by: gy, r: Table.W * SKILL.WALL_THICK,
                 vx: 0, vy: 0, e: TUNE.WALL_RESTITUTION, kind: 'barrier', owner });
    }
    return out;
  },
  /* ゴール拡大：そのプレイヤーのゴールの幅の倍率 */
  goalScale(o) { return this.state.wide[o] > 0 ? SKILL.WIDE_SCALE : 1; },

  update(dt) {
    const s = this.state;
    for (const k of ['wall', 'heavy', 'giant', 'wide', 'mirror']) for (const o of [0, 1]) s[k][o] = Math.max(0, s[k][o] - dt);
    this.applyMallets(dt);
    this.updateVanish();
    this.freeze = Math.max(0, this.freeze - dt);
  },
  /* そのプレイヤーのマレットの（なろうとしている）大きさ。巨大化中は大きい */
  malletR(o) { return Table.mr * (this.state.giant[o] > 0 ? SKILL.GIANT_SCALE : 1); },
  /* マレットへの効果：重い腕・反転・巨大化（大きさはなめらかに変える） */
  applyMallets(dt) {
    const s = this.state;
    for (const m of Physics.mallets) {
      m.heavy = s.heavy[m.owner] > 0;
      m.mirror = s.mirror[m.owner] > 0;
      const target = this.malletR(m.owner);
      m.r = dt > 0 ? m.r + (target - m.r) * (1 - Math.exp(-dt * 12)) : target;
      if (Math.abs(m.r - target) < 0.05) m.r = target;
    }
  },
  /* 消える球：飛んだ距離で見え方が変わる */
  updateVanish() {
    for (const p of Physics.pucks) {
      if (!p.vanish) { p.vis = 1; continue; }
      const k = p.travel / Table.L;
      p.vis = k < SKILL.VANISH_FROM ? 1
        : k < SKILL.VANISH_FULL ? 1 - (k - SKILL.VANISH_FROM) / (SKILL.VANISH_FULL - SKILL.VANISH_FROM)
        : k < SKILL.VANISH_BACK ? 0
        : k < SKILL.VANISH_END ? (k - SKILL.VANISH_BACK) / (SKILL.VANISH_END - SKILL.VANISH_BACK) : 1;
    }
  },

  /* その技をいま使えるか。衝撃波はマレットから出るので、マレットが出ている（指を置いている）ときだけ */
  canActivate(owner) {
    const m = Physics.mallets[owner];
    if (Match.skill[owner] === 'shock') return !!(m && m.active);
    return true;
  },

  /* ボタンが押されたとき（ゲージが満タンで、プレー中だけ Match から呼ばれる） */
  activate(owner) {
    const id = Match.skill[owner], sk = SKILLS.find(s => s.id === id);
    if (!sk) return;
    const s = this.state, foe = 1 - owner;
    if (sk.type === 'attack') s.armed[owner] = id;
    else if (id === 'wall') s.wall[owner] = SKILL.WALL_TIME;
    else if (id === 'giant') s.giant[owner] = SKILL.GIANT_TIME;
    else if (id === 'shock') this.shock(owner);
    else if (id === 'heavy') s.heavy[foe] = SKILL.HEAVY_TIME;
    else if (id === 'widegoal') s.wide[foe] = SKILL.WIDE_TIME;
    else if (id === 'mirror') s.mirror[foe] = SKILL.MIRROR_TIME;
    this.applyMallets(0);
    this.freeze = SKILL.FREEZE;
    Events.emit('skill', owner, id);
  },

  /* 衝撃波：近くのパックを、相手の陣地のほうへ吹き飛ばす（自分のゴールへは飛ばさない） */
  shock(owner) {
    const m = Physics.mallets[owner], L = Table.L, R = SKILL.SHOCK_RANGE * L, toward = owner === 0 ? -1 : 1;
    if (!m || !m.active) return;
    Events.emit('shockwave', owner, m.x, m.y);
    for (const p of Physics.pucks) {
      const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy);
      if (d > R) continue;
      let nx = d > 1e-6 ? dx / d : 0, ny = d > 1e-6 ? dy / d : toward;
      if (ny * toward < 0.45) { ny = toward * 0.75; nx = Math.sign(nx || 1) * Math.sqrt(1 - ny * ny); }   // 相手の陣地のほうへ向け直す
      const k = SKILL.SHOCK_POWER * L * (0.5 + 0.5 * (1 - d / R));
      p.vx = nx * k; p.vy = ny * k;
      clampSpeed(p);
      if (!p.ghost) p.lastHit = owner;
    }
  },

  /* パックにかかっているショットの効果を消す（打ち返したとき・中央から出し直すとき） */
  clearShot(p) {
    p.boost = 1; p.curve = 0; p.vanish = false; p.vis = 1; p.travel = 0; p.zig = null; p.r = Table.pr; p.skill = null;
  },

  /* マレットでパックを打ち返したとき。前のショットの効果を消し、構えていた技をかける */
  onMalletHit(p, m) {
    this.clearShot(p);
    for (const q of Physics.pucks) if (q.ghost && q.owner !== m.owner) { q.dead = true; Events.emit('pop', q.x, q.y, q.owner); }
    const id = this.state.armed[m.owner];
    if (!id) return;
    this.state.armed[m.owner] = null;
    this.applyShot(id, p, m);
    Events.emit('shot', m.owner, id, p.x, p.y, p.vx, p.vy);
  },

  applyShot(id, p, m) {
    const rot = (q, a) => {
      const c = Math.cos(a), s = Math.sin(a), vx = q.vx * c - q.vy * s, vy = q.vx * s + q.vy * c;
      q.vx = vx; q.vy = vy;
    };
    p.skill = id; p.skillOwner = m.owner;
    if (id === 'fast') {                              // 剛速球：上限の速さで飛ぶ
      p.boost = SKILL.FAST_BOOST;
      let sp = Math.hypot(p.vx, p.vy);
      if (sp < 1e-6) { p.vx = p.x - m.x; p.vy = p.y - m.y; sp = Math.hypot(p.vx, p.vy) || 1; }
      const k = Physics.maxSpeed(p) / sp;
      p.vx *= k; p.vy *= k;
    } else if (id === 'curve') {                      // カーブ：振った向きと逆へ曲がって戻ってくる。真っすぐ打てば中央へ曲がる
      const lateral = m.vx * (m.owner === 0 ? 1 : -1);  // 打った人から見て右へ振ったら正
      let dir;
      if (Math.abs(lateral) > 0.25 * Table.L) dir = lateral > 0 ? -1 : 1;
      else dir = (p.x > Table.W / 2 ? -1 : 1) * (m.owner === 0 ? 1 : -1);
      p.curve = dir * SKILL.CURVE_RATE;
    } else if (id === 'split') {                      // 分身：3つに分かれる。本物の向きはランダム
      const a = SKILL.SPLIT_ANGLE, offs = [-a, 0, a];
      for (let i = offs.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [offs[i], offs[j]] = [offs[j], offs[i]]; }
      rot(p, offs[0]);
      for (let i = 1; i < 3; i++) {
        const g = Physics.newPuck(p.x, p.y, p.vx, p.vy);
        rot(g, offs[i] - offs[0]);
        g.ghost = true; g.owner = m.owner; g.life = SKILL.SPLIT_LIFE; g.lastHit = p.lastHit;
        g.skill = 'split'; g.skillOwner = m.owner;
        Physics.pucks.push(g);
      }
    } else if (id === 'vanish') {                     // 消える球：途中で見えなくなる
      p.vanish = true; p.travel = 0;
    } else if (id === 'zigzag') {                     // 稲妻：一定の間隔で左右に折れ曲がる（最初は半分だけ曲げて、元の向きを中心にジグザグ）
      p.zig = { t: SKILL.ZIG_PERIOD * 0.5, dir: Math.random() < 0.5 ? 1 : -1, first: true };
    } else if (id === 'mini') {                       // ミニ球：パックが小さくなる（当たり判定も小さい）
      p.r = Table.pr * SKILL.MINI_SCALE;
    }
  },

  /* 稲妻の折れ曲がり（物理の細かい1歩ごとに呼ばれる） */
  stepZig(p, h) {
    const z = p.zig;
    z.t -= h;
    if (z.t > 0) return;
    const a = (z.first ? SKILL.ZIG_ANGLE / 2 : SKILL.ZIG_ANGLE) * z.dir;
    const c = Math.cos(a), s = Math.sin(a), vx = p.vx * c - p.vy * s, vy = p.vx * s + p.vy * c;
    p.vx = vx; p.vy = vy;
    z.dir = -z.dir; z.first = false; z.t += SKILL.ZIG_PERIOD;
  },
};
Skills.reset();

// ===== 15_match.js =====
'use strict';
/* =====================================================================
   試合の進行
   mode: 'cpu'（ひとり）／'host'（オンラインで部屋を作った側。物理を担当）／'guest'（参加した側。表示と入力だけ）
   プレイヤー番号：0＝台の下側（CPU戦の自分・ホスト）、1＝台の上側（CPU・ゲスト）
   ===================================================================== */
const Match = {
  active: false, paused: false,
  mode: 'cpu',
  me: 0,
  state: 'idle',            // idle / countdown / play / goal / over
  timer: 0, t: 0,
  score: [0, 0],
  rally: 0,
  gauge: [0, 0],
  skill: ['fast', 'fast'],
  stageId: 'pillars',
  server: 0,
  second: false,
  pendingSecond: false,
  intro: true,
  hitStop: 0,
  stall: 0,
  lastGoal: null,           // { scorer, x, t }
  opts: null,

  start(opts) {
    this.opts = opts;
    this.mode = opts.mode;
    this.me = opts.mode === 'guest' ? 1 : 0;
    this.skill = opts.skills.slice();
    this.stageId = opts.stage;
    Layout.locked = false;
    if (this.mode === 'guest') Layout.setTableFromAspect(opts.aspect, true);
    else Layout.setTableFromView();
    Layout.locked = true;
    Table.setup(Layout.W);
    Stage.load(this.stageId);
    this.score = [0, 0];
    this.gauge = [0, 0];
    this.t = 0;
    this.paused = false;
    Physics.mallets = [0, 1].map(o => Physics.makeMallet(o, Table.W / 2, o === 0 ? Table.L * 0.82 : Table.L * 0.18));
    for (const m of Physics.mallets) m.active = this.mode === 'cpu' && m.owner === 1;   // 人のマレットは、指を置くまで出てこない
    Physics.nextId = 1;
    Skills.reset();
    Input.reset();
    CPU.reset();
    if (typeof Fx !== 'undefined') Fx.reset();
    this.active = true;
    this.resetPoint(opts.server != null ? opts.server : (Math.random() < 0.5 ? 0 : 1));
    this.state = 'countdown';
    this.intro = true;
    this.timer = FLOW.COUNTDOWN;
    this.lastCount = FLOW.COUNTDOWN + 1;
    Game.enterMatch();
  },

  /* 次のサーブの準備：パックを1個、サーブする側の陣地に置く */
  resetPoint(server) {
    this.server = server;
    this.rally = 0;
    Physics.rally = 0;
    this.second = false;
    this.pendingSecond = false;
    this.hitStop = 0;
    this.stall = 0;
    const { W, L } = Table;
    for (const m of Physics.mallets) {
      const cpu = this.mode === 'cpu' && m.owner === 1;
      if (cpu || !m.active) {                        // CPU と、消えている（指を離している）マレットは定位置へ。指で持っているマレットはそのまま
        m.x = m.px = m.tx = W / 2;
        m.y = m.py = m.ty = m.owner === 0 ? L * 0.82 : L * 0.18;
      }
      m.vx = m.vy = m.ivx = m.ivy = 0;
    }
    Skills.resetPoint();
    Physics.pucks = this.mode === 'guest' ? [] : [Physics.newPuck(W / 2, server === 0 ? L * 0.64 : L * 0.36)];
    Stage.load(this.stageId);
    Table.buildWalls();
  },

  /* 画面に出すゲージ。相手が攻撃の技を構えている間は、満タンのまま見せる（構えたことを相手に知らせない） */
  shownGauge(o) {
    if (o !== this.me && Skills.state && Skills.state.armed[o]) return 1;
    return this.gauge[o];
  },

  /* マレットでパックを打ち返したとき（物理から呼ばれる） */
  onMalletHit(p, m, power, nx, ny) {
    if (p.lastHit !== m.owner) {                     // 両者の打ち返しだけをラリーに数える
      this.rally++;
      Physics.rally = this.rally;
      Events.emit('rally', this.rally);
      if (this.rally >= TUNE.SECOND_PUCK_RALLY && !this.second) this.pendingSecond = true;
    }
    p.lastHit = m.owner;
    Skills.onMalletHit(p, m);
    const before = this.gauge[m.owner];
    this.gauge[m.owner] = Math.min(1, before + TUNE.GAUGE_PER_HIT);
    if (before < 1 && this.gauge[m.owner] >= 1) Events.emit('full', m.owner);
    if (power > FX.HITSTOP_POWER) this.hitStop = Math.max(this.hitStop, Math.min(FX.HITSTOP_MAX, 0.012 * power));
    Events.emit('mhit', m.owner, power, p.x - nx * p.r, p.y - ny * p.r, nx, ny);
  },

  /* 必殺技ボタン。ゲージが満タンで、プレー中だけ発動する */
  pressSkill(owner) {
    if (this.state !== 'play' || this.gauge[owner] < 1 || !Skills.canActivate(owner)) return false;
    this.gauge[owner] = 0;
    Skills.activate(owner);
    return true;
  },

  /* 中央の近くで、柱・往復する壁・マレット・ほかのパックに重ならない場所（重なって出ると、はじかれて跳ぶため） */
  freeSpot(x, y) {
    const { W, L, pr } = Table;
    const clear = (cx, cy) => {
      for (const o of Stage.shapes) {
        if (o.off) continue;
        const margin = pr * 0.4 + Math.hypot(o.vx || 0, o.vy || 0) * 0.25;   // 動く壁は、少し先まで空けておく
        if (segDist(cx, cy, o.ax, o.ay, o.bx, o.by).d < pr + o.r + margin) return false;
      }
      for (const m of Physics.mallets) if (m.active && Math.hypot(cx - m.x, cy - m.y) < pr + m.r + pr * 0.4) return false;
      for (const q of Physics.pucks) if (!q.ghost && Math.hypot(cx - q.x, cy - q.y) < pr * 2.4) return false;
      return true;
    };
    for (const dy of [0, -0.07, 0.07, -0.13, 0.13]) for (const dx of [0, -0.14, 0.14, -0.26, 0.26, -0.36, 0.36]) {
      const cx = clamp(x + dx * W, pr * 1.2, W - pr * 1.2), cy = y + dy * L;
      if (clear(cx, cy)) return { x: cx, y: cy };
    }
    return { x, y };
  },

  /* ラリーが続いたら、中央から2個目のパックを出す */
  spawnSecond() {
    this.pendingSecond = false;
    this.second = true;
    const { W, L } = Table, dir = Math.random() < 0.5 ? -1 : 1;
    const at = this.freeSpot(W / 2 + rand(-0.12, 0.12) * W, L / 2);
    const p = Physics.newPuck(at.x, at.y, rand(-0.15, 0.15) * L, dir * 0.45 * L);
    p.born = 0.6;
    Physics.pucks.push(p);
    Events.emit('second', p.x, p.y);
  },

  onGoal(scorer, x) {
    this.score[scorer]++;
    this.lastGoal = { scorer, x: clamp(x, 0, Table.W), t: this.t };
    Physics.pucks = [];
    this.pendingSecond = false;
    this.server = 1 - scorer;                        // 失点した側からサーブ
    this.state = 'goal';
    this.timer = FLOW.GOAL_PAUSE;
    Events.emit('goal', scorer, this.lastGoal.x);
  },

  /* 1フレーム進める（CPU戦とホスト） */
  update(dt) {
    if (!this.active || this.paused) return;
    this.t += dt;
    Physics.rally = this.rally;
    Skills.update(dt);
    if (this.mode === 'cpu') CPU.update(dt);
    Physics.updateMallets(dt);
    Table.updateGoals(dt);                         // ゴール拡大の幅をなめらかに変える
    Table.buildWalls();
    switch (this.state) {
      case 'countdown': {
        this.timer -= dt;
        const n = Math.max(0, Math.ceil(this.timer));
        if (this.intro && n < this.lastCount) { this.lastCount = n; Events.emit('count', n); }
        if (this.timer <= 0) { this.state = 'play'; if (!this.intro) Events.emit('count', 0, 1); }   // 得点後のサーブ：音だけ
        Stage.update(dt);
        break;
      }
      case 'play': {
        if (Skills.freeze > 0 || this.hitStop > 0) {   // 必殺技の発動・強打で、パックが一瞬止まる
          this.hitStop = Math.max(0, this.hitStop - dt);
          Stage.update(dt * 0.15);
          break;
        }
        const scorer = Physics.step(dt);
        Stage.update(dt);
        if (scorer >= 0) {
          const sp = Physics.pucks.find(p => p.scored === scorer);
          this.onGoal(scorer, sp ? sp.x : Table.W / 2);
        } else {
          if (this.pendingSecond) this.spawnSecond();
          this.checkStall(dt);
        }
        break;
      }
      case 'goal':
        this.timer -= dt;
        Stage.update(dt);
        if (this.timer <= 0) {
          if (Math.max(this.score[0], this.score[1]) >= TUNE.WIN_SCORE) this.finish();
          else { this.resetPoint(this.server); this.state = 'countdown'; this.intro = false; this.timer = FLOW.SERVE_WAIT; }
        }
        break;
    }
  },

  /* パックがほとんど動かないまま時間がたったら、中央から出し直す（置きっぱなし対策） */
  checkStall(dt) {
    const real = Physics.pucks.filter(p => !p.ghost);
    const slow = real.length && real.every(p => Math.hypot(p.vx, p.vy) < 0.04 * Table.L);
    this.stall = slow ? this.stall + dt : 0;
    if (this.stall > PHYS.STALL_TIME) {
      this.stall = 0;
      const p = real[0];
      Skills.clearShot(p);                           // ミニ球・稲妻などの効果は残さない
      const others = Physics.pucks; Physics.pucks = Physics.pucks.filter(q => q !== p);   // 自分自身とは比べない
      const at = this.freeSpot(Table.W / 2, Table.L / 2);
      Physics.pucks = others;
      p.x = at.x; p.y = at.y;
      p.vx = rand(-0.1, 0.1) * Table.L; p.vy = (Math.random() < 0.5 ? -1 : 1) * 0.3 * Table.L;
      p.trail.length = 0;
      Events.emit('second', p.x, p.y);
    }
  },

  finish() {
    this.state = 'over';
    this.active = false;
    const winner = this.score[0] > this.score[1] ? 0 : 1;
    Events.emit('over', winner);
    if (this.mode === 'host') Net.onMatchOver();
    Game.exitMatch();
    UI.showResult(winner === this.me, this.score[this.me], this.score[1 - this.me]);
  },

  /* 試合をやめる（タイトルへ） */
  abort() {
    this.active = false;
    this.state = 'idle';
    Physics.pucks = [];
    Game.exitMatch();
  },
};

// ===== 16_cpu.js =====
'use strict';
/* =====================================================================
   CPU（台の上側＝プレイヤー1）
   - パックを追って打ち返す。強く打つときと、弱く当てるときを使い分ける
   - 速い球が来たら、ゴールの前で待ち構える
   - ゲージが満タンになったら、技に合った場面で必殺技を使う
   CPU も分身にはだまされる（本物と区別しない）
   ===================================================================== */
const CPU = {
  think: 0, mode: 'home', strikeT: 0, skillWait: null, skillPatience: 0,
  tx: 0, ty: 0, speed: AI.SPEED, aim: null,

  reset() {
    this.think = 0; this.mode = 'home'; this.strikeT = 0; this.skillWait = null; this.skillPatience = 0;
    this.aim = null;
  },

  update(dt) {
    const m = Physics.mallets[1];
    if (!m) return;
    this.skillLogic(dt);
    if (this.mode === 'strike') {
      this.strikeT -= dt;
      if (this.strikeT <= 0) { this.mode = 'home'; this.think = 0; }
    }
    this.think -= dt;
    if (this.think <= 0 && this.mode !== 'strike') { this.think = AI.THINK; this.decide(m); }
    m.tx = this.tx; m.ty = this.ty;
    if (m.mirror) m.tx = m.x - (this.tx - m.x);                       // 反転されている：思った向きと左右逆に動いてしまう
    m.speedLimit = this.speed;
  },

  /* まっすぐ進んだときの位置（左右の壁での跳ね返りだけ考える） */
  predict(p, t) {
    const { W } = Table, r = p.r, P = 2 * (W - 2 * r);
    let u = ((p.x + p.vx * t - r) % P + P) % P;
    const x = u > P / 2 ? r + P - u : r + u;
    return { x, y: p.y + p.vy * t };
  },

  /* いちばん気にするべきパックを選ぶ */
  target() {
    const L = Table.L;
    let best = null, bestScore = Infinity;
    for (const p of Physics.pucks) {
      if (p.vis < 0.3 && Math.random() < 0.5) continue;           // 見えない球は見失うことがある
      const toward = p.vy < 0;
      let score = p.y;                                            // 自分のゴール（上）に近いほど急ぐ
      if (toward) score -= Math.min(L * 0.4, -p.vy * 0.3);
      if (!toward && p.y > L / 2) score += L;
      if (score < bestScore) { bestScore = score; best = p; }
    }
    return best;
  },

  decide(m) {
    const { W, L, pr } = Table, mr = Math.max(m.r, Skills.malletR(m.owner));   // 巨大化中は大きさに合わせて立つ位置を変える
    const p = this.target();
    const homeY = L * 0.12;
    this.speed = AI.SPEED;
    if (!p || Match.state !== 'play') {                           // 待機：ゴールの前で、パックの横の位置を少し追う
      const px = p ? p.x : W / 2;
      this.tx = lerp(W / 2, px, 0.3); this.ty = homeY;
      return;
    }
    const sp = Math.hypot(p.vx, p.vy);
    // 守り：速い球が自分のゴールへ向かってくる
    if (p.vy < -0.7 * L && p.y > L * 0.28) {
      const yDef = L * 0.13, t = (p.y - yDef) / -p.vy;
      const q = this.predict(p, t);
      const gh = Table.goalHalf[1];
      this.tx = clamp(q.x, W / 2 - gh - mr * 0.3, W / 2 + gh + mr * 0.3);
      this.ty = yDef;
      this.speed = AI.SPEED * 1.25;
      return;
    }
    // 相手の陣地にあって、こちらへ来ない：待機
    if (p.y > L / 2 + pr && p.vy >= -0.15 * L) {
      this.tx = lerp(W / 2, p.x, 0.35); this.ty = homeY;
      return;
    }
    // 攻め：パックの後ろへ回り込んで、狙った向きへ打つ
    const dist = Math.hypot(p.x - m.x, p.y - m.y);
    const tau = clamp(dist / (AI.SPEED * L) * 0.6, 0, 0.3);
    const q = this.predict(p, tau);
    q.y = clamp(q.y, pr, L / 2 + pr * 0.5);
    if (!this.aim || Math.random() < 0.08) {
      const r = Math.random(), err = rand(-1, 1) * AI.AIM_ERROR * W;
      this.aim = r < 0.6 ? { x: W / 2 + err, y: L + pr } : r < 0.8 ? { x: -W / 2 + err, y: L } : { x: W * 1.5 + err, y: L };
      this.strong = Math.random() < AI.STRONG_RATE;
    }
    let dx = this.aim.x - q.x, dy = this.aim.y - q.y, dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    const R = pr + mr;
    const ax = q.x - dx * R * 1.15, ay = q.y - dy * R * 1.15;          // 打つ前に立つ場所（パックの後ろ）
    const rx = m.x - q.x, ry = m.y - q.y;
    const behind = rx * dx + ry * dy;                                 // 負なら、パックの後ろにいる
    const side = -rx * dy + ry * dx;
    const near = Math.hypot(m.x - ax, m.y - ay);
    if (behind < -R * 0.5 && Math.abs(side) < R * 0.7 && (near < mr * 0.9 || sp < 0.3 * L)) {
      // 打つ：パックを突き抜ける位置へ、決めた速さで振る
      const k = this.strong ? 2.2 : 1.4;
      this.tx = q.x + dx * R * k; this.ty = q.y + dy * R * k;
      this.speed = this.strong ? AI.STRIKE_STRONG : AI.STRIKE_WEAK;
      this.mode = 'strike'; this.strikeT = this.strong ? 0.2 : 0.3;
      this.aim = null;
      return;
    }
    if (behind > -R * 0.3 && dist < R * 2.4) {                        // パックの前にいる：横から回り込む（自分のゴールへ押さない）
      const s = side >= 0 ? 1 : -1;
      this.tx = q.x + (-dy) * s * R * 1.5 - dx * R * 0.8;
      this.ty = q.y + dx * s * R * 1.5 - dy * R * 0.8;
      if (this.ty < m.r) this.ty = m.r;
      return;
    }
    this.tx = ax; this.ty = ay;
  },

  /* 必殺技：満タンになってから少し待ち、技に合った場面で使う */
  skillLogic(dt) {
    if (Match.state !== 'play' || Match.gauge[1] < 1) { this.skillWait = null; return; }
    if (this.skillWait == null) { this.skillWait = rand(AI.SKILL_DELAY[0], AI.SKILL_DELAY[1]); this.skillPatience = 0; }
    this.skillWait -= dt;
    if (this.skillWait > 0) return;
    this.skillPatience += dt;
    const L = Table.L, ps = Physics.pucks.filter(p => !p.ghost), m = Physics.mallets[1];
    const id = Match.skill[1], sk = SKILLS.find(s => s.id === id);
    let good = false;
    if (sk.type === 'attack') good = !Skills.state.armed[1] && ps.some(p => p.y < L * 0.55 || p.vy < 0);   // これから打つとき
    else if (id === 'wall' || id === 'giant') good = ps.some(p => p.vy < -0.9 * L && p.y < L * 0.7);    // 速い球が来るとき
    else if (id === 'shock') good = ps.some(p => Math.hypot(p.x - m.x, p.y - m.y) < SKILL.SHOCK_RANGE * L * 0.6 && p.y < L * 0.5);   // 自分の陣地で近いとき
    else if (id === 'widegoal') good = ps.some(p => p.y < L * 0.45 && Math.hypot(p.vx, p.vy) < 1.2 * L);                        // これから打つとき
    else good = ps.some(p => p.vy > 0.4 * L && p.y < L * 0.6);                                                                   // 相手が受けるとき
    if (good || this.skillPatience > 4) {
      if (Match.pressSkill(1)) this.skillWait = null;
    }
  },
};

// ===== 20_input.js =====
'use strict';
/* =====================================================================
   操作（マルチタッチ）
   - 指ごとに識別する。必殺技ボタン（自分の側の三角形）の中で触り始めた指だけがボタン
   - それ以外の最初の指がマレット用。指を置くと、指の少し上にマレットが現れ（指で隠れない）、そこから指が動いた分だけ動く
   - マレット用の指を離したとき、ほかに触れている指があれば、その指がマレット用を引き継ぐ。指がなくなるとマレットは消える（パックは素通り）
   ===================================================================== */
const Input = {
  fingers: new Map(),       // pointerId → { role: 'mallet' | 'button' | 'idle', x, y }
  malletId: null,

  reset() {
    this.fingers.clear(); this.malletId = null;
    this.hide();
  },
  /* 自分のマレットを消す（指を離したとき） */
  hide() {
    const m = Physics.mallets[Match.me];
    if (m && Game.state === 'match') { m.active = false; m.vx = m.vy = m.ivx = m.ivy = 0; }
  },
  /* 指の少し上にマレットを出す（指でマレットが隠れないように） */
  show(sx, sy) {
    const m = Physics.mallets[Match.me];
    if (!m || !this.active()) return;
    const t = Layout.toTable(sx, sy - (Math.max(m.r, Skills.malletR(Match.me)) * Layout.scale + 34));   // 巨大化中は、大きくなった分だけ上に出す
    const c = Table.clampMallet(Match.me, t.x, t.y, m.r);
    m.x = m.px = m.tx = c.x; m.y = m.py = m.ty = c.y;
    m.vx = m.vy = m.ivx = m.ivy = 0;
    m.active = true;
  },

  active() { return Game.state === 'match' && Match.active && !Match.paused; },

  down(e) {
    if (Game.state !== 'match') return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 取れなくても動く */ }
    Sound.unlock();
    const id = e.pointerId, t = Layout.toTable(e.clientX, e.clientY);
    if (Table.inButton(Match.me, t.x, t.y)) {
      this.fingers.set(id, { role: 'button', x: e.clientX, y: e.clientY });
      this.pressButton(t.x);
      return;
    }
    const role = this.malletId == null ? 'mallet' : 'idle';
    if (role === 'mallet') { this.malletId = id; this.show(e.clientX, e.clientY); }
    this.fingers.set(id, { role, x: e.clientX, y: e.clientY });
  },

  move(e) {
    const f = this.fingers.get(e.pointerId);
    if (!f) return;
    if (e.cancelable) e.preventDefault();
    const dx = e.clientX - f.x, dy = e.clientY - f.y;
    f.x = e.clientX; f.y = e.clientY;
    if (f.role !== 'mallet' || !this.active()) return;
    const m = Physics.mallets[Match.me];
    if (!m) return;
    if (!m.active) { this.show(e.clientX, e.clientY); return; }   // 一時停止明けなどで消えていたら、指の上に出す
    const d = Layout.deltaToTable(dx, dy);
