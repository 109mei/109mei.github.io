    if (m.mirror) d.x = -d.x;                                     // 反転：左右の操作が逆になる
    const c = Table.clampMallet(Match.me, m.tx + d.x, m.ty + d.y, m.r);
    m.tx = c.x; m.ty = c.y;
  },

  up(e) {
    const id = e.pointerId;
    if (!this.fingers.has(id)) return;
    this.fingers.delete(id);
    if (id === this.malletId) {
      this.malletId = null;
      for (const [k, g] of this.fingers) if (g.role === 'idle') { g.role = 'mallet'; this.malletId = k; break; }   // 残っている指が引き継ぐ（マレットはそのまま）
      if (this.malletId == null) this.hide();                                                                   // 指がなくなったら消える
    }
  },

  /* 必殺技ボタン */
  pressButton(x) {
    if (!this.active()) return;
    const side = x < Table.W / 2 ? 0 : 1;
    if (Match.mode === 'guest') {
      if (Match.gauge[Match.me] >= 1 && Match.state === 'play' && Skills.canActivate(Match.me)) Net.sendPress();
      else Fx.denied(side);
      return;
    }
    if (!Match.pressSkill(Match.me)) Fx.denied(side);
  },

  init() {
    canvas.addEventListener('pointerdown', e => this.down(e), { passive: false });
    window.addEventListener('pointermove', e => this.move(e), { passive: false });
    window.addEventListener('pointerup', e => this.up(e));
    window.addEventListener('pointercancel', e => this.up(e));
    window.addEventListener('blur', () => this.reset());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.reset(); });
  },
};

// ===== 30_sound.js =====
'use strict';
/* =====================================================================
   効果音（すべて Web Audio API で合成する。音声ファイルは使わない）
   - ブラウザの自動再生制限があるので、最初のタップで音を有効にする
   - iPhone のマナーモードでも鳴るよう、対応環境では navigator.audioSession.type = "playback"
   - 当たった位置に合わせて左右に振る。暗いステージでは左右の振りを大きくし、自分のマレットに近いほど大きくする
   ===================================================================== */
const Sound = {
  ac: null, master: null, bus: null, noiseBuf: null,
  unlocked: false,
  on: store.get('sound', true),

  init() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* 未対応 */ }
    const u = () => this.unlock();
    window.addEventListener('pointerdown', u, true);
    window.addEventListener('touchend', u, true);
    window.addEventListener('keydown', u, true);
    Events.on((type, a) => { try { this.event(type, a); } catch (e) { /* 音で止めない */ } });
  },

  unlock() {
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ac = new AC({ latencyHint: 'interactive' });
        const comp = this.ac.createDynamicsCompressor();
        comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 5;
        comp.attack.value = 0.003; comp.release.value = 0.2;
        this.master = this.ac.createGain();
        this.master.gain.value = this.on ? 0.9 : 0;
        this.master.connect(comp); comp.connect(this.ac.destination);
        this.bus = this.master;
        const len = this.ac.sampleRate * 2, buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
      }
      if (this.ac.state !== 'running') { const r = this.ac.resume(); if (r && r.catch) r.catch(() => {}); }   // suspended・interrupted（iOS）から戻す
      if (!this.unlocked) {                              // 無音を1回鳴らして、iOS で音を出せる状態にする
        const b = this.ac.createBuffer(1, 1, 22050), s = this.ac.createBufferSource();
        s.buffer = b; s.connect(this.ac.destination); s.start(0);
        this.unlocked = true;
      }
    } catch (e) { /* 音が出せない環境でも遊べる */ }
  },

  setOn(v) {
    this.on = v; store.set('sound', v);
    if (this.master) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ac.currentTime, 0.02);
  },
  ready() { return this.ac && this.ac.state === 'running' && this.on; },

  /* 出口：音量 → 左右 → 全体 */
  out(vol, pan, t) {
    const g = this.ac.createGain();
    g.gain.value = vol;
    if (this.ac.createStereoPanner) {
      const p = this.ac.createStereoPanner();
      p.pan.setValueAtTime(clamp(pan || 0, -1, 1), t || this.ac.currentTime);
      g.connect(p); p.connect(this.bus);
      g.panner = p;
    } else g.connect(this.bus);
    return g;
  },
  /* 音の高さが変わる単音 */
  tone(o) {
    const ac = this.ac, t = ac.currentTime + (o.delay || 0), dur = o.dur || 0.1;
    const osc = ac.createOscillator(), env = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + dur * (o.glide || 1));
    if (o.detune) osc.detune.value = o.detune;
    const a = o.attack || 0.004;
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(1, t + a);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = env;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; env.connect(f); node = f; }
    osc.connect(env);
    node.connect(this.out(o.vol, o.pan, t));
    if (o.lfo) {                                        // 音のゆれ（バネ・妨害の音）
      const l = ac.createOscillator(), lg = ac.createGain();
      l.frequency.value = o.lfo[0]; lg.gain.value = o.lfo[1];
      l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05);
    }
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  /* ノイズ（こすれ・破裂・風） */
  noise(o) {
    const ac = this.ac, t = ac.currentTime + (o.delay || 0), dur = o.dur || 0.1;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), env = ac.createGain();
    src.buffer = this.noiseBuf;
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.f0 || 1000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    f.Q.value = o.Q || 1;
    const a = o.attack || 0.002;
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(1, t + a);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(env);
    const out = this.out(o.vol, o.pan, t);
    if (o.pan2 != null && out.panner) out.panner.pan.linearRampToValueAtTime(clamp(o.pan2, -1, 1), t + dur);
    env.connect(out);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
  },
  chord(notes, o) { notes.forEach((f, i) => this.tone(Object.assign({}, o, { f0: f, delay: (o.delay || 0) + i * (o.step || 0) }))); },

  /* 位置から、左右の振りと距離の音量を決める */
  place(x, y) {
    const W = Table.W || 1, L = Table.L, dark = Stage.dark && Game.state === 'match';
    let pan = (x / W) * 2 - 1;
    if (Layout.flip) pan = -pan;
    pan *= dark ? 0.95 : 0.4;
    let vol = 1;
    const m = Physics.mallets[Match.me];
    if (m && y != null) {
      const d = Math.hypot(x - m.x, y - m.y) / L;
      vol = dark ? 0.12 + 0.88 * Math.exp(-d * 3.2) : 0.7 + 0.3 * Math.exp(-d * 2);
    }
    return { pan, vol };
  },

  event(type, a) {
    if (!this.ready() || Game.state !== 'match') return;
    switch (type) {
      case 'mhit': return this.malletHit(a[0], a[1], a[2], a[3]);
      case 'mtouch': { const q = this.place(a[2], a[3]); return this.noise({ f0: 900, filter: 'lowpass', dur: 0.04, vol: 0.12 * q.vol, pan: q.pan }); }
      case 'hit': return this.objectHit(a[0], a[1], a[2], a[3]);
      case 'warp': return this.warp(a[0], a[1], a[2]);
      case 'pop': { const q = this.place(a[0], a[1]);
        this.tone({ f0: 420, f1: 1500, dur: 0.09, vol: 0.28 * q.vol, pan: q.pan });
        return this.noise({ f0: 3000, dur: 0.05, vol: 0.12 * q.vol, pan: q.pan, Q: 2 }); }
      case 'goal': return this.goal(a[0], a[1]);
      case 'skill': return;                                   // 発動の瞬間は鳴らさない（いきなり使われるのが面白い）
      case 'shockwave': { const q = this.place(a[1], a[2]);
        this.tone({ f0: 120, f1: 45, dur: 0.35, vol: 0.4 * q.vol, pan: q.pan });
        return this.noise({ f0: 600, f1: 3000, dur: 0.3, vol: 0.3 * q.vol, pan: q.pan, Q: 2 }); }
      case 'shot': return this.shot(a[0], a[1], a[2], a[3]);
      case 'second':
        this.tone({ f0: 880, dur: 0.12, vol: 0.18, type: 'square', lp: 2500 });
        this.tone({ f0: 660, dur: 0.12, vol: 0.18, type: 'square', lp: 2500, delay: 0.14 });
        this.tone({ f0: 880, dur: 0.12, vol: 0.18, type: 'square', lp: 2500, delay: 0.28 });
        return this.tone({ f0: 1400, f1: 200, dur: 0.5, vol: 0.2, delay: 0.42 });
      case 'rally':
        if (a[0] > 0 && a[0] % 5 === 0) this.chord([1568, 2093, 2637], { dur: 0.18, vol: 0.09, step: 0.05, type: 'triangle' });
        return;
      case 'full':
        if (a[0] === Match.me) return this.chord([1319, 1661, 1976, 2637], { dur: 0.25, vol: 0.12, step: 0.06, type: 'triangle' });
        return this.chord([988, 784], { dur: 0.22, vol: 0.1, step: 0.09, type: 'triangle' });
      case 'count':
        if (a[0] > 0) return this.tone({ f0: 660, dur: 0.14, vol: 0.2, type: 'triangle' });
        if (a[1]) return this.tone({ f0: 990, dur: 0.18, vol: 0.14, type: 'triangle' });   // 得点後のサーブ：短い合図
        this.tone({ f0: 1320, dur: 0.35, vol: 0.2, type: 'triangle' });
        return this.noise({ f0: 2000, f1: 6000, dur: 0.25, vol: 0.08 });
      case 'over': return this.fanfare(a[0] === Match.me);
    }
  },

  malletHit(owner, power, x, y) {
    const k = clamp(power / 3, 0, 1), q = this.place(x, y), v = q.vol;
    const base = owner === Match.me ? 1 : 0.92;
    this.tone({ f0: (170 + 140 * k) * base, f1: 60, dur: 0.13 + 0.05 * k, vol: (0.32 + 0.4 * k) * v, pan: q.pan });
    this.noise({ f0: 1800 + 2600 * k, dur: 0.045, vol: (0.2 + 0.35 * k) * v, pan: q.pan, Q: 1.3 });
    if (k > 0.55) {                                     // 強打：破裂音と低い響き
      this.noise({ f0: 5000, filter: 'highpass', dur: 0.09, vol: 0.22 * k * v, pan: q.pan });
      this.tone({ f0: 90, f1: 40, dur: 0.3, vol: 0.35 * k * v, pan: q.pan });
    }
  },

  objectHit(kind, power, x, y) {
    const k = clamp(power / 2.5, 0.08, 1), q = this.place(x, y), v = q.vol * k, pan = q.pan;
    switch (kind) {
      case 'wall':                                     // 木をたたくような短い音
        this.tone({ f0: 330, f1: 210, dur: 0.07, vol: 0.32 * v, pan });
        this.noise({ f0: 1500, dur: 0.04, vol: 0.22 * v, pan, Q: 2 });
        break;
      case 'pillar':                                   // 金属の柱：キンと響く
        [[880, 0.45, 0.2], [2430, 0.3, 0.1], [4750, 0.16, 0.06]].forEach(([f, d, a]) => this.tone({ f0: f, dur: d, vol: a * 1.6 * v, pan }));
        break;
      case 'bumper':                                   // バンパー：ボヨン
        this.tone({ f0: 260, f1: 760, dur: 0.18, vol: 0.38 * v, pan, glide: 0.6 });
        this.tone({ f0: 520, f1: 1100, dur: 0.12, vol: 0.12 * v, pan, type: 'triangle' });
        break;
      case 'spring':                                   // バネ：ビヨーン
        this.tone({ f0: 620, f1: 240, dur: 0.38, vol: 0.32 * v, pan, lfo: [26, 90], type: 'triangle' });
        break;
      case 'sweeper':                                  // 動く壁：重いドン
        this.tone({ f0: 150, f1: 80, dur: 0.14, vol: 0.45 * v, pan });
        this.noise({ f0: 700, filter: 'lowpass', dur: 0.08, vol: 0.25 * v, pan });
        break;
      case 'shutter':                                  // シャッター：ガシャン
        this.tone({ f0: 240, dur: 0.07, vol: 0.18 * v, pan, type: 'square', lp: 1800 });
        this.noise({ f0: 3200, dur: 0.12, vol: 0.3 * v, pan, Q: 3 });
        this.tone({ f0: 1900, dur: 0.15, vol: 0.08 * v, pan });
        break;
      case 'barrier':                                  // 防壁：ビッと弾く
        this.tone({ f0: 1100, f1: 300, dur: 0.16, vol: 0.2 * v, pan, type: 'sawtooth', lp: 3000 });
        this.noise({ f0: 6000, filter: 'highpass', dur: 0.08, vol: 0.15 * v, pan });
        break;
      case 'puck':                                     // パック同士：カチッ
        this.tone({ f0: 1900, dur: 0.035, vol: 0.2 * v, pan });
        this.noise({ f0: 5200, dur: 0.03, vol: 0.18 * v, pan, Q: 2 });
        break;
      default:
        this.noise({ f0: 1200, dur: 0.05, vol: 0.2 * v, pan });
    }
  },

  warp(x1, y, x2) {
    const a = this.place(x1, y), b = this.place(x2, y);
    this.noise({ f0: 350, f1: 3200, dur: 0.32, vol: 0.3 * a.vol, pan: a.pan, pan2: b.pan, Q: 3 });
    this.tone({ f0: 260, f1: 1300, dur: 0.28, vol: 0.12 * a.vol, pan: b.pan, type: 'triangle' });
  },

  goal(scorer, x) {
    const mine = scorer === Match.me;
    this.noise({ f0: 2400, f1: 160, filter: 'lowpass', dur: 0.9, vol: 0.55, attack: 0.005 });
    this.tone({ f0: 110, f1: 38, dur: 0.6, vol: 0.5 });
    if (mine) this.chord([523, 659, 784, 1047], { dur: 0.45, vol: 0.13, step: 0.08, type: 'triangle', delay: 0.1 });
    else this.chord([392, 311, 262], { dur: 0.42, vol: 0.12, step: 0.12, type: 'triangle', delay: 0.12 });
  },

  shot(owner, id, x, y) {
    const q = this.place(x, y);
    if (id === 'fast') {
      this.tone({ f0: 80, f1: 35, dur: 0.4, vol: 0.5 * q.vol, pan: q.pan });
      this.noise({ f0: 3500, f1: 500, filter: 'lowpass', dur: 0.6, vol: 0.35 * q.vol, pan: q.pan });
    } else if (id === 'curve') {
      this.noise({ f0: 900, f1: 4200, dur: 0.35, vol: 0.28 * q.vol, pan: q.pan, Q: 5 });
    } else if (id === 'split') {
      [1500, 1620, 1760].forEach((f, i) => this.tone({ f0: f, dur: 0.35, vol: 0.09 * q.vol, pan: q.pan, delay: i * 0.03, type: 'triangle' }));
    } else if (id === 'zigzag') {                     // 稲妻：バチッ
      this.noise({ f0: 4000, filter: 'highpass', dur: 0.12, vol: 0.3 * q.vol, pan: q.pan });
      this.tone({ f0: 900, f1: 300, dur: 0.12, vol: 0.12 * q.vol, pan: q.pan, type: 'sawtooth', lp: 4000, lfo: [60, 300] });
    } else if (id === 'mini') {                       // ミニ球：シュッと縮む
      this.tone({ f0: 1400, f1: 2600, dur: 0.12, vol: 0.12 * q.vol, pan: q.pan, type: 'triangle' });
    } else if (id === 'vanish') {
      this.tone({ f0: 1300, f1: 380, dur: 0.55, vol: 0.14 * q.vol, pan: q.pan, attack: 0.08, type: 'triangle' });
    }
  },

  fanfare(win) {
    if (win) {
      this.chord([523, 659, 784], { dur: 0.22, vol: 0.14, step: 0.12, type: 'triangle' });
      this.chord([1047, 1319, 1568], { dur: 0.9, vol: 0.1, step: 0, type: 'triangle', delay: 0.4 });
    } else {
      this.chord([440, 415, 392, 330], { dur: 0.4, vol: 0.12, step: 0.2, type: 'triangle' });
    }
  },
  appear() { if (this.ready() && Game.state === 'match') this.tone({ f0: 520, f1: 900, dur: 0.07, vol: 0.08, type: 'triangle' }); },
  ui() { if (this.ready()) this.tone({ f0: 1250, f1: 900, dur: 0.05, vol: 0.1, type: 'triangle' }); },
  denied() { if (this.ready()) this.tone({ f0: 150, dur: 0.09, vol: 0.12, type: 'square', lp: 800 }); },
};

// ===== 31_sound_slide.js =====
'use strict';
/* =====================================================================
   暗いステージの滑走音
   パックごとに、こすれる音（ノイズ）と、かすかな音程（三角波）を鳴らし続ける
   - パックの横の位置で左右に振る（左にあれば左から）
   - 自分のマレットに近いほど大きく、速いほど高く
   ===================================================================== */
const Slide = {
  ch: new Map(),            // パックのID → 音のつながり

  make() {
    const ac = Sound.ac;
    const src = ac.createBufferSource();
    src.buffer = Sound.noiseBuf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4; bp.frequency.value = 600;
    const osc = ac.createOscillator(); osc.type = 'triangle'; osc.frequency.value = 200;
    const og = ac.createGain(); og.gain.value = 0.22;
    const gain = ac.createGain(); gain.gain.value = 0;
    src.connect(bp); bp.connect(gain);
    osc.connect(og); og.connect(gain);
    let pan = null;
    if (ac.createStereoPanner) { pan = ac.createStereoPanner(); gain.connect(pan); pan.connect(Sound.bus); }
    else gain.connect(Sound.bus);
    src.start(0, Math.random() * 1.5); osc.start();
    return { src, bp, osc, gain, pan, gone: 0 };
  },
  kill(id, c) {
    try { c.src.stop(); c.osc.stop(); c.gain.disconnect(); } catch (e) { /* もう止まっている */ }
    this.ch.delete(id);
  },

  update(dt) {
    if (!Sound.ac || !Sound.noiseBuf) return;
    const t = Sound.ac.currentTime, L = Table.L;
    const on = Sound.ready() && Game.state === 'match' && Stage.dark && Match.active && !Match.paused &&
               (Match.state === 'play' || Match.state === 'countdown');
    const seen = new Set();
    if (on) {
      for (const p of Physics.pucks) {
        let c = this.ch.get(p.id);
        if (!c) { if (this.ch.size >= 5) continue; c = this.make(); this.ch.set(p.id, c); }
        seen.add(p.id);
        c.gone = 0;
        const s = Math.hypot(p.vx, p.vy) / L;
        const q = Sound.place(p.x, p.y);
        const moving = clamp((s - 0.02) / 0.25, 0, 1);
        const vol = 0.2 * q.vol * moving * (0.45 + 0.55 * clamp(s / 2.5, 0, 1));
        c.gain.gain.setTargetAtTime(vol, t, 0.03);
        c.tf = 420 + 1900 * clamp(s / 3, 0, 1);                 // こすれる音の高さ（速いほど高い）
        c.bp.frequency.setTargetAtTime(c.tf, t, 0.04);
        c.osc.frequency.setTargetAtTime(160 + 340 * clamp(s / 3, 0, 1), t, 0.04);
        if (c.pan) c.pan.pan.setTargetAtTime(q.pan, t, 0.03);
      }
    }
    for (const [id, c] of this.ch) {
      if (seen.has(id)) continue;
      c.gain.gain.setTargetAtTime(0, t, 0.03);
      c.gone += dt;
      if (c.gone > 0.4) this.kill(id, c);
    }
  },
};

// ===== 40_fx.js =====
'use strict';
/* =====================================================================
   演出（粒・衝撃波・残像・画面の揺れ・フラッシュ・技のマーク・マレットの出る消える…）
   出来事（Events）を受けて作る。時間はヒットストップの影響を受けない実時間で進める
   位置は台の座標（暗いステージでは、暗くする前に描くので明かりの外では見えない）
   ===================================================================== */
const Fx = {
  parts: [], rings: [], glows: [], texts: [], beams: [],
  trails: new Map(),                // パックID → 最近の位置 [{x,y,t,s}]
  shakeAmp: 0, shakeX: 0, shakeY: 0,
  flash: null,                      // { color, a, life, max }
  present: [0, 0],                  // マレットの見え方（0＝消えている、1＝出ている）
  wasActive: [false, false],
  appearT: [9, 9],
  inactiveT: [0, 0],
  goalAnim: null,                   // { scorer, t }
  countAnim: null,                  // { n, t }
  scorePop: [9, 9],
  malletPulse: [0, 0],
  gaugeShow: [0, 0],                // 表示用のゲージ（なめらかに追いかける）
  gaugeSplash: [0, 0],
  gaugeFullT: [9, 9],
  denyT: [9, 9],
  springKick: [],                   // { side, y, t }
  heat: 0,                          // ラリーの盛り上がり（0..1）
  rallyPop: null,                   // { n, t }
  secondT: 9,
  time: 0,
  lastSmash: -9,

  reset() {
    this.parts = []; this.rings = []; this.glows = []; this.texts = []; this.beams = [];
    this.trails.clear(); this.shakeAmp = 0; this.flash = null;
    this.present = [0, 0]; this.wasActive = [false, false]; this.appearT = [9, 9]; this.inactiveT = [0, 0];
    this.goalAnim = null; this.countAnim = null; this.scorePop = [9, 9]; this.malletPulse = [0, 0];
    this.gaugeShow = [0, 0]; this.gaugeSplash = [0, 0]; this.gaugeFullT = [9, 9]; this.denyT = [9, 9];
    this.springKick = []; this.heat = 0; this.rallyPop = null; this.secondT = 9;
  },

  init() { Events.on((type, a) => { try { this.event(type, a); } catch (e) { console.error(e); } }); },

  /* ---- 部品 ---- */
  part(o) {
    if (this.parts.length >= FX.PARTICLE_MAX) this.parts.shift();
    o.life = o.max = o.life || 0.4;
    o.drag = o.drag == null ? 4 : o.drag;
    o.delay = o.delay || 0;
    this.parts.push(o);
    return o;
  },
  sparks(x, y, nx, ny, n, spd, color, spread = 1.1, life = 0.35, w = 1) {
    const base = Math.atan2(ny, nx);
    for (let i = 0; i < n; i++) {
      const a = base + rand(-spread, spread), s = spd * rand(0.35, 1);
      this.part({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rand(0.6, 1.2), color, w: w * rand(0.6, 1.3), drag: 5 });
    }
  },
  dots(x, y, n, spd, color, size, life = 0.5, drag = 3) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = spd * rand(0.2, 1);
      this.part({ k: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * rand(0.6, 1.2), color, size: size * rand(0.6, 1.4), drag });
    }
  },
  ring(x, y, r0, r1, life, color, w = 0.012, delay = 0) {
    this.rings.push({ x, y, r0, r1, life, max: life, color, w, delay });
  },
  glow(x, y, r, life, color, delay = 0) { this.glows.push({ x, y, r, life, max: life, color, delay }); },
  text(s, x, y, color, size, life = 0.9, rise = 0.06) { this.texts.push({ s, x, y, color, size, life, max: life, rise }); },
  shake(px) { this.shakeAmp = Math.max(this.shakeAmp, px); },
  flashScreen(color, a, life) { this.flash = { color, a, life, max: life }; },
  denied(side) { this.denyT[side] = 0; Sound.denied(); },

  colorOf(owner) { return owner === Match.me ? COLORS.me : COLORS.opp; },

  /* ---- 出来事 ---- */
  event(type, a) {
    const L = Table.L, W = Table.W, pr = Table.pr;
    switch (type) {
      case 'mhit': {
        const [owner, power, x, y, nx, ny] = a, k = clamp(power / 3, 0, 1), col = this.colorOf(owner);
        this.sparks(x, y, nx, ny, 6 + Math.round(16 * k), (0.5 + 1.4 * k) * L, mix(col, '#ffffff', 0.4), 1.0, 0.3 + 0.15 * k, 1 + k);
        this.ring(x, y, pr * 0.8, pr * (2.4 + 3.2 * k), 0.28 + 0.12 * k, col, 0.014 + 0.01 * k);
        this.glow(x, y, pr * (2 + 3 * k), 0.14 + 0.08 * k, '#ffffff');
        this.malletPulse[owner] = 1;
        if (k > 0.45) this.shake(FX.SHAKE_HIT * k);
        if (k > 0.75) {
          this.ring(x, y, pr, pr * 7, 0.42, '#ffffff', 0.008, 0.04);   // 強打：白い大きな輪（文字は出さない）
        }
        break;
      }
      case 'mtouch': this.dots(a[2], a[3], 3, 0.15 * L, '#cfe3ff', pr * 0.12, 0.3); break;
      case 'hit': {
        const [kind, power, x, y, nx, ny] = a, k = clamp(power / 2.5, 0, 1);
        const col = { wall: COLORS.wall, pillar: STAGE_COLOR.pillar, bumper: STAGE_COLOR.bumper, spring: STAGE_COLOR.spring,
                      sweeper: STAGE_COLOR.mover, shutter: STAGE_COLOR.shutter, barrier: SKILL_TYPE.defense.color, puck: '#ffffff' }[kind] || '#ffffff';
        this.sparks(x, y, nx, ny, 3 + Math.round(10 * k), (0.3 + 0.9 * k) * L, col, 1.2, 0.28, 0.8 + k * 0.6);
        this.glow(x, y, pr * (1.4 + 2.2 * k), 0.18, col);
        if (kind === 'bumper' || kind === 'spring' || kind === 'barrier') this.ring(x, y, pr * 0.5, pr * (3 + 2 * k), 0.35, col, 0.012);
        if (kind === 'spring') this.springKick.push({ side: x < W / 2 ? 0 : 1, y, t: 0 });
        if (k > 0.5) this.shake(2 + 3 * k);
        this.flashShape(kind, x, y);
        break;
      }
      case 'warp': {
        const [x1, y1, x2, y2] = a, col = STAGE_COLOR.warp;
        this.beams.push({ x1, y1, x2, y2, life: 0.28, max: 0.28, color: col });
        for (const [x, y, d] of [[x1, y1, x1 < W / 2 ? 1 : -1], [x2, y2, x2 < W / 2 ? 1 : -1]]) {
          this.sparks(x, y, d, 0, 10, 0.7 * L, mix(col, '#ffffff', 0.3), 0.9, 0.35);
          this.ring(x, y, pr * 0.5, pr * 3.5, 0.35, col, 0.014);
          this.glow(x, y, pr * 3, 0.25, col);
        }
        break;
      }
      case 'pop': {
        const [x, y, owner] = a, col = SKILL_TYPE.attack.color;
        for (let i = 0; i < 12; i++) {
          const ang = rand(0, TAU), s = rand(0.2, 0.7) * L;
          this.part({ k: 'shard', x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, life: rand(0.3, 0.55), color: i % 2 ? col : '#ffffff', size: pr * rand(0.25, 0.5), rot: rand(0, TAU), spin: rand(-14, 14), drag: 4 });
        }
        this.ring(x, y, pr * 0.6, pr * 3, 0.3, col, 0.012);
        break;
      }
      case 'goal': {
        const [scorer, x] = a, gy = scorer === 0 ? 0 : L, dir = scorer === 0 ? 1 : -1;   // 入った側のゴールの位置と、台の内側の向き
        const col = this.colorOf(scorer);
        this.sparks(x, gy, 0, dir, 60, 1.8 * L, mix(col, '#ffffff', 0.35), 1.45, 0.75, 1.8);
        this.sparks(x, gy, 0, dir, 26, 2.6 * L, '#ffffff', 0.5, 0.5, 1.4);
        for (let i = 0; i < 34; i++) {
          const ang = Math.atan2(dir, 0) + rand(-1.4, 1.4), s = rand(0.4, 1.6) * L;
          this.part({ k: 'shard', x, y: gy, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, life: rand(0.6, 1.2),
                      color: pick([col, COLORS.ready, '#ffffff', mix(col, '#ffffff', 0.5)]), size: pr * rand(0.3, 0.7),
                      rot: rand(0, TAU), spin: rand(-12, 12), drag: 2.4 });
        }
        for (let i = 0; i < 3; i++) this.ring(x, gy, pr, pr * (6 + i * 4), 0.6 + i * 0.12, i === 1 ? '#ffffff' : col, 0.02 - i * 0.004, i * 0.07);
        this.glow(x, gy, W * 0.6, 0.6, col);
        this.dots(x, gy + dir * pr, 18, 0.3 * L, mix(col, '#ffffff', 0.2), pr * 0.5, 1.1, 1.5);
        this.shake(FX.SHAKE_GOAL);
        this.flashScreen(col, 0.38, 0.45);
        this.goalAnim = { scorer, t: 0 };
        this.texts = [];                                         // ゴールの文字と重ならないように
        this.scorePop[scorer] = 0;
        this.heat = 0;
        this.trails.clear();
        break;
      }
      case 'skill': break;                                     // 発動の瞬間の演出は出さない（いきなり使われるのが面白い）
      case 'shockwave': {                                      // 衝撃波：効果そのものが分かるよう、波の輪だけ
        const [owner, x, y] = a, col = SKILL_TYPE.defense.color;
        this.ring(x, y, Table.mr, SKILL.SHOCK_RANGE * L, 0.4, col, 0.012);
        this.ring(x, y, Table.mr, SKILL.SHOCK_RANGE * L * 0.7, 0.32, '#ffffff', 0.006, 0.04);
        break;
      }
      case 'shot': {
        const [owner, id, x, y, vx, vy] = a, sp = Math.hypot(vx, vy) || 1, nx = vx / sp, ny = vy / sp;
        const col = SKILL_TYPE.attack.color;
        if (id === 'fast') {
          this.sparks(x, y, nx, ny, 26, 2.2 * L, '#ffb15c', 0.45, 0.45, 1.8);
          this.sparks(x, y, -nx, -ny, 14, 0.8 * L, '#ff5b2e', 1.2, 0.5, 1.4);
          this.ring(x, y, pr, pr * 6, 0.4, '#ffd27a', 0.02);
        } else if (id === 'curve') {
          this.ring(x, y, pr, pr * 4.5, 0.45, col, 0.016);
          for (let i = 0; i < 16; i++) { const ang = i / 16 * TAU; this.part({ k: 'dot', x: x + Math.cos(ang) * pr * 2, y: y + Math.sin(ang) * pr * 2, vx: -Math.sin(ang) * 0.6 * L, vy: Math.cos(ang) * 0.6 * L, life: 0.4, color: col, size: pr * 0.3, drag: 3 }); }
        } else if (id === 'split') {
          this.glow(x, y, pr * 5, 0.3, '#ffffff');
          this.ring(x, y, pr, pr * 5, 0.35, col, 0.016);
          this.sparks(x, y, nx, ny, 18, 1.2 * L, '#ffe2bd', 0.4, 0.35);
        } else if (id === 'zigzag') {
          this.sparks(x, y, nx, ny, 16, 1.4 * L, '#fff27a', 0.9, 0.3, 1.2);
          this.glow(x, y, pr * 3, 0.2, '#ffe14d');
        } else if (id === 'mini') {
          this.ring(x, y, pr * 4, pr * 0.6, 0.3, col, 0.012);
          this.dots(x, y, 10, 0.4 * L, '#ffe2bd', pr * 0.2, 0.3, 5);
        } else if (id === 'vanish') {
          for (let i = 0; i < 14; i++) this.part({ k: 'smoke', x: x + rand(-1, 1) * pr, y: y + rand(-1, 1) * pr, vx: rand(-0.15, 0.15) * L, vy: rand(-0.15, 0.15) * L, life: rand(0.5, 0.9), color: '#c9b8ff', size: pr * rand(1, 2), drag: 2 });
          this.ring(x, y, pr, pr * 4, 0.4, '#c9b8ff', 0.012);
        }
        break;
      }
      case 'second': {
        const [x, y] = a, col = COLORS.ready;
        this.secondT = 0;
        for (let i = 0; i < 3; i++) this.ring(x, y, pr * 6 - i * pr, pr * 0.5, 0.5, i === 1 ? '#ffffff' : col, 0.012, i * 0.1);
        for (let i = 0; i < 24; i++) {
          const ang = rand(0, TAU), r = pr * rand(4, 7);
          this.part({ k: 'dot', x: x + Math.cos(ang) * r, y: y + Math.sin(ang) * r, vx: -Math.cos(ang) * r * 2.4, vy: -Math.sin(ang) * r * 2.4, life: 0.4, color: col, size: pr * 0.28, drag: 0 });
        }
        this.ring(x, y, pr, pr * 8, 0.6, col, 0.018, 0.45);
        this.flashScreen(col, 0.12, 0.3);
        break;
      }
      case 'rally': {
        const n = a[0];
        this.rallyPop = { n, t: 0 };
        if (n > 0 && n % 5 === 0) {
          this.ring(W / 2, L / 2, W * 0.1, W * 0.6, 0.6, COLORS.ready, 0.01);
          this.flashScreen(COLORS.ready, 0.1, 0.25);
        }
        break;
      }
      case 'full': {
        const owner = a[0];
        this.gaugeFullT[owner] = 0;
        for (const side of [0, 1]) {
          const c = triCenter(owner, side);
          this.dots(c.x, c.y, 14, 0.5 * L, COLORS.ready, Table.pr * 0.3, 0.6, 3);
          this.ring(c.x, c.y, Table.pr, Table.D * 0.9, 0.5, COLORS.ready, 0.012);
        }
        break;
      }
      case 'count':
        if (!a[1]) this.countAnim = { n: a[0], t: 0 };       // 得点後のサーブでは数字を出さない
        if (a[0] === 0) {                                     // 始まりの合図：中央から光の輪（文字は出さない）
          this.ring(W / 2, L / 2, pr, W * 0.55, 0.5, COLORS.ready, 0.014);
          this.ring(W / 2, L / 2, pr, W * 0.35, 0.4, '#ffffff', 0.008, 0.05);
        }
        break;
    }
  },

  /* 当たった柱やバンパーを光らせる（ゲストでも光るよう、位置から探す） */
  flashShape(kind, x, y) {
    let best = null, bd = Infinity;
    for (const s of Stage.shapes) {
      if (s.kind !== kind) continue;
      const d = segDist(x, y, s.ax, s.ay, s.bx, s.by).d - s.r;
      if (d < bd) { bd = d; best = s; }
    }
    if (best && bd < Table.pr * 1.5) best.flash = 1;
  },

  /* ---- 毎フレーム ---- */
  update(dt) {
    this.time += dt;
    const keep = [];
    for (const p of this.parts) {
      if (p.delay > 0) { p.delay -= dt; keep.push(p); continue; }
      p.life -= dt;
      if (p.life <= 0) continue;
      const k = Math.exp(-p.drag * dt);
      p.vx *= k; p.vy *= k;
      if (p.k === 'home' && p.target) {                    // 目標へ吸い寄せられる粒
        const u = 1 - p.life / p.max, tx = p.target.x, ty = p.target.y;
        p.x = lerp(p.x, tx, clamp(u * u * 0.5 + dt * 6 * u, 0, 1));
        p.y = lerp(p.y, ty, clamp(u * u * 0.5 + dt * 6 * u, 0, 1));
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.spin) p.rot += p.spin * dt;
      keep.push(p);
    }
    this.parts = keep;
    const age = list => list.filter(r => { if (r.delay > 0) { r.delay -= dt; return true; } r.life -= dt; return r.life > 0; });
    this.rings = age(this.rings); this.glows = age(this.glows); this.beams = age(this.beams);
    this.texts = this.texts.filter(t => (t.life -= dt) > 0);
    this.springKick = this.springKick.filter(s => (s.t += dt) < 0.4);

    // 画面の揺れ
    this.shakeAmp *= Math.exp(-dt * 9);
    if (this.shakeAmp < 0.2) this.shakeAmp = 0;
    const a = rand(0, TAU);
    this.shakeX = Math.cos(a) * this.shakeAmp; this.shakeY = Math.sin(a) * this.shakeAmp;
    if (this.flash && (this.flash.life -= dt) <= 0) this.flash = null;
    this.updateMallets(dt);
    if (this.goalAnim) this.goalAnim.t += dt;
    if (this.countAnim) this.countAnim.t += dt;
    if (this.rallyPop) this.rallyPop.t += dt;
    this.secondT += dt;
    for (const o of [0, 1]) {
      this.scorePop[o] += dt; this.denyT[o] += dt; this.gaugeFullT[o] += dt;
      this.malletPulse[o] = Math.max(0, this.malletPulse[o] - dt * 5);
      const g = Match.shownGauge(o), s = this.gaugeShow[o];
      if (g > s + 0.001) { this.gaugeShow[o] = Math.min(g, s + dt * 1.2); this.gaugeSplash[o] = 1; }
      else if (g < s) this.gaugeShow[o] = Math.max(g, s - dt * 2.5);
      this.gaugeSplash[o] = Math.max(0, this.gaugeSplash[o] - dt * 1.5);
    }
    const target = clamp(Match.rally / TUNE.SECOND_PUCK_RALLY, 0, 1);
    this.heat += (target - this.heat) * (1 - Math.exp(-dt * 3));
    this.updateTrails();
  },

  /* マレットが出る・消える演出 */
  updateMallets(dt) {
    for (const o of [0, 1]) {
      const m = Physics.mallets[o];
      if (!m) continue;
      const on = !!m.active, col = this.colorOf(o), r = m.r;
      if (on && !this.wasActive[o]) {
        this.appearT[o] = 0;
        this.ring(m.x, m.y, r * 0.6, r * 2.4, 0.32, col, 0.014);
        this.dots(m.x, m.y, 10, 0.5 * Table.L, mix(col, '#ffffff', 0.4), Table.pr * 0.25, 0.35, 5);
        if (o === Match.me) Sound.appear();
      } else if (!on && this.wasActive[o]) {
        this.dots(m.x, m.y, 8, 0.35 * Table.L, col, Table.pr * 0.22, 0.3, 5);
      }
      this.wasActive[o] = on;
      this.appearT[o] += dt;
      this.present[o] = on ? Math.min(1, this.present[o] + dt / 0.12) : Math.max(0, this.present[o] - dt / 0.14);
      this.inactiveT[o] = on ? 0 : this.inactiveT[o] + dt;
    }
  },

  /* パックの残像：最近の位置を覚えておく */
  updateTrails() {
    const now = this.time, alive = new Set();
    for (const p of Physics.pucks) {
      alive.add(p.id);
      let tr = this.trails.get(p.id);
      if (!tr) { tr = []; this.trails.set(p.id, tr); }
      const last = tr[tr.length - 1];
      if (last && Math.hypot(p.x - last.x, p.y - last.y) > Table.L * 0.25) tr.length = 0;   // ワープ・出し直しでは線をつなげない
      tr.push({ x: p.x, y: p.y, t: now, s: Math.hypot(p.vx, p.vy) / Table.L });
      while (tr.length && now - tr[0].t > FX.TRAIL_TIME) tr.shift();
      if (Match.state === 'play' && Match.hitStop <= 0 && Skills.freeze <= 0) this.emitPuckFx(p);
    }
    for (const id of this.trails.keys()) if (!alive.has(id)) this.trails.delete(id);
  },

  /* パックが飛びながら出す粒（剛速球の火の粉・カーブの軌跡・床の効果） */
  emitPuckFx(p) {
    const sp = Math.hypot(p.vx, p.vy), L = Table.L;
    if (p.vis < 0.5) return;
    if (p.skill === 'fast' && p.boost > 1 && Math.random() < 0.9) {
      this.part({ k: 'dot', x: p.x + rand(-1, 1) * p.r * 0.6, y: p.y + rand(-1, 1) * p.r * 0.6, vx: -p.vx * 0.15 + rand(-0.1, 0.1) * L,
                  vy: -p.vy * 0.15 + rand(-0.1, 0.1) * L, life: rand(0.2, 0.4), color: pick(['#ffb15c', '#ff6a2e', '#ffe08a']), size: p.r * rand(0.3, 0.6), drag: 4 });
    }
    if (p.skill === 'zigzag' && Math.random() < 0.7) {
      const a = rand(0, TAU), s2 = rand(0.2, 0.6) * L;
      this.part({ k: 'spark', x: p.x, y: p.y, vx: Math.cos(a) * s2, vy: Math.sin(a) * s2, life: 0.15, color: '#fff27a', w: 0.8, drag: 6 });
    }
    if (p.curve && Math.random() < 0.6) {
      this.part({ k: 'dot', x: p.x, y: p.y, vx: 0, vy: 0, life: 0.35, color: SKILL_TYPE.attack.color, size: p.r * 0.25, drag: 0 });
    }
    if (p.zoneArrow > 0 && Math.random() < 0.5) {
      this.part({ k: 'spark', x: p.x, y: p.y, vx: -p.vx * 0.3, vy: -p.vy * 0.3, life: 0.2, color: STAGE_COLOR.arrow, w: 0.8, drag: 4 });
    }
    if (p.zoneSlow > 0 && Math.random() < 0.4) {
      this.part({ k: 'dot', x: p.x + rand(-1, 1) * p.r, y: p.y + rand(-1, 1) * p.r, vx: 0, vy: 0, life: 0.5, color: '#bff7f7', size: p.r * 0.2, drag: 0 });
    }
    if (p.zoneArrow > 0) p.zoneArrow -= 1 / 60;
    if (p.zoneSlow > 0) p.zoneSlow -= 1 / 60;
    if (sp > 2.4 * L && Math.random() < 0.35 && !p.ghost) {
      this.part({ k: 'spark', x: p.x, y: p.y, vx: -p.vx * 0.2, vy: -p.vy * 0.2, life: 0.15, color: '#ffffff', w: 0.6, drag: 6 });
    }
  },
};

/* 必殺技ボタンの三角形の重心（owner 側、side 0＝左・1＝右） */
function triCenter(owner, side) {
  const { W, L, D } = Table, y = owner === 0 ? L - D / 3 : D / 3;
  return { x: side === 0 ? D / 3 : W - D / 3, y };
}

// ===== 41_draw_util.js =====
'use strict';
/* =====================================================================
   描画の道具：光の玉・影の玉を前もって作っておき、拡大して貼る（毎回グラデーションを作らず軽くする）
   ===================================================================== */
const Sprites = {
  cache: new Map(),
  make(key, size, paint) {
    let c = this.cache.get(key);
    if (!c) {
      c = document.createElement('canvas');
      c.width = c.height = size;
      paint(c.getContext('2d'), size);
      this.cache.set(key, c);
    }
    return c;
  },
  /* 中心が明るく、外へ消えていく光 */
  glow(color) {
    return this.make('g' + color, 96, (g, s) => {
      const c = rgb(color), gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      gr.addColorStop(0, `rgba(${c},1)`); gr.addColorStop(0.18, `rgba(${c},.75)`);
      gr.addColorStop(0.45, `rgba(${c},.22)`); gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr; g.fillRect(0, 0, s, s);
    });
  },
  /* やわらかい影 */
  shadow() {
    return this.make('shadow', 96, (g, s) => {
      const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      gr.addColorStop(0, 'rgba(0,0,8,.62)'); gr.addColorStop(0.55, 'rgba(0,0,8,.38)'); gr.addColorStop(1, 'rgba(0,0,8,0)');
      g.fillStyle = gr; g.fillRect(0, 0, s, s);
    });
  },
};

/* 光の玉を貼る（加算で重ねると明るくなる） */
function glowAt(x, y, r, color, alpha = 1) {
  if (alpha <= 0.003 || r <= 0) return;
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.drawImage(Sprites.glow(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

/* 光の向き：画面の左上から照らす。台を180°回したゲストでも、画面上で同じ向きになるようにする */
const lightSign = () => (Layout.flip ? -1 : 1);

/* 台から浮いて見える影（高さ h：大きいほど影が離れる） */
function shadowAt(x, y, r, h = 0.3, alpha = 1) {
  const s = lightSign(), off = r * h;
  ctx.globalAlpha = alpha;
  ctx.drawImage(Sprites.shadow(), x + s * off * 0.6 - r * 1.25, y + s * off - r * 1.25, r * 2.5, r * 2.5);
  ctx.globalAlpha = 1;
}

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }

/* 台の外形（八角形）のパス */
function tablePath(c = ctx) {
  const { W, L, D } = Table;
  c.beginPath();
  c.moveTo(D, 0); c.lineTo(W - D, 0); c.lineTo(W, D); c.lineTo(W, L - D);
  c.lineTo(W - D, L); c.lineTo(D, L); c.lineTo(0, L - D); c.lineTo(0, D); c.closePath();
}

/* 台の座標の点を画面の座標へ（揺れも足す） */
function scr(x, y) {
  const p = Layout.toScreen(x, y);
  p.x += Fx.shakeX; p.y += Fx.shakeY;
  return p;
}
/* 台の座標で描く準備（揺れも反映） */
function tableTransform() {
  Layout.applyTable(ctx);
  const d = Layout.dpr, m = ctx.getTransform();
  ctx.setTransform(m.a, m.b, m.c, m.d, m.e + Fx.shakeX * d, m.f + Fx.shakeY * d);
}
function screenTransform(withShake = true) {
  const d = Layout.dpr;
  ctx.setTransform(d, 0, 0, d, withShake ? Fx.shakeX * d : 0, withShake ? Fx.shakeY * d : 0);
}

const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif';
function font(px, weight = 800) { return `${weight} ${Math.max(1, px).toFixed(1)}px ${FONT}`; }

/* 縁取りつきの文字 */
function outlinedText(s, x, y, px, fill, stroke = 'rgba(4,8,24,.85)', lw = 0.16) {
  ctx.font = font(px);
  ctx.lineJoin = 'round';
  ctx.lineWidth = px * lw;
  ctx.strokeStyle = stroke;
  ctx.strokeText(s, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(s, x, y);
}

function ownerColor(o) { return o === Match.me ? COLORS.me : COLORS.opp; }

// ===== 42_draw_table.js =====
'use strict';
/* =====================================================================
   台の描画
   動かない部分（背景・台の面・模様・線）は、画面の大きさやステージが変わったときだけ作り直して貼る（テーマは 42a_theme.js）
   ===================================================================== */
const TableArt = {
  cv: null, key: '',

  base() {
    const key = [Layout.vw, Layout.vh, Layout.dpr, Table.W.toFixed(2), Layout.flip, Layout.scale.toFixed(4), Layout.ox.toFixed(1), Layout.oy.toFixed(1), Stage.id, Match.me].join('|');
    if (this.cv && this.key === key) return this.cv;
    this.key = key;
    if (!this.cv) this.cv = document.createElement('canvas');
    const c = this.cv;
    c.width = canvas.width; c.height = canvas.height;
    const g = c.getContext('2d');
    withCtx(g, () => {
      const th = theme();
      Layout.applyScreen(g);
      paintThemeBackground(g, th, Layout.vw, Layout.vh);              // 台の外（余白）
      Layout.applyTable(g);
      paintThemeSurface(g, th);                                        // 台の面
    });
    return c;
  },
};

/* ラリーで台が熱を帯びていく：中央線と円が光る */
function drawHeat(t) {
  const { W, L } = Table, h = Fx.heat;
  if (h < 0.02) return;
  const col = mix('#5b8cff', '#ffcf3f', h);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(col, 0.25 + 0.45 * h);
  ctx.lineWidth = W * (0.006 + 0.01 * h);
  const pulse = 1 + 0.04 * Math.sin(t * (4 + 8 * h)) * h;
  ctx.beginPath(); ctx.moveTo(0, L / 2); ctx.lineTo(W, L / 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, L / 2, W * 0.15 * pulse, 0, TAU); ctx.stroke();
  glowAt(W / 2, L / 2, W * 0.35 * h, col, 0.35 * h);
  ctx.restore();
}

/* ゴールの口：守る人の色で光る。台の外へにじむ */
function drawGoals(t) {
  const { W, L } = Table;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const o of [0, 1]) {
    const gh = Table.goalHalf[o], y = Table.goalY(o), dir = o === 0 ? 1 : -1, col = ownerColor(o);
    const g = Fx.goalAnim && Fx.goalAnim.scorer !== o && Fx.goalAnim.t < 1 ? 1 - Fx.goalAnim.t : 0;   // 入れられたゴールが光る
    const depth = Table.pr * 2.2;
    const lg = ctx.createLinearGradient(0, y, 0, y + dir * depth);
    lg.addColorStop(0, rgba(col, 0.45 + 0.5 * g)); lg.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = lg;
    ctx.fillRect(W / 2 - gh, Math.min(y, y + dir * depth), gh * 2, depth);
    const lg2 = ctx.createLinearGradient(0, y, 0, y - dir * depth * 1.6);
    lg2.addColorStop(0, rgba(col, 0.22 + 0.4 * g)); lg2.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = lg2;
    ctx.fillRect(W / 2 - gh, Math.min(y, y - dir * depth * 1.6), gh * 2, depth * 1.6);
    ctx.strokeStyle = rgba(mix(col, '#ffffff', 0.4), 0.85);
    ctx.lineWidth = W * 0.008;
    ctx.beginPath(); ctx.moveTo(W / 2 - gh, y); ctx.lineTo(W / 2 + gh, y); ctx.stroke();
    if (Skills.state && Skills.state.wide[o] > 0) {              // ゴール拡大：妨害の色で両端が点滅
      const left = Skills.state.wide[o], a = left < 0.6 ? Math.abs(Math.sin(t * 22)) : 0.7 + 0.3 * Math.sin(t * 8);
      const dc = SKILL_TYPE.disrupt.color;
      for (const sx of [-1, 1]) glowAt(W / 2 + sx * gh, y, Table.pr * 1.8, dc, a);
      ctx.fillStyle = rgba(dc, 0.25 * a);
      ctx.fillRect(W / 2 - gh, Math.min(y, y + dir * depth), gh * 2, depth);
      ctx.fillStyle = rgba(dc, 0.18 * a);                                   // 台の内側にも、広がったゴールの幅を見せる
      ctx.fillRect(W / 2 - gh, Math.min(y, y - dir * depth * 0.8), gh * 2, depth * 0.8);
      ctx.strokeStyle = rgba(mix(dc, '#ffffff', 0.35), 0.9 * a); ctx.lineWidth = W * 0.012; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(W / 2 - gh, y); ctx.lineTo(W / 2 + gh, y); ctx.stroke();
      const cs = Table.pr * 0.55, cy = y - dir * Table.pr * 1.1, sh = (t * 2) % 1;   // 外へ向かって流れる「く」の字（広がっている印）
      ctx.lineWidth = W * 0.007; ctx.lineJoin = 'round';
      for (const sx of [-1, 1]) for (let i = 0; i < 2; i++) {
        const k = (i + sh) / 2, cx = W / 2 + sx * (gh * 0.45 + gh * 0.4 * k);
        ctx.strokeStyle = rgba(mix(dc, '#ffffff', 0.4), a * Math.sin(Math.PI * k));
        ctx.beginPath(); ctx.moveTo(cx - sx * cs * 0.5, cy - cs * 0.7); ctx.lineTo(cx + sx * cs * 0.5, cy); ctx.lineTo(cx - sx * cs * 0.5, cy + cs * 0.7); ctx.stroke();
      }
    }
    if (Stage.id === 'pulse') {                                  // ゆらぐゴール：両端の印
      for (const sx of [-1, 1]) glowAt(W / 2 + sx * gh, y, Table.pr * 1.4, col, 0.6 + 0.3 * Math.sin(t * 6));
    }
  }
  ctx.restore();
}

/* 壁：細い光る線。台の形そのものが画面の縁になる */
function drawWalls(t) {
  const { W, L, D } = Table, wc = theme().wall;
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const w of Table.walls) {
    if (w.kind === 'spring') { drawSpringWall(w, t); continue; }
    if (w.kind === 'warp') { drawPortalWall(w, t); continue; }
    ctx.strokeStyle = rgba(wc, 0.22);
    ctx.lineWidth = W * 0.022;
    ctx.beginPath(); ctx.moveTo(w.ax, w.ay); ctx.lineTo(w.bx, w.by); ctx.stroke();
    ctx.strokeStyle = rgba(wc, 0.9);
    ctx.lineWidth = W * 0.007;
    ctx.beginPath(); ctx.moveTo(w.ax, w.ay); ctx.lineTo(w.bx, w.by); ctx.stroke();
  }
  // ゴールポスト
  for (const o of [0, 1]) {
    const gh = Table.goalHalf[o], y = Table.goalY(o);
    for (const sx of [-1, 1]) {
      ctx.fillStyle = '#dfe8ff';
      circle(W / 2 + sx * gh, y, W * 0.011); ctx.fill();
    }
  }
  ctx.restore();
}

/* 点数：台の上に半透明で大きく。自分の点は下半分、相手の点は上半分。入った瞬間に弾む */
function drawScores() {
  if (Game.state !== 'match') return;
  const { W, L } = Table;
  screenTransform();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const o of [0, 1]) {
    const p = scr(W / 2, o === 0 ? L * 0.75 : L * 0.25);        // プレイヤー0の陣地は台の下半分（ゲストの画面では上に見える）
    const pop = Fx.scorePop[o], k = pop < 0.6 ? 1 + 0.6 * Math.sin(Math.PI * Math.min(1, pop / 0.6)) * (1 - pop / 0.6) * 1.5 : 1;
    const px = W * 0.42 * Layout.scale * k;
    const a = pop < 0.6 ? 0.55 - 0.35 * (pop / 0.6) : 0.2;
    ctx.globalAlpha = a;
    ctx.font = font(px, 900);
    ctx.fillStyle = ownerColor(o);
    ctx.fillText(String(Match.score[o]), p.x, p.y);
    ctx.globalAlpha = 1;
  }
}

/* 台の上をただよう、かすかな光の粒（空気が流れている感じ） */
function drawAmbient(t) {
  const { W, L } = Table;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 16; i++) {
    const sx = (i * 0.618034) % 1, sy = (i * 0.414214 + 0.13) % 1, sp = 0.012 + (i % 5) * 0.004;
    const x = W * ((sx + Math.sin(t * 0.3 + i) * 0.03) % 1), y = L * ((sy + t * sp) % 1);
    const tw = 0.5 + 0.5 * Math.sin(t * (1.3 + i * 0.17) + i * 2.1);
    glowAt(x, y, W * 0.018, i % 3 ? theme().ambient : '#ffffff', 0.16 * tw);
  }
  ctx.restore();
}

// ===== 42a_theme.js =====
'use strict';
/* =====================================================================
   ステージごとの見た目（テーマ）
   台の面の色・床の模様・台の外の背景・壁の色・動く飾りをステージごとに変える。
   遊び方（仕掛けの位置や物理）は変えない。動かない部分は TableArt でまとめて描いておく
   ===================================================================== */
const STAGE_THEME = {
  pillars: { pillar: '#8ea6e0', name: 'コア',         surface: ['#17306e', '#0f2152', '#091538'], line: '#5a86ff', wall: '#9fb6ff', bg: ['#04081a', '#081236'], pattern: 'hex',     ambient: '#8fb4ff' },
  sweeper: { pillar: '#a3acbd', name: '工場',         surface: ['#2b3446', '#1d2433', '#12171f'], line: '#ffc94d', wall: '#ffd36b', bg: ['#07090d', '#141922'], pattern: 'plate',   ambient: '#ffe2a0' },
  spring:  { pillar: '#8fae8a', name: '森',           surface: ['#17543a', '#0f3b29', '#08261a'], line: '#8ef0a0', wall: '#c4ff9a', bg: ['#03100a', '#0a2416'], pattern: 'leaf',    ambient: '#d8ff6a' },
  boost:   { pillar: '#aeb4c2', name: 'サーキット',   surface: ['#30343e', '#23262e', '#17191e'], line: '#f2f4f8', wall: '#dfe6f2', bg: ['#08090b', '#16181c'], pattern: 'track',   ambient: '#ffd08a' },
  warp:    { pillar: '#9d93d9', name: '宇宙',         surface: ['#34197a', '#200f52', '#110831'], line: '#b49cff', wall: '#c8b6ff', bg: ['#05020f', '#120830'], pattern: 'stars',   ambient: '#e4d8ff' },
  shutter: { pillar: '#c7a774', name: '要塞',         surface: ['#4a3514', '#33240e', '#1f1608'], line: '#ffcf6b', wall: '#ffcf6b', bg: ['#0d0904', '#1f160a'], pattern: 'concrete', ambient: '#ffd9a0' },
  pulse:   { pillar: '#9cc4b4', name: '鼓動',         surface: ['#16301a', '#0d2011', '#061208'], line: '#66ff7a', wall: '#bff7c4', bg: ['#020803', '#08170a'], pattern: 'monitor', ambient: '#b0ffb8' },
  dark:    { pillar: '#4a5a7c', name: '深海',         surface: ['#0e1a33', '#0a1326', '#060b17'], line: '#3d5c99', wall: '#5574b8', bg: ['#010205', '#04070f'], pattern: 'caustic', ambient: '#6fa8ff' },
};
const theme = () => STAGE_THEME[Stage.id] || STAGE_THEME.pillars;

/* 台の外（余白）。画面の座標で描く */
function paintThemeBackground(g, th, vw, vh) {
  const bg = g.createLinearGradient(0, 0, 0, vh);
  bg.addColorStop(0, th.bg[0]); bg.addColorStop(0.5, th.bg[1]); bg.addColorStop(1, th.bg[0]);
  g.fillStyle = bg; g.fillRect(0, 0, vw, vh);
  g.save();
  g.strokeStyle = rgba(th.line, 0.07); g.fillStyle = rgba(th.line, 0.12); g.lineWidth = 1;
  if (th.pattern === 'stars' || th.pattern === 'caustic') {          // 星（深海ではかすかな粒）
    for (let i = 0; i < 160; i++) {
      const x = ((i * 0.6180339) % 1) * vw, y = ((i * 0.4142135 + 0.17) % 1) * vh, r = (i % 7 === 0 ? 1.4 : 0.7);
      g.globalAlpha = th.pattern === 'stars' ? 0.3 + 0.5 * ((i * 0.37) % 1) : 0.15;
      g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
  } else if (th.pattern === 'plate' || th.pattern === 'concrete') {  // 斜めのしま
    g.strokeStyle = rgba(th.line, 0.06); g.lineWidth = 8;
    g.beginPath();
    for (let x = -vh; x < vw; x += 36) { g.moveTo(x, vh); g.lineTo(x + vh, 0); }
    g.stroke();
  } else {                                                            // ゆるい格子
    const step = 28;
    g.beginPath();
    for (let x = (vw / 2) % step; x < vw; x += step) { g.moveTo(x, 0); g.lineTo(x, vh); }
    for (let y = (vh / 2) % step; y < vh; y += step) { g.moveTo(0, y); g.lineTo(vw, y); }
    g.stroke();
  }
  g.restore();
}

/* 台の面（台の座標で描く）：色・模様・空気穴・照り返し・線・自陣の色分け */
function paintThemeSurface(g, th) {
  const { W, L, D } = Table;
  tablePath(g);
  const sg = g.createRadialGradient(W / 2, L / 2, W * 0.1, W / 2, L / 2, L * 0.62);
  sg.addColorStop(0, th.surface[0]); sg.addColorStop(0.55, th.surface[1]); sg.addColorStop(1, th.surface[2]);
  g.fillStyle = sg; g.fill();
  g.save();
  tablePath(g); g.clip();
  paintThemePattern(g, th);
  // 空気穴
  const hs = W * 0.05;
  g.fillStyle = rgba(mix(th.line, '#ffffff', 0.4), 0.09);
  for (let y = hs / 2; y < L; y += hs) {
    for (let x = hs / 2 + ((Math.round(y / hs) % 2) * hs) / 2; x < W; x += hs) { g.beginPath(); g.arc(x, y, W * 0.0045, 0, TAU); g.fill(); }
  }
  // 照り返し
  const sh = g.createLinearGradient(0, 0, W, L * 0.6);
  sh.addColorStop(0, 'rgba(255,255,255,.06)'); sh.addColorStop(0.4, 'rgba(255,255,255,0)');
  g.fillStyle = sh; g.fillRect(0, 0, W, L);
  // 線：中央線・中央の円・ゴール前の半円
  g.strokeStyle = rgba(th.line, 0.38); g.lineWidth = W * 0.006;
  g.beginPath(); g.moveTo(0, L / 2); g.lineTo(W, L / 2); g.stroke();
  g.beginPath(); g.arc(W / 2, L / 2, W * 0.15, 0, TAU); g.stroke();
  g.beginPath(); g.arc(W / 2, L / 2, W * 0.02, 0, TAU); g.fillStyle = rgba(th.line, 0.5); g.fill();
  g.beginPath(); g.arc(W / 2, 0, W * 0.26, 0, Math.PI); g.stroke();
  g.beginPath(); g.arc(W / 2, L, W * 0.26, Math.PI, TAU); g.stroke();
  // 自陣の色分け（うすく）
  const half = (y0, y1, col) => { const lg = g.createLinearGradient(0, y0, 0, y1); lg.addColorStop(0, rgba(col, 0)); lg.addColorStop(1, rgba(col, 0.07)); g.fillStyle = lg; g.fillRect(0, Math.min(y0, y1), W, Math.abs(y1 - y0)); };
  half(L / 2, L, ownerColor(0)); half(L / 2, 0, ownerColor(1));
  g.restore();
  // 角の三角形（必殺技ボタン／相手のゲージ）の地
  g.fillStyle = '#060b1a';
  for (const [ax, ay, bx, by, cx, cy] of [[0, 0, D, 0, 0, D], [W, 0, W - D, 0, W, D], [0, L, D, L, 0, L - D], [W, L, W - D, L, W, L - D]]) {
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.lineTo(cx, cy); g.closePath(); g.fill();
  }
}

/* ステージごとの床の模様（動かない部分） */
function paintThemePattern(g, th) {
  const { W, L } = Table, c = th.line;
  g.save();
  switch (th.pattern) {
    case 'hex': {                                                     // 六角形のタイル
      const s = W * 0.075, h = s * Math.sqrt(3) / 2;
      g.strokeStyle = rgba(c, 0.1); g.lineWidth = W * 0.003;
      for (let row = -1, y = 0; y < L + s; row++, y = row * h) {
        for (let x = (row % 2) * s * 0.75 - s; x < W + s; x += s * 1.5) {
          g.beginPath();
          for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; const px = x + Math.cos(a) * s * 0.5, py = y + Math.sin(a) * s * 0.5; k ? g.lineTo(px, py) : g.moveTo(px, py); }
          g.closePath(); g.stroke();
        }
      }
      break;
    }
    case 'plate': {                                                   // 金属の床板と、中央のレールの両側の警告のしま
      g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = W * 0.004;
      for (let y = L / 8; y < L; y += L / 8) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
      for (let x = W / 3; x < W; x += W / 3) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, L); g.stroke(); }
      g.fillStyle = 'rgba(255,255,255,.12)';
      for (let y = L / 8; y < L; y += L / 8) for (let x = W / 3; x < W; x += W / 3) for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { g.beginPath(); g.arc(x + dx * W * 0.02, y + dy * W * 0.02, W * 0.006, 0, TAU); g.fill(); }
      const band = W * 0.05;
      g.beginPath(); g.rect(0, L / 2 - band, W, band * 2); g.clip();
      g.fillStyle = 'rgba(255,201,77,.14)';
      for (let x = -band * 2; x < W + band * 2; x += band * 1.2) { g.beginPath(); g.moveTo(x, L / 2 - band); g.lineTo(x + band * 0.6, L / 2 - band); g.lineTo(x + band * 1.6, L / 2 + band); g.lineTo(x + band, L / 2 + band); g.fill(); }
      break;
    }
    case 'leaf': {                                                    // 葉の葉脈のような曲線
      g.strokeStyle = rgba(c, 0.09); g.lineWidth = W * 0.004;
      for (let i = 0; i < 10; i++) {
        const y = L * (0.05 + i * 0.1), dir = i % 2 ? 1 : -1;
        g.beginPath(); g.moveTo(dir > 0 ? 0 : W, y); g.quadraticCurveTo(W / 2, y + L * 0.08 * dir, dir > 0 ? W : 0, y + L * 0.04);
        g.stroke();
        for (let k = 1; k < 5; k++) { const x = W * k / 5; g.beginPath(); g.moveTo(x, y + L * 0.03); g.lineTo(x + W * 0.05 * dir, y - L * 0.02); g.stroke(); }
      }

    }
    case 'track': {                                                   // 車線・縁石・ゴール前のチェッカー

      g.setLineDash([L * 0.04, L * 0.035]);
      for (const x of [W / 3, W * 2 / 3]) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, L); g.stroke(); }
      g.setLineDash([]);
      const cw = W * 0.03;
      for (const x of [0, W - cw]) for (let y = 0, i = 0; y < L; y += L * 0.04, i++) { g.fillStyle = i % 2 ? 'rgba(10,10,14,.55)' : 'rgba(255,255,255,.3)'; g.fillRect(x, y, cw, L * 0.04); }
      const sq = W * 0.04;
      for (const y0 of [L * 0.07, L * 0.93 - sq * 2]) for (let r = 0; r < 2; r++) for (let x = 0, i = 0; x < W; x += sq, i++) { if ((i + r) % 2) continue; g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(x, y0 + r * sq, sq, sq); }
      break;
    }
    case 'stars': {                                                   // 星雲と星
      for (const [x, y, r, col] of [[0.3, 0.3, 0.45, '#8a5cff'], [0.75, 0.68, 0.4, '#ff5cc8'], [0.5, 0.5, 0.3, '#5cb8ff']]) {
        const ng = g.createRadialGradient(W * x, L * y, 0, W * x, L * y, W * r);

        const x = ((i * 0.7548776) % 1) * W, y = ((i * 0.5698403 + 0.11) % 1) * L;
        g.globalAlpha = 0.25 + 0.6 * ((i * 0.31) % 1);

      g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = W * 0.004;
      for (let y = 0; y < L; y += L / 10) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
      for (let y = 0, r = 0; y < L; y += L / 10, r++) for (let x = (r % 2) * W / 6; x < W; x += W / 3) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + L / 10); g.stroke(); }

      for (let y = 0; y < L; y += s) { g.moveTo(0, y); g.lineTo(W, y); }
      g.stroke();
      g.strokeStyle = rgba(c, 0.13); g.lineWidth = W * 0.003;
      g.beginPath();
      for (let x = 0; x < W; x += s * 5) { g.moveTo(x, 0); g.lineTo(x, L); }
      for (let y = 0; y < L; y += s * 5) { g.moveTo(0, y); g.lineTo(W, y); }

      }
      break;
    }
  }
  g.restore();
}

'use strict';
/* =====================================================================
   ステージごとの動く飾り（台の座標。仕掛けの下に描く）
   どれもプレーの邪魔にならないよう、うすく・ゆっくり動かす
   ===================================================================== */
function drawStageDecor(t) {
  const { W, L } = Table, th = theme();
  ctx.save();
  switch (th.pattern) {
    case 'hex': {                                                     // コア：中央の柱から、ゆっくり広がる光の輪
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 2; i++) {
        const k = ((t * 0.35 + i * 0.5) % 1);
        ctx.strokeStyle = rgba(th.line, 0.16 * (1 - k)); ctx.lineWidth = W * 0.006;
        circle(W / 2, L / 2, W * (0.08 + k * 0.5)); ctx.stroke();
      }
      break;
    }
    case 'plate': {                                                   // 工場：中央線のレールと、流れる誘導灯
      ctx.strokeStyle = 'rgba(20,24,32,.9)'; ctx.lineWidth = W * 0.03;
      ctx.beginPath(); ctx.moveTo(0, L / 2); ctx.lineTo(W, L / 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,210,230,.35)'; ctx.lineWidth = W * 0.004;
      for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(0, L / 2 + d * W * 0.012); ctx.lineTo(W, L / 2 + d * W * 0.012); ctx.stroke(); }
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 6; i++) {
        const x = ((t * 0.12 + i / 6) % 1) * W;
        glowAt(x, L / 2, W * 0.02, '#ffc94d', 0.6);
      }
      break;
    }
    case 'leaf': {                                                    // 森：ふわふわ漂う蛍
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 14; i++) {
        const x = W * (((i * 0.618) + Math.sin(t * 0.4 + i * 1.7) * 0.06) % 1 + 1) % W, y = L * (((i * 0.37) + Math.cos(t * 0.3 + i) * 0.05 + 1) % 1);
        const tw = 0.4 + 0.6 * Math.max(0, Math.sin(t * (1.5 + (i % 4) * 0.4) + i * 2));
        glowAt(x % W, y, W * 0.02, th.ambient, 0.5 * tw);
      }
      break;
    }
    case 'track': {                                                   // サーキット：ゴールへ向かって流れる光の筋
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = W * 0.006; ctx.lineCap = 'round';
      for (let i = 0; i < 10; i++) {                                  // 先が明るく、尾がうすい（グラデーションを毎回作らず、2段の線で描く）
        const x = W * (0.12 + ((i * 0.37) % 0.76)), k = ((t * 0.5 + i * 0.23) % 1), dir = i % 2 ? 1 : -1;
        const y = dir > 0 ? L * (0.5 + k * 0.5) : L * (0.5 - k * 0.5), a = 0.22 * (1 - k);
        ctx.strokeStyle = rgba(th.ambient, a);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - dir * L * 0.035); ctx.stroke();
        ctx.strokeStyle = rgba(th.ambient, a * 0.35);
        ctx.beginPath(); ctx.moveTo(x, y - dir * L * 0.035); ctx.lineTo(x, y - dir * L * 0.08); ctx.stroke();
      }
      break;
    }
    case 'stars': {                                                   // 宇宙：またたく星と、ゆっくり回る渦
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 18; i++) {
        const x = ((i * 0.7548776 + 0.3) % 1) * W, y = ((i * 0.5698403 + 0.41) % 1) * L;
        const tw = Math.max(0, Math.sin(t * (1 + (i % 5) * 0.3) + i * 3));
        glowAt(x, y, W * 0.009, '#b9c6ff', 0.45 * tw * tw);          // パックと見まちがえないよう、小さく青白く
      }
      ctx.strokeStyle = rgba(th.line, 0.14); ctx.lineWidth = W * 0.005;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        for (let a = 0; a < TAU * 0.9; a += 0.1) { const r = W * (0.04 + a * 0.035), ang = a + t * 0.25 + k * TAU / 3; const px = W / 2 + Math.cos(ang) * r, py = L / 2 + Math.sin(ang) * r; a ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
        ctx.stroke();
      }
      break;
    }
    case 'concrete': {                                                // 要塞：ゴールポストのランプ。ふだんはかすかに、閉まる前は点滅して知らせる（形のある物は置かない）
      const info = Stage.shutterInfo || { warn: 0, cover: 0 };
      ctx.globalCompositeOperation = 'lighter';
      for (const o of [0, 1]) {
        for (const sx of [-1, 1]) {
          const hot = info.warn > 0 && sx === Math.sign(info.side) ? info.warn * (0.5 + 0.5 * Math.sin(t * 28)) : 0;   // ふさがる側のポストだけ
          glowAt(W / 2 + sx * Table.goalHalf[o], Table.goalY(o), W * (0.03 + 0.06 * hot), '#ffb020', 0.12 + 0.88 * hot);
        }
      }
      break;
    }
    case 'monitor': {                                                 // 鼓動：中央線を走る心電図。ゴールの幅の変化に合わせて脈打つ
      const ph = (Stage.t / STG.PULSE_PERIOD) % 1, beatX = ((t * 0.45) % 1) * W;
      ctx.strokeStyle = rgba(th.line, 0.55); ctx.lineWidth = W * 0.006; ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let x = 0; x <= W; x += W / 120) {
        const d = x - beatX, spike = Math.abs(d) < W * 0.06 ? Math.sin(d / (W * 0.06) * Math.PI * 2) * L * 0.035 * (1 + 0.6 * Math.sin(ph * TAU)) : 0;
        const y = L / 2 - spike;
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      glowAt(beatX, L / 2, W * 0.05, th.line, 0.6);
      break;
    }
    case 'caustic': {                                                 // 深海：ゆっくり昇る泡（明かりの中でだけ見える）
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 16; i++) {
        const x = W * (((i * 0.618) + Math.sin(t * 0.5 + i) * 0.02) % 1), y = L * (1 - ((t * (0.02 + (i % 4) * 0.008) + i * 0.137) % 1));
        ctx.strokeStyle = rgba(th.ambient, 0.35); ctx.lineWidth = W * 0.003;
        circle(x, y, W * (0.006 + (i % 3) * 0.004)); ctx.stroke();
      }
      break;
    }
  }
  ctx.restore();
}
