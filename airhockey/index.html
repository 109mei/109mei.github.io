'use strict';
/* =====================================================================
   ステージの仕掛けの描画（台の座標）
   色は役割ごと：柱＝灰青／バンパー＝桃／バネ＝黄緑／動く壁＝白／ワープ＝紫／矢印の床＝琥珀／減速の床＝青緑／シャッター＝黄
   ===================================================================== */

/* 床：流れる矢印・霜の降りた減速の床 */
function drawStageFloor(t) {
  const W = Table.W;
  for (const z of Stage.zones) {
    const w = z.x1 - z.x0, h = z.y1 - z.y0;
    ctx.save();
    ctx.beginPath(); ctx.rect(z.x0, z.y0, w, h); ctx.clip();
    if (z.type === 'arrow') {
      const lg = ctx.createLinearGradient(0, z.y0, 0, z.y1);
      lg.addColorStop(z.dy < 0 ? 1 : 0, 'rgba(255,179,71,.02)'); lg.addColorStop(z.dy < 0 ? 0 : 1, 'rgba(255,179,71,.20)');
      ctx.fillStyle = lg; ctx.fillRect(z.x0, z.y0, w, h);
      const sz = Math.min(w, h) * 0.42, gap = sz * 0.95, off = (t * sz * 2.2) % gap, cx = z.x0 + w / 2;
      ctx.lineWidth = W * 0.013; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let k = -1; k * gap < h + gap; k++) {
        const y = z.dy < 0 ? z.y1 - off - k * gap : z.y0 + off + k * gap;
        const u = clamp((z.dy < 0 ? z.y1 - y : y - z.y0) / h, 0, 1);       // 進む向きほど明るく
        ctx.strokeStyle = rgba(STAGE_COLOR.arrow, 0.25 + 0.7 * u);
        ctx.beginPath();
        ctx.moveTo(cx - sz * 0.6, y - z.dy * sz * 0.32);
        ctx.lineTo(cx, y + z.dy * sz * 0.32);
        ctx.lineTo(cx + sz * 0.6, y - z.dy * sz * 0.32);
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = 'rgba(46,196,196,.13)'; ctx.fillRect(z.x0, z.y0, w, h);
      ctx.strokeStyle = 'rgba(120,230,230,.28)'; ctx.lineWidth = W * 0.005;
      const step = W * 0.032, sh = (t * W * 0.01) % step;
      ctx.beginPath();
      for (let d = -h + sh; d < w; d += step) { ctx.moveTo(z.x0 + d, z.y1); ctx.lineTo(z.x0 + d + h, z.y0); }
      ctx.stroke();
      for (let i = 0; i < 7; i++) {                                         // 霜のきらめき
        const k = (t * 0.6 + i * 0.37) % 1, x = z.x0 + w * ((i * 0.618) % 1), y = z.y0 + h * ((i * 0.41 + 0.2) % 1);
        glowAt(x, y, W * 0.02, '#c9ffff', Math.sin(k * Math.PI) * 0.5);
      }
    }
    ctx.restore();
    ctx.strokeStyle = z.type === 'arrow' ? 'rgba(255,179,71,.55)' : 'rgba(46,196,196,.6)';
    ctx.lineWidth = W * 0.005;
    ctx.setLineDash([W * 0.02, W * 0.014]);
    ctx.strokeRect(z.x0, z.y0, w, h);
    ctx.setLineDash([]);
  }
}

/* バネの壁：ジグザグのコイル。当たると縮んで、光る */
function drawSpringWall(w, t) {
  const W = Table.W, x = w.ax, inward = x < W / 2 ? 1 : -1, side = x < W / 2 ? 0 : 1, n = 9;
  let squash = 0;
  for (const s of Fx.springKick) {
    if (s.side !== side || s.y < w.ay - 10 || s.y > w.by + 10) continue;
    squash = Math.max(squash, Math.sin(Math.PI * clamp(s.t / 0.35, 0, 1)) * (1 - s.t / 0.4));
  }
  const amp = W * (0.022 - 0.012 * squash);
  ctx.save();
  glowAt(x + inward * W * 0.02, (w.ay + w.by) / 2, (w.by - w.ay) * 0.6, STAGE_COLOR.spring, 0.18 + 0.5 * squash);
  ctx.strokeStyle = rgba(STAGE_COLOR.spring, 0.3); ctx.lineWidth = W * 0.03; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, w.ay); ctx.lineTo(x, w.by); ctx.stroke();
  ctx.strokeStyle = mix(STAGE_COLOR.spring, '#ffffff', 0.3 * squash); ctx.lineWidth = W * 0.009; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x, w.ay);
  for (let i = 1; i < n; i++) ctx.lineTo(x + (i % 2 ? inward * amp : inward * amp * 0.15), lerp(w.ay, w.by, i / n));
  ctx.lineTo(x, w.by);
  ctx.stroke();
  for (const y of [w.ay, w.by]) { ctx.fillStyle = STAGE_COLOR.spring; circle(x, y, W * 0.012); ctx.fill(); }
  ctx.restore();
}

/* ワープ穴：壁が切れて、紫の渦の出入り口になる */
function drawPortalWall(w, t) {
  const W = Table.W, inward = w.ax < W / 2 ? 1 : -1, depth = W * 0.08, cy = (w.ay + w.by) / 2, hl = (w.by - w.ay) / 2;
  ctx.save();
  const gl = ctx.createLinearGradient(w.ax, 0, w.ax + inward * depth, 0);
  gl.addColorStop(0, 'rgba(157,123,255,.6)'); gl.addColorStop(1, 'rgba(157,123,255,0)');
  ctx.fillStyle = gl;
  ctx.fillRect(inward > 0 ? w.ax : w.ax - depth, w.ay, depth, w.by - w.ay);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) {                                    // 渦を巻いて吸い込まれる光
    const k = ((t * 0.8 + i / 7) % 1), yy = cy + Math.sin((i * 2.1 + t * 3)) * hl * (1 - k) * 0.9;
    glowAt(w.ax + inward * depth * (1 - k) * 0.9, yy, W * 0.018, '#c4b0ff', k * 0.8);
  }
  ctx.strokeStyle = STAGE_COLOR.warp; ctx.lineWidth = W * 0.016; ctx.lineCap = 'round';
  ctx.globalAlpha = 0.6 + 0.3 * Math.sin(t * 5);
  ctx.beginPath(); ctx.moveTo(w.ax, w.ay); ctx.lineTo(w.bx, w.by); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#efe8ff'; ctx.lineWidth = W * 0.005;
  ctx.beginPath(); ctx.moveTo(w.ax, w.ay); ctx.lineTo(w.bx, w.by); ctx.stroke();
  ctx.restore();
}

/* 八角形のパス（内接円の半径が r。当たり判定の円と、平らな辺がちょうど重なる） */
function octPath(x, y, r, rot = Math.PI / 8) {
  const R = r / Math.cos(Math.PI / 8);
  ctx.beginPath();
  for (let k = 0; k < 8; k++) { const a = rot + k * TAU / 8; const px = x + Math.cos(a) * R, py = y + Math.sin(a) * R; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath();
}

/* 柱：台に固定された八角形の金属の塊（玉に見えないよう、平らな面と角、ボルト） */
function drawPillar(s, t) {
  const r = s.r, x = s.ax, y = s.ay, f = s.flash || 0, th = theme();
  const metal = th.pillar || STAGE_COLOR.pillar, s0 = lightSign();
  ctx.save();
  octPath(x, y, r * 1.2);                                       // 台に埋めこまれた土台
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();
  ctx.strokeStyle = rgba(th.line, 0.35); ctx.lineWidth = r * 0.06; ctx.stroke();
  octPath(x + s0 * r * 0.06, y + s0 * r * 0.1, r);              // ほんの少しの影（浮いていない）
  ctx.fillStyle = 'rgba(0,0,10,.5)'; ctx.fill();
  octPath(x, y, r);                                             // 側面（グラデーションは位置と色が変わったときだけ作り直す）
  const gk = x + '|' + y + '|' + r + '|' + s0 + '|' + metal;
  if (s._gk !== gk) {
    s._gk = gk;
    s._grad = ctx.createLinearGradient(x - s0 * r, y - s0 * r, x + s0 * r, y + s0 * r);
    s._grad.addColorStop(0, shade(metal, 0.25)); s._grad.addColorStop(1, shade(metal, -0.55));
  }
  ctx.fillStyle = s._grad; ctx.fill();
  octPath(x, y, r * 0.72);                                      // 上の面（平ら）
  ctx.fillStyle = shade(metal, -0.1); ctx.fill();
  ctx.strokeStyle = shade(metal, 0.45); ctx.lineWidth = r * 0.07; ctx.stroke();
  ctx.fillStyle = shade(metal, -0.6);                           // ボルト
  for (let k = 0; k < 4; k++) { const a = Math.PI / 4 + k * Math.PI / 2; circle(x + Math.cos(a) * r * 0.48, y + Math.sin(a) * r * 0.48, r * 0.07); ctx.fill(); }
  ctx.strokeStyle = rgba(th.line, 0.7); ctx.lineWidth = r * 0.08;   // 中央の印
  ctx.beginPath(); ctx.moveTo(x - r * 0.2, y); ctx.lineTo(x + r * 0.2, y); ctx.moveTo(x, y - r * 0.2); ctx.lineTo(x, y + r * 0.2); ctx.stroke();
  if (f > 0) { octPath(x, y, r); ctx.strokeStyle = rgba('#ffffff', 0.9 * f); ctx.lineWidth = r * 0.14; ctx.stroke(); }
  ctx.restore();
}

/* バンパー：ピンボールの跳ね返し台。歯車のような土台・回る光の輪・平らなふた（当たると輪が光って広がる） */
function drawBumper(s, t) {
  const r = s.r, x = s.ax, y = s.ay, f = s.flash || 0, col = STAGE_COLOR.bumper;
  ctx.save();
  ctx.beginPath();                                              // 歯車の形の土台
  for (let k = 0; k < 24; k++) { const a = k / 24 * TAU, rr = r * (k % 2 ? 1.08 : 1.22); const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath();
  ctx.fillStyle = '#1a0d22'; ctx.fill();
  ctx.strokeStyle = rgba(col, 0.5); ctx.lineWidth = r * 0.05; ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  glowAt(x, y, r * (1.8 + 1.2 * f), col, 0.25 + 0.6 * f);
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = 'butt';                                         // 区切られた光の輪（ゆっくり回る）
  ctx.strokeStyle = mix(col, '#ffffff', 0.5 * f); ctx.lineWidth = r * 0.22;
  const seg = 8, rot = t * 0.8;
  for (let k = 0; k < seg; k++) { ctx.beginPath(); ctx.arc(x, y, r * (0.86 + 0.12 * f), rot + k * TAU / seg + 0.08, rot + (k + 1) * TAU / seg - 0.08); ctx.stroke(); }
  ctx.fillStyle = '#2a1238'; circle(x, y, r * 0.66); ctx.fill();   // 平らなふた
  ctx.strokeStyle = rgba(col, 0.8); ctx.lineWidth = r * 0.05; circle(x, y, r * 0.66); ctx.stroke();
  ctx.fillStyle = f > 0 ? mix(col, '#ffffff', f) : col;            // 星の印
  ctx.beginPath();
  for (let k = 0; k < 8; k++) { const a = -Math.PI / 2 + k * Math.PI / 4, rr = r * (k % 2 ? 0.16 : 0.42); const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* 柱・バンパー・往復する壁・シャッター */
function drawStageShapes(t) {
  const s0 = lightSign(), W = Table.W;
  for (const s of Stage.shapes) {
    if (s.kind === 'pillar') drawPillar(s, t);
    else if (s.kind === 'bumper') drawBumper(s, t);
    else if (s.kind === 'sweeper') {                      // 往復する壁：白い光の棒。流れる模様と、動く向きの残像
      const f = s.flash || 0;
      ctx.save();
      ctx.lineCap = 'round';
      const dir = Math.sign(s.vx) || 1;
      for (let i = 1; i <= 3; i++) {
        ctx.strokeStyle = rgba(STAGE_COLOR.mover, 0.08 / i); ctx.lineWidth = s.r * 2;
        const o = -dir * i * Math.abs(s.vx) * 0.025;
        ctx.beginPath(); ctx.moveTo(s.ax + o, s.ay); ctx.lineTo(s.bx + o, s.by); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba('#9fb6ff', 0.35 + 0.4 * f); ctx.lineWidth = s.r * 4.5;
      ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = mix(STAGE_COLOR.mover, '#ffffff', f); ctx.lineWidth = s.r * 2;
      ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke();
      ctx.strokeStyle = 'rgba(60,80,150,.55)'; ctx.lineWidth = s.r * 0.6;
      ctx.setLineDash([s.r * 1.4, s.r * 1.4]); ctx.lineDashOffset = -t * W * 0.12 * dir;
      ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke();
      ctx.restore();
    }
  }
  drawShutters(t);
}

/* シャッター：黄色と黒のしま模様。閉まる前に、閉まる側が点滅して予告する */
function drawShutters(t) {
  if (!Stage.shutters.length) return;
  const W = Table.W, info = Stage.shutterInfo;
  for (const s of Stage.shutters) {
    const gh = Table.goalHalf[s.owner], cx = W / 2, y = Table.goalY(s.owner), dir = s.owner === 0 ? -1 : 1;
    if (info.warn > 0) {                                    // 予告：ふさがる側のゴールの半分が点滅
      const blink = 0.5 + 0.5 * Math.sin(t * 28);
      const x0 = info.side < 0 ? cx - gh : cx, x1 = info.side < 0 ? cx : cx + gh;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rgba(STAGE_COLOR.shutter, 0.4 * info.warn * blink);
      ctx.fillRect(x0, Math.min(y, y + dir * Table.pr * 1.4), x1 - x0, Table.pr * 1.4);
      ctx.restore();
    }
    if (s.off) continue;
    const len = s.bx - s.ax, th = s.r * 2;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    glowAt((s.ax + s.bx) / 2, y, Math.max(len, th) * 0.7, STAGE_COLOR.shutter, 0.35);
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath(); ctx.rect(s.ax, y - s.r, len, th); ctx.clip();
    ctx.fillStyle = STAGE_COLOR.shutter; ctx.fillRect(s.ax, y - s.r, len, th);
    ctx.fillStyle = '#1b1606';
    const st = th * 1.2;
    for (let x = s.ax - th * 2; x < s.bx + th; x += st * 2) {
      ctx.beginPath(); ctx.moveTo(x, y + s.r); ctx.lineTo(x + st, y + s.r); ctx.lineTo(x + st + th, y - s.r); ctx.lineTo(x + th, y - s.r); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = '#fff6c8'; ctx.lineWidth = W * 0.004;
    ctx.strokeRect(s.ax, y - s.r, len, th);
  }
}

/* 防壁（必殺技）：六角形の模様の光の盾。ゴールの線から台の内側へ厚く見せる。終わる前に点滅する */
function drawBarriers(t) {
  const W = Table.W;
  for (const b of Skills.shapes()) {
    const left = Skills.state.wall[b.owner], age = SKILL.WALL_TIME - left;
    const grow = easeOutCubic(age / 0.25), fade = left < 0.7 ? 0.45 + 0.55 * Math.abs(Math.sin(t * 22)) : 1;
    const cx = (b.ax + b.bx) / 2, hl = (b.bx - b.ax) / 2 * grow, y = b.ay, r = b.r, col = SKILL_TYPE.defense.color;
    const dir = b.owner === 0 ? -1 : 1, depth = r * 3.2;             // 台の内側の向きと、見た目の厚み
    const y0 = Math.min(y, y + dir * depth), hgt = depth + r;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.globalCompositeOperation = 'lighter';
    glowAt(cx, y + dir * r, hl * 1.1, col, 0.4);
    ctx.beginPath(); ctx.rect(cx - hl, Math.min(y0, y - dir * r), hl * 2, hgt + r); ctx.clip();
    const lg = ctx.createLinearGradient(0, y, 0, y + dir * depth);
    lg.addColorStop(0, rgba(col, 0.45)); lg.addColorStop(1, rgba(col, 0.04));
    ctx.fillStyle = lg; ctx.fillRect(cx - hl, Math.min(y0, y - dir * r), hl * 2, hgt + r);
    ctx.strokeStyle = rgba('#b9ffe0', 0.5); ctx.lineWidth = W * 0.003;
    const hs = r * 0.85, sh = (t * W * 0.04) % (hs * 3);
    for (let row = 0; row < 3; row++) {
      const yy = y + dir * (row * hs * 1.5 + hs * 0.2);
      for (let x = cx - hl - hs * 3 + sh + (row % 2) * hs * 1.5; x < cx + hl + hs * 3; x += hs * 3) {
        ctx.globalAlpha = fade * (1 - row * 0.3);
        ctx.beginPath();
        for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; const px = x + Math.cos(a) * hs, py = yy + Math.sin(a) * hs; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
        ctx.closePath(); ctx.stroke();
      }
    }
    ctx.globalAlpha = fade;
    ctx.strokeStyle = '#d9fff0'; ctx.lineWidth = W * 0.007;              // パックが跳ね返る位置
    ctx.beginPath(); ctx.moveTo(cx - hl, y + dir * r); ctx.lineTo(cx + hl, y + dir * r); ctx.stroke();
    ctx.restore();
  }
}

// ===== 44_draw_objects.js =====
'use strict';
/* =====================================================================
   パック・マレット・粒の描画（台の座標）
   ===================================================================== */

/* パックの残像：速いほど長く明るい光の帯。最後に打った人の色、速いほど白く、剛速球は炎の色 */
function drawTrail(p, alpha = 1, lightAt = null) {
  const tr = Fx.trails.get(p.id);
  if (!tr || tr.length < 2) return;
  const now = Fx.time, last = tr[tr.length - 1];
  const s = last.s, k = clamp((s - 0.5) / 2.2, 0, 1);
  if (s < 0.35) return;
  let col = p.lastHit >= 0 ? ownerColor(p.lastHit) : '#bcd0ff';
  if (p.skill === 'fast' && p.boost > 1) col = '#ff7a2e';
  else if (p.curve) col = SKILL_TYPE.attack.color;
  const core = mix(col, '#ffffff', 0.35 + 0.4 * k);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (let i = 1; i < tr.length; i++) {
    const a = tr[i - 1], b = tr[i];
    let u = 1 - (now - b.t) / FX.TRAIL_TIME;
    if (lightAt) u *= lightAt(b.x, b.y);                      // 暗いステージ：明かりの中の部分だけ見せる
    if (u <= 0.01) continue;
    ctx.strokeStyle = rgba(col, 0.32 * u * alpha * (0.4 + 0.6 * k));
    ctx.lineWidth = p.r * 2 * (0.35 + 0.65 * u);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.strokeStyle = rgba(core, 0.5 * u * alpha * (0.3 + 0.7 * k));
    ctx.lineWidth = p.r * 0.7 * u;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();
}

function drawPuck(p, alpha = 1) {
  const vis = (p.vis == null ? 1 : p.vis) * alpha;
  if (vis <= 0.01) return;
  const r = p.r, s0 = lightSign(), sp = Math.hypot(p.vx, p.vy) / Table.L;
  const fire = p.skill === 'fast' && p.boost > 1;
  ctx.save();
  ctx.globalAlpha = vis;
  // 速いときの残像（ぶれ）
  if (sp > 1.6) {
    const n = 3, dx = -p.vx / Table.L * r * 0.5, dy = -p.vy / Table.L * r * 0.5;
    for (let i = n; i >= 1; i--) {
      ctx.globalAlpha = vis * 0.12 * (1 - i / (n + 1));
      ctx.fillStyle = '#ffffff';
      circle(p.x + dx * i, p.y + dy * i, r); ctx.fill();
    }
    ctx.globalAlpha = vis;
  }
  shadowAt(p.x, p.y, r, 0.28, vis);
  if (fire) {                                                  // 剛速球：炎の光
    ctx.globalCompositeOperation = 'lighter';
    glowAt(p.x, p.y, r * (3 + 0.4 * Math.sin(Fx.time * 40)), '#ff6a2e', 0.7 * vis);
    ctx.globalCompositeOperation = 'source-over';
  }
  // 本体：白い円盤＋縁の色（最後に打った人）
  const rim = p.lastHit >= 0 ? ownerColor(p.lastHit) : '#9aa8c8';
  const g = ctx.createRadialGradient(p.x - s0 * r * 0.35, p.y - s0 * r * 0.4, r * 0.1, p.x, p.y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, fire ? '#ffe0b8' : '#e6ecfb'); g.addColorStop(1, fire ? '#ff9a4d' : '#9eabc9');
  ctx.fillStyle = g; circle(p.x, p.y, r); ctx.fill();
  ctx.strokeStyle = fire ? '#ff6a2e' : rim; ctx.lineWidth = r * 0.22;
  circle(p.x, p.y, r * 0.86); ctx.stroke();
  ctx.strokeStyle = 'rgba(30,40,80,.25)'; ctx.lineWidth = r * 0.08;
  circle(p.x, p.y, r * 0.45); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.75)';                     // つや
  ctx.beginPath(); ctx.ellipse(p.x - s0 * r * 0.32, p.y - s0 * r * 0.38, r * 0.32, r * 0.18, -0.6, 0, TAU); ctx.fill();
  ctx.restore();
}

/* マレット：持ち手のある円盤。打った瞬間に弾み、構え中・重い腕のときは周りに印が出る */
function drawMallet(m, t) {
  const live = Physics.mallets[m.owner] === m;                // 選択画面の見本では、いつも出ている
  const k = live ? Fx.present[m.owner] : 1;
  if (k <= 0.01) return;                                       // 指を離していて消えている
  const pop = live && m.active ? easeOutBack(Fx.appearT[m.owner] / 0.2) : k;   // 現れるときは弾むように、消えるときは縮んで
  const r = m.r, s0 = lightSign(), col = ownerColor(m.owner), pulse = live ? Fx.malletPulse[m.owner] || 0 : 0;
  const armed = m.owner === Match.me && Skills.state.armed[m.owner], heavy = Skills.state.heavy[m.owner] > 0;   // 構え中は自分にだけ見せる
  const sp = Math.hypot(m.vx, m.vy) / Table.L;
  const rr = r * (1 + 0.08 * pulse) * Math.max(0.05, pop);
  ctx.save();
  ctx.globalAlpha = Math.min(1, k * 1.2);
  drawMalletBody(m, t, r, rr, s0, col, pulse, armed, heavy, sp);
  ctx.restore();
}

function drawMalletBody(m, t, r, rr, s0, col, pulse, armed, heavy, sp) {
  // 速く振ったときの残像
  if (sp > 1.2) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i <= 3; i++) {
      const k = i * 0.012;
      ctx.globalAlpha = 0.16 * (1 - i / 4) * clamp((sp - 1.2) / 2, 0, 1);
      ctx.fillStyle = col;
      circle(m.x - m.vx * k, m.y - m.vy * k, r * 0.95); ctx.fill();
    }
    ctx.restore();
  }
  shadowAt(m.x, m.y, rr * (heavy ? 1.05 : 1), heavy ? 0.18 : 0.42);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  glowAt(m.x, m.y, rr * (1.9 + 0.8 * pulse), col, 0.28 + 0.4 * pulse);
  ctx.restore();
  if (armed) {                                                 // 構え中：攻撃の色の、回る輪と火花
    const ac = SKILL_TYPE.attack.color;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    glowAt(m.x, m.y, rr * 2.3, ac, 0.35 + 0.15 * Math.sin(t * 10));
    ctx.strokeStyle = ac; ctx.lineWidth = r * 0.12;
    ctx.setLineDash([r * 0.5, r * 0.32]); ctx.lineDashOffset = -t * r * 4;
    circle(m.x, m.y, rr * 1.38); ctx.stroke();
    ctx.setLineDash([]);
    for (let i = 0; i < 3; i++) {
      const a = t * 5 + i * TAU / 3;
      glowAt(m.x + Math.cos(a) * rr * 1.38, m.y + Math.sin(a) * rr * 1.38, r * 0.35, '#ffe0b0', 0.9);
    }
    ctx.restore();
  }
  // 本体：外側の輪
  const g = ctx.createRadialGradient(m.x - s0 * rr * 0.4, m.y - s0 * rr * 0.45, rr * 0.1, m.x, m.y, rr);
  const body = heavy ? mix(col, '#3a2a5a', 0.55) : col;
  g.addColorStop(0, shade(body, 0.45)); g.addColorStop(0.55, body); g.addColorStop(1, shade(body, -0.5));
  ctx.fillStyle = g; circle(m.x, m.y, rr); ctx.fill();
  ctx.strokeStyle = shade(body, -0.35); ctx.lineWidth = rr * 0.08;
  circle(m.x, m.y, rr * 0.7); ctx.stroke();
  // 持ち手（中央の盛り上がり）
  const k = ctx.createRadialGradient(m.x - s0 * rr * 0.18, m.y - s0 * rr * 0.22, rr * 0.03, m.x, m.y, rr * 0.45);
  k.addColorStop(0, '#ffffff'); k.addColorStop(0.4, shade(body, 0.35)); k.addColorStop(1, shade(body, -0.25));
  ctx.fillStyle = k; circle(m.x, m.y, rr * 0.42); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(m.x - s0 * rr * 0.42, m.y - s0 * rr * 0.5, rr * 0.28, rr * 0.13, -0.6, 0, TAU); ctx.fill();
  if (pulse > 0) {                                             // 打った瞬間の輪
    ctx.strokeStyle = rgba('#ffffff', pulse * 0.8); ctx.lineWidth = rr * 0.1 * pulse;
    circle(m.x, m.y, rr * (1.05 + 0.35 * (1 - pulse))); ctx.stroke();
  }
  if (heavy) drawHeavy(m, t, rr);
  if (Skills.state.giant[m.owner] > 0) drawGiant(m, t, rr);
  if (Skills.state.mirror[m.owner] > 0) drawMirror(m, t, rr);
}

/* 重い腕：紫の鎖と、まわりを重そうに回る重り */
/* 巨大化：守りの色の輪。終わる前に点滅 */
function drawGiant(m, t, rr) {
  const left = Skills.state.giant[m.owner], col = SKILL_TYPE.defense.color;
  ctx.save();
  ctx.globalAlpha = left < 0.6 ? 0.4 + 0.6 * Math.abs(Math.sin(t * 22)) : 1;
  ctx.strokeStyle = col; ctx.lineWidth = rr * 0.09;
  circle(m.x, m.y, rr * 1.08); ctx.stroke();
  ctx.restore();
}

/* 反転：左右の矢印が、マレットのまわりを回る */
function drawMirror(m, t, rr) {
  const left = Skills.state.mirror[m.owner], col = SKILL_TYPE.disrupt.color;
  ctx.save();
  ctx.globalAlpha = left < 0.6 ? 0.4 + 0.6 * Math.abs(Math.sin(t * 22)) : 1;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = rr * 0.12; ctx.lineCap = 'round';
  for (let i = 0; i < 2; i++) {
    const a0 = t * 2.5 + i * Math.PI, a1 = a0 + 1.9, R = rr * 1.32;
    ctx.beginPath(); ctx.arc(m.x, m.y, R, a0, a1); ctx.stroke();
    const hx = m.x + Math.cos(a1) * R, hy = m.y + Math.sin(a1) * R, tx = -Math.sin(a1), ty = Math.cos(a1);
    ctx.beginPath();
    ctx.moveTo(hx + tx * rr * 0.32, hy + ty * rr * 0.32);
    ctx.lineTo(hx - ty * rr * 0.22, hy + tx * rr * 0.22);
    ctx.lineTo(hx + ty * rr * 0.22, hy - tx * rr * 0.22);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawHeavy(m, t, rr) {
  const col = SKILL_TYPE.disrupt.color, left = Skills.state.heavy[m.owner];
  const blink = left < 0.6 ? 0.5 + 0.5 * Math.sin(t * 24) : 1;
  ctx.save();
  ctx.globalAlpha = blink;
  ctx.globalCompositeOperation = 'lighter';
  glowAt(m.x, m.y, rr * 2.4, col, 0.45);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = col; ctx.lineWidth = rr * 0.16;
  ctx.setLineDash([rr * 0.22, rr * 0.14]); ctx.lineDashOffset = t * rr * 0.6;
  circle(m.x, m.y, rr * 1.25); ctx.stroke();
  ctx.setLineDash([]);
  for (let i = 0; i < 4; i++) {
    const a = t * 0.9 + i * TAU / 4, x = m.x + Math.cos(a) * rr * 1.25, y = m.y + Math.sin(a) * rr * 1.25;
    ctx.fillStyle = '#2a1a44'; ctx.strokeStyle = col; ctx.lineWidth = rr * 0.06;
    ctx.beginPath(); ctx.rect(x - rr * 0.18, y - rr * 0.18, rr * 0.36, rr * 0.36); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

/* 粒・衝撃波・光（ほとんどは加算で重ねて光らせる） */
function drawFxWorld() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const g of Fx.glows) {
    if (g.delay > 0) continue;
    const u = g.life / g.max;
    glowAt(g.x, g.y, g.r * (1.2 - 0.2 * u), g.color, u * 0.9);
  }
  for (const b of Fx.beams) {
    const u = b.life / b.max;
    ctx.strokeStyle = rgba(b.color, 0.7 * u); ctx.lineWidth = Table.pr * 1.6 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.strokeStyle = rgba('#ffffff', 0.8 * u); ctx.lineWidth = Table.pr * 0.3 * u;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
  }
  for (const r of Fx.rings) {
    if (r.delay > 0) continue;
    const u = 1 - r.life / r.max, e = easeOutCubic(u);
    ctx.strokeStyle = rgba(r.color, (1 - u) * 0.9);
    ctx.lineWidth = Table.W * r.w * (1 - u * 0.7);
    circle(r.x, r.y, lerp(r.r0, r.r1, e)); ctx.stroke();
  }
  ctx.lineCap = 'round';
  for (const p of Fx.parts) {
    if (p.delay > 0) continue;
    const u = p.life / p.max;
    if (p.k === 'spark') {
      ctx.strokeStyle = rgba(p.color, Math.min(1, u * 1.4));
      ctx.lineWidth = Table.W * 0.006 * (p.w || 1) * (0.4 + 0.6 * u);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
    } else if (p.k === 'dot' || p.k === 'home') {
      glowAt(p.x, p.y, p.size * (0.5 + 0.8 * u) * 2, p.color, u);
    } else if (p.k === 'shard') {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = rgba(p.color, Math.min(1, u * 1.5));
      const s = p.size * (0.5 + 0.5 * u);
      ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.6, s * 0.6); ctx.lineTo(-s * 0.7, s * 0.4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of Fx.parts) {                                    // 煙は加算にしない（もやっと広がる）
    if (p.k !== 'smoke' || p.delay > 0) continue;
    const u = p.life / p.max;
    ctx.globalAlpha = u * 0.35;
    ctx.drawImage(Sprites.glow(p.color), p.x - p.size * (2 - u), p.y - p.size * (2 - u), p.size * (4 - 2 * u), p.size * (4 - 2 * u));
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

'use strict';
/* =====================================================================
   画面に重ねる表示（画面の座標で描く。ゲストでも逆さにならない）
   試合中に出す文字はゴールとカウントダウンの数字だけ。ほかは記号と光で伝える
   - 角の三角形のゲージ：液体が満ちていくように溜まり、満タンで金色に光る。中に技のマーク
   - 必殺技は発動の瞬間の演出を出さない（いきなり使われるのが面白い）。ゲージが空になるだけ
   - 試合の始め：両者の技のマーク／得点後：サーブ側のパックから光の輪／マレットが消えているとき：触れる場所の波紋
   ===================================================================== */

/* 三角形の3点（画面の座標）：角 C、壁ぞいの点 V、ゴールの線ぞいの点 H */
function triPoints(owner, side) {
  const { W, L, D } = Table, y = Table.goalY(owner), x = side === 0 ? 0 : W;
  const dy = owner === 0 ? -D : D, dx = side === 0 ? D : -D;
  return { C: scr(x, y), V: scr(x, y + dy), H: scr(x + dx, y) };
}

function drawGauges(t) {
  screenTransform();
  for (const owner of [0, 1]) for (const side of [0, 1]) drawGaugeTri(owner, side, t);
}

function drawGaugeTri(owner, side, t) {
  const { C, V, H } = triPoints(owner, side);
  const mine = owner === Match.me, col = ownerColor(owner);
  const fill = clamp(Fx.gaugeShow[owner], 0, 1), full = Match.shownGauge(owner) >= 1;   // 相手が攻撃の技を構えている間は満タンに見せる
  const sk = SKILLS.find(s => s.id === Match.skill[owner]) || SKILLS[0];
  const tcol = SKILL_TYPE[sk.type].color;
  let shake = 0;
  if (mine && Fx.denyT[side] < 0.35) shake = Math.sin(Fx.denyT[side] * 70) * 5 * (1 - Fx.denyT[side] / 0.35);
  ctx.save();
  ctx.translate(shake, 0);
  const path = () => { ctx.beginPath(); ctx.moveTo(C.x, C.y); ctx.lineTo(V.x, V.y); ctx.lineTo(H.x, H.y); ctx.closePath(); };
  // 地：角ほど暗く、斜めの辺に向かって持ち主の色がにじむ
  path();
  const bg = ctx.createLinearGradient(C.x, C.y, (V.x + H.x) / 2, (V.y + H.y) / 2);
  bg.addColorStop(0, '#04081a'); bg.addColorStop(1, mix('#04081a', col, mine ? 0.28 : 0.2));
  ctx.fillStyle = bg; ctx.fill();
  ctx.save();
  path(); ctx.clip();
  // 液体：面積が溜まった割合になる高さ（三角形なので、底のほうが広い）
  const hgt = V.y - C.y, lvl = full ? 1 : 1 - Math.sqrt(1 - fill), sy = C.y + hgt * lvl;
  const xmin = Math.min(C.x, H.x) - 10, xmax = Math.max(C.x, H.x) + 10;
  const liquid = full ? COLORS.ready : col;
  if (lvl > 0.001) {
    const amp = (2 + 5 * Fx.gaugeSplash[owner]) * (full ? 0.6 : 1), dir = Math.sign(hgt);
    const grd = ctx.createLinearGradient(0, C.y, 0, sy);
    grd.addColorStop(0, shade(liquid, -0.35)); grd.addColorStop(1, shade(liquid, 0.15));
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.moveTo(xmin, C.y - dir * 20);
    for (let x = xmin; x <= xmax; x += 4) ctx.lineTo(x, sy + Math.sin(x * 0.12 + t * 5 * (side ? -1 : 1)) * amp + Math.sin(x * 0.05 - t * 3) * amp * 0.6);
    ctx.lineTo(xmax, C.y - dir * 20); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba('#ffffff', 0.55); ctx.lineWidth = 1.5;                 // 水面のきらめき
    ctx.beginPath();
    for (let x = xmin; x <= xmax; x += 4) { const y = sy + Math.sin(x * 0.12 + t * 5 * (side ? -1 : 1)) * amp + Math.sin(x * 0.05 - t * 3) * amp * 0.6; x === xmin ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    for (let i = 0; i < 6; i++) {                                                  // 泡
      const ph = (t * (0.5 + i * 0.07) + i * 0.173) % 1;
      const bx = lerp(C.x, H.x, 0.12 + ((i * 0.37) % 0.6)), by = lerp(C.y, sy, ph);
      ctx.fillStyle = rgba('#ffffff', 0.35 * Math.sin(ph * Math.PI));
      circle(bx, by, 1.5 + (i % 3)); ctx.fill();
    }
  }
  if (full) {                                                                      // 満タン：斜めの光が走る
    const k = (t * 0.9) % 1.6 - 0.3, len = Math.hypot(H.x - C.x, V.y - C.y);
    const gx = lerp(Math.min(C.x, H.x) - len * 0.3, Math.max(C.x, H.x) + len * 0.3, k);
    const sg = ctx.createLinearGradient(gx - len * 0.25, 0, gx + len * 0.25, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,.55)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(xmin, Math.min(C.y, V.y) - 10, xmax - xmin, Math.abs(hgt) + 20);
  }
  if (mine && Fx.denyT[side] < 0.35) { ctx.fillStyle = rgba('#ff3b55', 0.4 * (1 - Fx.denyT[side] / 0.35)); ctx.fillRect(xmin, Math.min(C.y, V.y) - 10, xmax - xmin, Math.abs(hgt) + 20); }
  ctx.restore();
  // 縁：満タンなら脈打つ金色の光
  path();
  if (full) {
    const pz = 0.5 + 0.5 * Math.sin(t * 7 + (mine ? 0 : 1));
    ctx.save();
    ctx.shadowColor = COLORS.ready; ctx.shadowBlur = 10 + 14 * pz;
    ctx.strokeStyle = mix(COLORS.ready, '#ffffff', 0.4 * pz); ctx.lineWidth = 2.5 + 1.5 * pz;
    ctx.stroke();
    ctx.restore();
  } else {
    ctx.strokeStyle = rgba(col, 0.3); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = rgba(mix(col, '#ffffff', 0.3), 0.9); ctx.lineWidth = 2.5;      // 斜めの辺をはっきり
    ctx.beginPath(); ctx.moveTo(V.x, V.y); ctx.lineTo(H.x, H.y); ctx.stroke();
  }
  // 技のマーク（文字は使わない）。満タンなら金色に光って脈打ち、構え中はマークのまわりを輪が回る
  const underPause = !mine && side === (Layout.flip ? 1 : 0);                    // 左上は一時停止ボタンがあるので出さない
  if (!underPause) {
    const leg = Math.abs(H.x - C.x), mx = C.x + (H.x - C.x) * 0.34, my = C.y + (V.y - C.y) * 0.34;
    const armed = mine && !!Skills.state.armed[owner], pz = 0.5 + 0.5 * Math.sin(t * 7 + owner);   // 構え中は自分にだけ見せる
    const ms = leg * 0.4 * (full ? 1 + 0.1 * pz : 1);
    const mc = full ? '#fffdf2' : armed ? SKILL_TYPE.attack.color : tcol;          // 満タン：金色の液体の上で目立つよう白く
    if (full) { ctx.fillStyle = 'rgba(60,40,0,.35)'; circle(mx, my, ms * 0.62); ctx.fill(); }   // 白いマークが金色に埋もれないよう、うすい影
    ctx.globalAlpha = full || armed ? 1 : 0.8;
    drawSkillMark(ctx, sk.id, mx, my, ms, mc, { glow: full ? 0.5 + 0.5 * pz : armed ? 0.6 : 0 });
    ctx.globalAlpha = 1;
    if (armed) {
      ctx.save();
      ctx.strokeStyle = SKILL_TYPE.attack.color; ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]); ctx.lineDashOffset = -t * 30;
      circle(mx, my, ms * 0.66); ctx.stroke();
      ctx.restore();
    }
  }
  if (Fx.gaugeFullT[owner] < 0.5) {                                                // 満タンになった瞬間の輪
    const u = Fx.gaugeFullT[owner] / 0.5;
    path(); ctx.strokeStyle = rgba('#ffffff', 1 - u); ctx.lineWidth = 6 * (1 - u); ctx.stroke();
  }
  ctx.restore();
}

/* 台の中央の座標（画面） */
function centerScr() { return scr(Table.W / 2, Table.L / 2); }

/* カウントダウン（数字）・試合の始めの技の紹介（マーク）・サーブの合図（光の輪）。文字は出さない */
function drawCountdown(t) {
  const c = Fx.countAnim, W = Table.W * Layout.scale;
  screenTransform();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cs = centerScr();
  if (c && c.n > 0 && Match.state === 'countdown') {
    const u = clamp(c.t / 0.35, 0, 1), s = lerp(2.2, 1, easeOutBack(u)), a = clamp(1.3 - c.t, 0, 1);
    const px = W * 0.32 * s;
    ctx.globalAlpha = a;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glowAt(cs.x, cs.y, px * 1.2, COLORS.ui, 0.5 * a);
    ctx.restore();
    outlinedText(String(c.n), cs.x, cs.y, px, '#ffffff', 'rgba(10,16,48,.9)', 0.12);
    ctx.globalAlpha = 1;
  }
  if (Match.state === 'countdown' && Match.intro) {                                 // 試合の始め：両者の技のマーク（自分は左下、相手は右上）
    const e = FLOW.COUNTDOWN - Match.timer, k = easeOutBack(clamp(e / 0.45, 0, 1)), a = clamp(Match.timer / 0.4, 0, 1);
    for (const o of [0, 1]) {
      const sk = SKILLS.find(q => q.id === Match.skill[o]);
      if (!sk) continue;
      const p = scr(o === 0 ? Table.W * 0.25 : Table.W * 0.75, o === 0 ? Table.L * 0.7 : Table.L * 0.3);
      const size = W * 0.18 * Math.max(0.01, k);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(6,10,28,.75)'; circle(p.x, p.y, size * 0.78); ctx.fill();
      ctx.strokeStyle = ownerColor(o); ctx.lineWidth = 3; circle(p.x, p.y, size * 0.78); ctx.stroke();
      drawSkillMark(ctx, sk.id, p.x, p.y, size, SKILL_TYPE[sk.type].color, { glow: 0.5 });
    }
    ctx.globalAlpha = 1;
  }
  if (Match.state === 'countdown' && !Match.intro && Physics.pucks[0]) {           // 得点後：サーブする側の色の輪がパックから広がる
    const q = Physics.pucks[0], p = scr(q.x, q.y), col = ownerColor(Match.server), r = q.r * Layout.scale;
    ctx.save();
    for (const ph of [(t * 1.4) % 1, (t * 1.4 + 0.5) % 1]) {
      ctx.strokeStyle = rgba(col, 0.85 * (1 - ph)); ctx.lineWidth = 3;
      circle(p.x, p.y, r * (1.25 + ph * 2)); ctx.stroke();
    }
    ctx.restore();
  }
}

/* ゴールの文字：たたきつけるように大きく出て、光の筋が走る */
function drawGoalAnim(t) {
  const g = Fx.goalAnim;
  if (!g || g.t > 1.6) return;
  const W = Table.W * Layout.scale, cs = centerScr(), mine = g.scorer === Match.me;
  const col = mine ? COLORS.me : COLORS.opp;
  screenTransform();
  const u = clamp(g.t / 0.28, 0, 1), s = lerp(2.8, 1, easeOutBack(u)), a = clamp((1.6 - g.t) / 0.4, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 9; i++) {                                                     // 横に走る光の筋
    const y = cs.y + (i - 4) * W * 0.035 + Math.sin(i * 7.1) * 6, k = ((g.t * 1.8 + i * 0.13) % 1);
    const x0 = lerp(-W * 0.2, Layout.vw, k);
    const lg = ctx.createLinearGradient(x0, 0, x0 + W * 0.5, 0);
    lg.addColorStop(0, rgba(col, 0)); lg.addColorStop(0.7, rgba(col, 0.55)); lg.addColorStop(1, rgba('#ffffff', 0));
    ctx.fillStyle = lg; ctx.fillRect(x0, y - 1.5, W * 0.5, 3);
  }
  glowAt(cs.x, cs.y, W * 0.55 * s, col, 0.55);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(cs.x, cs.y); ctx.rotate(-0.06 * (1 - u)); ctx.scale(s, s);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlinedText(mine ? 'ゴール！' : '失点…', 0, 0, W * 0.17, mine ? '#ffffff' : '#ffd6de', rgba(shade(col, -0.6), 0.95), 0.14);
  ctx.fillStyle = col;
  ctx.globalAlpha = a * clamp((g.t - 0.25) / 0.2, 0, 1);
  outlinedText(Match.score[Match.me] + ' - ' + Match.score[1 - Match.me], 0, W * 0.15, W * 0.08, mix(col, '#ffffff', 0.5));
  ctx.restore();
}

/* 浮かぶ文字（いまは使っていない。試合中に出す文字はゴールだけにしている） */
function drawTexts() {
  screenTransform();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const tx of Fx.texts) {
    const u = 1 - tx.life / tx.max, p = scr(tx.x, tx.y);
    const s = u < 0.2 ? easeOutBack(u / 0.2) : 1, a = u > 0.7 ? 1 - (u - 0.7) / 0.3 : 1;
    ctx.globalAlpha = a;
    const px = tx.size * Layout.scale * s;
    ctx.font = font(px);
    const hw = ctx.measureText(tx.s).width / 2 + 8;                                  // 画面の端からはみ出さないように
    const x = clamp(p.x, hw, Math.max(hw, Layout.vw - hw));
    outlinedText(tx.s, x, p.y - u * tx.rise * Layout.vh, px, tx.color);
  }
  ctx.globalAlpha = 1;
}

/* ラリー回数：中央線の右端に。増えた瞬間に弾む。2個目が近づくと色が変わる */
function drawRally(t) {
  if (Match.rally <= 0 || Match.state !== 'play') return;
  screenTransform();
  const p = scr(Table.W, Table.L / 2), n = Match.rally, pop = Fx.rallyPop ? Fx.rallyPop.t : 9;
  const s = pop < 0.3 ? 1 + 0.5 * Math.sin(Math.PI * pop / 0.3) : 1;
  const near = !Match.second && n >= TUNE.SECOND_PUCK_RALLY - 3;
  const col = near ? mix(COLORS.ui, COLORS.ready, 0.5 + 0.5 * Math.sin(t * 10)) : mix('#8fb0ff', COLORS.ready, Fx.heat);
  const x = Layout.flip ? scr(0, Table.L / 2).x : p.x;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const size = Table.W * Layout.scale * 0.045;
  ctx.globalAlpha = 0.9;
  outlinedText(String(n), x - 8, p.y, size * 1.5 * s, col);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';                   // 打ち合いの記号（上下の矢印）
  const ax = x - 8 - size * 0.5, ay = p.y - size * 1.5;
  ctx.beginPath();
  ctx.moveTo(ax - size * 0.3, ay - size * 0.35); ctx.lineTo(ax - size * 0.3, ay + size * 0.35); ctx.lineTo(ax - size * 0.45, ay + size * 0.15);
  ctx.moveTo(ax + size * 0.3, ay + size * 0.35); ctx.lineTo(ax + size * 0.3, ay - size * 0.35); ctx.lineTo(ax + size * 0.45, ay - size * 0.15);
  ctx.stroke();
  if (near) {                                                                        // 2個目までの残りを金の点で
    const left = TUNE.SECOND_PUCK_RALLY - n;
    for (let i = 0; i < left; i++) { ctx.fillStyle = COLORS.ready; circle(x - 8 - size * 0.25 - i * size * 0.55, p.y + size * 1.25, size * 0.17); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

/* 指を離していてマレットが消えているとき：触れる場所の目印（波紋）を出す */
function drawTouchHint(t) {
  if (!Match.active || Match.paused || Physics.mallets[Match.me] && Physics.mallets[Match.me].active) return;
  if (Match.state !== 'countdown' && Fx.inactiveT[Match.me] < 1.0) return;
  const p = scr(Table.W / 2, Match.me === 0 ? Table.L * 0.84 : Table.L * 0.16), r = Table.mr * Layout.scale;
  screenTransform();
  ctx.save();
  for (const ph of [(t * 0.9) % 1, (t * 0.9 + 0.5) % 1]) {
    ctx.strokeStyle = rgba(COLORS.me, 0.6 * (1 - ph)); ctx.lineWidth = 2.5;
    circle(p.x, p.y, r * (0.5 + ph * 1.4)); ctx.stroke();
  }
  ctx.fillStyle = rgba(COLORS.me, 0.5 + 0.2 * Math.sin(t * 5)); circle(p.x, p.y, r * 0.28); ctx.fill();
  ctx.restore();
}

function drawFlash() {
  const f = Fx.flash;
  screenTransform(false);
  if (f) {
    ctx.fillStyle = rgba(f.color, f.a * (f.life / f.max));
    ctx.fillRect(0, 0, Layout.vw, Layout.vh);
  }
  // ふち（いつも少しだけ暗く）
  const vg = ctx.createRadialGradient(Layout.vw / 2, Layout.vh / 2, Math.min(Layout.vw, Layout.vh) * 0.45, Layout.vw / 2, Layout.vh / 2, Math.max(Layout.vw, Layout.vh) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,10,0)'); vg.addColorStop(1, 'rgba(0,0,10,.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, Layout.vw, Layout.vh);
}

// ===== 46_draw_dark.js =====
'use strict';
/* =====================================================================
   暗いステージ：画面を暗くし、両者のマレットの周りだけを明るくする
   パック自体は光らず、マレットの明かりに入ったときだけ見える
   ===================================================================== */
let darkCv = null, darkCtx = null;
const lightRadius = () => Table.mr * STG.LIGHT_R;

function drawDarkMask(t) {
  // 暗さはやわらかいグラデーションだけなので、小さいキャンバスに描いて引き伸ばす（軽くするため）
  const k = 0.25, w = Math.max(1, Math.round(Layout.vw * k)), h = Math.max(1, Math.round(Layout.vh * k));
  if (!darkCv) { darkCv = document.createElement('canvas'); darkCtx = darkCv.getContext('2d'); }
  if (darkCv.width !== w || darkCv.height !== h) { darkCv.width = w; darkCv.height = h; }
  const c = darkCtx;
  c.globalCompositeOperation = 'source-over';
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, w, h);
  c.fillStyle = `rgba(1,2,8,${STG.DARK_ALPHA})`;
  c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'destination-out';
  c.setTransform(k, 0, 0, k, 0, 0);
  for (const m of Physics.mallets) {
    const k = Fx.present[m.owner];
    if (k <= 0.01) continue;                                   // 消えているマレットは光らない
    const s = scr(m.x, m.y);
    const R = k * lightRadius() * Layout.scale * (1 + 0.025 * Math.sin(t * 7 + m.owner * 2) + 0.015 * Math.sin(t * 23));   // ほんの少しゆらぐ明かり
    const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, R);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,.97)'); g.addColorStop(0.8, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(s.x, s.y, R, 0, TAU); c.fill();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(darkCv, -2, -2, canvas.width + 4, canvas.height + 4);
  // 明かりのふちに、持ち主の色をうっすら
  screenTransform();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const m of Physics.mallets) {
    if (Fx.present[m.owner] <= 0.01) continue;
    const s = scr(m.x, m.y), R = lightRadius() * Layout.scale * Fx.present[m.owner];
    ctx.strokeStyle = rgba(ownerColor(m.owner), 0.12);
    ctx.lineWidth = R * 0.12;
    circle(s.x, s.y, R * 0.82); ctx.stroke();
  }
  ctx.restore();
}

/* パックの見え方：マレットの明かりの中にいるときだけ見える */
function darkPuckAlpha(p) { return darkLightAt(p.x, p.y); }
function darkLightAt(x, y) {
  const R = lightRadius();
  let best = 0;
  for (const m of Physics.mallets) {
    const k = Fx.present[m.owner];
    if (k <= 0.01) continue;
    const d = Math.hypot(x - m.x, y - m.y) / (R * k);
    const a = d <= 0.55 ? 1 : d >= 1 ? 0 : 1 - (d - 0.55) / 0.45;
    if (a > best) best = a;
  }
  return best * best * (3 - 2 * best);
}

// ===== 47_draw_frame.js =====
'use strict';
/* =====================================================================
   1フレームの描画の順番
   台（下地）→ 床 → ゴール → 点数 → 壁 → 仕掛け → 防壁 → 残像・パック → マレット → 粒
   暗いステージでは、粒まで描いてから暗くし、明かりの中のパックとマレットを上に描く
   最後に画面に重ねる表示（ゲージ・数字・技のマーク・フラッシュ）
   ===================================================================== */
function drawWorld(t) {
  const d = Layout.dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04070f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(TableArt.base(), Fx.shakeX * d, Fx.shakeY * d);
  tableTransform();
  drawHeat(t);
  drawStageDecor(t);
  if (!Stage.dark) drawAmbient(t);
  drawStageFloor(t);
  drawGoals(t);
  if (!Stage.dark) drawScores();
  tableTransform();
  drawWalls(t);
  drawStageShapes(t);
  drawBarriers(t);
  const pucks = Physics.pucks;
  if (!Stage.dark) {
    for (const p of pucks) drawTrail(p);
    drawFxWorld();                                   // 火花や光はパックとマレットの下に描く（強打の光でパックが見えなくならないように）
    for (const p of pucks) drawPuck(p);
    for (const m of Physics.mallets) drawMallet(m, t);
  } else {
    drawFxWorld();
    drawDarkMask(t);
    drawScores();
    tableTransform();
    for (const p of pucks) drawTrail(p, 1, darkLightAt);
    for (const p of pucks) { const a = darkPuckAlpha(p); if (a > 0.01) drawPuck(p, a); }
    for (const m of Physics.mallets) drawMallet(m, t);
  }
}

function drawMatch(t) {
  drawWorld(t);
  drawGauges(t);
  drawTexts();
  drawRally(t);
  drawTouchHint(t);
  drawCountdown(t);
  drawGoalAnim(t);
  drawFlash();
}

/* =====================================================================
   タイトルなどの背景：本物の台の上を、パックがステージの仕掛けに当たりながら滑り続ける
   ===================================================================== */
const Attract = {
  stages: ['pillars', 'sweeper', 'spring', 'boost', 'warp', 'shutter', 'pulse'],
  idx: 0, timer: 0, on: false,

  start() {
    Layout.locked = false;
    Layout.setTableFromView();
    Table.setup(Layout.W);
    Match.me = 0;
    Match.rally = 0; Match.state = 'idle'; Match.gauge = [0, 0];
    Physics.rally = 4;
    Physics.mallets = [];
    Skills.reset();
    Fx.reset();
    this.idx = (Math.random() * this.stages.length) | 0;
    this.load();
    this.on = true;
  },
  load() {
    Stage.load(this.stages[this.idx]);
    Physics.pucks = [0, 1, 2].map(() => this.spawn());
    this.timer = 9;
  },
  spawn() {
    const { W, L } = Table, a = rand(0, TAU), s = rand(0.7, 1.3) * L;
    return Physics.newPuck(W * rand(0.3, 0.7), L * rand(0.3, 0.7), Math.cos(a) * s, Math.sin(a) * s);
  },
  update(dt) {
    if (!this.on) return;
    if (Table.W !== Layout.W) { Table.setup(Layout.W); this.load(); }
    this.timer -= dt;
    if (this.timer <= 0) { this.idx = (this.idx + 1) % this.stages.length; this.load(); }
    const sc = Physics.step(dt);
    Stage.update(dt);
    if (sc >= 0) {                                      // ゴールに入ったら、中央からまた出す
      Physics.pucks = Physics.pucks.filter(p => p.scored == null);
      const p = this.spawn(); p.x = Table.W / 2; p.y = Table.L / 2;
      Physics.pucks.push(p);
      Fx.ring(p.x, p.y, Table.pr, Table.pr * 5, 0.5, COLORS.ready, 0.012);
    }
    for (const p of Physics.pucks) {                    // ゆっくりになったら、軽く押し直す
      const s = Math.hypot(p.vx, p.vy);
      if (s < 0.6 * Table.L) { const k = 1 + dt * 0.8; p.vx *= k; p.vy *= k; if (s < 1) { p.vx = Table.L * 0.5; } }
    }
  },
  draw(t) {
    drawWorld(t);
    screenTransform(false);
    ctx.fillStyle = UI.screen === 'title' ? 'rgba(3,6,16,.3)' : 'rgba(3,6,16,.62)';   // メニューの文字が読みやすいよう、背景を暗く
    ctx.fillRect(0, 0, Layout.vw, Layout.vh);
  },
};
