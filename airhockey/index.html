'use strict';
/* =====================================================================
   選択画面の絵：ステージの見本（本物と同じ描き方で小さく）。必殺技のマークは 49_marks.js
   ===================================================================== */

/* ステージの見本。起動時に1回だけ描く（台とステージを一時的に組み立てて描く） */
function renderStagePreview(cv, id) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = cv.clientWidth || 96, ch = cv.clientHeight || 150;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  const g = cv.getContext('2d');
  Table.setup(GEO.TABLE_LEN * 0.56);
  Stage.load(id);
  Stage.set(id === 'shutter' ? 3.2 : 1.3);
  Table.clampGoal(); Table.buildWalls();
  const { W, L } = Table, k = Math.min(cw / W, ch / L) * dpr;
  withCtx(g, () => {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cv.width, cv.height);
    g.setTransform(k, 0, 0, k, (cv.width - W * k) / 2, (cv.height - L * k) / 2);
    paintThemeSurface(g, STAGE_THEME[id] || STAGE_THEME.pillars);
    drawStageDecor(1.3);
    drawStageFloor(1.3);
    drawGoals(1.3);
    drawWalls(1.3);
    drawStageShapes(1.3);
    const m0 = Physics.makeMallet(0, W * 0.5, L * 0.84), m1 = Physics.makeMallet(1, W * 0.5, L * 0.16);
    drawMallet(m0, 0); drawMallet(m1, 0);
    const p = Physics.newPuck(W * 0.62, L * 0.62);
    drawPuck(p);
    if (Stage.dark) {                                         // 暗闇：マレットの周りだけ明るい
      g.save();
      tablePath(g); g.clip();
      g.fillStyle = 'rgba(1,2,8,.85)';
      g.beginPath(); g.rect(0, 0, W, L);
      for (const m of [m0, m1]) { g.moveTo(m.x + m.r * 2.6, m.y); g.arc(m.x, m.y, m.r * 2.6, 0, TAU, true); }
      g.fill();
      g.restore();
      drawMallet(m0, 0); drawMallet(m1, 0);
    }
  });
}

// ===== 49_marks.js =====
'use strict';
/* =====================================================================
   必殺技のマーク（文字の代わりに使う記号）
   ゲージの三角形・発動の演出・試合前の紹介・選択画面で、同じマークを使う
     剛速球＝炎の尾を引くパック／カーブ＝曲がる矢印／分身＝3つに分かれる玉／消える球＝点線で消えかけた玉
     稲妻＝稲妻／ミニ球＝内向きの矢印と小さな玉／防壁＝盾／巨大化＝外向きの矢印／衝撃波＝広がる波
     重い腕＝重り／ゴール拡大＝広がるゴール／反転＝入れ替わる矢印
   c：描画先、(x,y)：中心、s：大きさ（直径の目安）、col：色
   ===================================================================== */
function drawSkillMark(c, id, x, y, s, col, opt = {}) {
  const lw = Math.max(1.2, s * 0.085), dark = 'rgba(4,8,24,.55)';
  c.save();
  c.translate(x, y);
  c.lineCap = 'round'; c.lineJoin = 'round';
  const disk = (cx, cy, r, fill = col) => { c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fillStyle = fill; c.fill(); c.lineWidth = lw * 0.6; c.strokeStyle = dark; c.stroke(); };
  if (opt.glow) {                                              // 満タンなどで光らせる
    const g = c.createRadialGradient(0, 0, 0, 0, 0, s * 0.75);
    g.addColorStop(0, rgba(col, 0.55 * opt.glow)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, s * 0.75, 0, TAU); c.fill();
  }
  switch (id) {
    case 'fast': {                                             // 炎の尾を引くパック
      const r = s * 0.2, px = s * 0.2;
      c.beginPath();
      c.moveTo(-s * 0.5, -s * 0.02);
      c.quadraticCurveTo(-s * 0.1, -r * 1.25, px, -r);
      c.arc(px, 0, r, -Math.PI / 2, Math.PI / 2);
      c.quadraticCurveTo(-s * 0.1, r * 1.25, -s * 0.5, s * 0.02);
      c.closePath();
      c.fillStyle = col; c.fill(); c.lineWidth = lw * 0.6; c.strokeStyle = dark; c.stroke();
      c.strokeStyle = rgba('#ffffff', 0.85); c.lineWidth = lw * 0.7;
      c.beginPath(); c.moveTo(-s * 0.42, -s * 0.3); c.lineTo(-s * 0.12, -s * 0.3); c.moveTo(-s * 0.36, s * 0.3); c.lineTo(-s * 0.08, s * 0.3); c.stroke();
      disk(px, 0, r * 0.62, col === '#fffdf2' ? '#ffd23f' : '#ffffff');
      break;
    }
    case 'curve': {                                            // 曲がる矢印
      c.strokeStyle = col; c.lineWidth = lw * 1.5;
      c.beginPath(); c.moveTo(-s * 0.3, s * 0.38); c.quadraticCurveTo(s * 0.55, s * 0.2, s * 0.05, -s * 0.3); c.stroke();
      c.fillStyle = col;
      c.save(); c.translate(s * 0.05, -s * 0.3); c.rotate(-2.3);
      c.beginPath(); c.moveTo(s * 0.2, 0); c.lineTo(-s * 0.06, -s * 0.15); c.lineTo(-s * 0.06, s * 0.15); c.closePath(); c.fill();
      c.restore();
      disk(-s * 0.3, s * 0.38, s * 0.12, '#ffffff');
      break;
    }
    case 'split': {                                            // 3つに分かれる玉（本物は1つ）
      c.strokeStyle = rgba(col, 0.8); c.lineWidth = lw * 0.6;
      c.beginPath();
      for (const a of [-0.55, 0, 0.55]) { c.moveTo(0, s * 0.4); c.lineTo(Math.sin(a) * s * 0.5, s * 0.4 - Math.cos(a) * s * 0.62); }
      c.stroke();
      for (const a of [-0.55, 0.55]) {                       // 左右は半透明の偽物
        const cx = Math.sin(a) * s * 0.5, cy = s * 0.4 - Math.cos(a) * s * 0.62;
        c.beginPath(); c.arc(cx, cy, s * 0.15, 0, TAU); c.fillStyle = rgba(col, 0.4); c.fill();
        c.strokeStyle = col; c.lineWidth = lw * 0.7; c.stroke();
      }
      disk(0, s * 0.4 - s * 0.62, s * 0.17, col);
      break;
    }
    case 'vanish': {                                           // 点線になって消えかけた玉
      c.beginPath(); c.arc(-s * 0.08, 0, s * 0.3, Math.PI * 0.5, Math.PI * 1.5); c.closePath();
      c.fillStyle = col; c.fill(); c.lineWidth = lw * 0.6; c.strokeStyle = dark; c.stroke();
      c.setLineDash([lw * 0.9, lw * 1.1]); c.strokeStyle = col; c.lineWidth = lw;
      c.beginPath(); c.arc(-s * 0.08, 0, s * 0.3, -Math.PI * 0.5, Math.PI * 0.5); c.stroke(); c.setLineDash([]);
      c.fillStyle = col;
      for (const [dx, dy, r] of [[0.36, -0.14, 0.05], [0.44, 0.08, 0.04], [0.33, 0.22, 0.03]]) { c.beginPath(); c.arc(dx * s, dy * s, r * s, 0, TAU); c.fill(); }
      break;
    }
    case 'wall': {                                             // 盾
      const w = s * 0.42, h = s * 0.5;
      c.beginPath();
      c.moveTo(0, -h); c.quadraticCurveTo(w * 0.6, -h * 0.75, w, -h * 0.8);
      c.lineTo(w, -h * 0.05); c.quadraticCurveTo(w * 0.9, h * 0.6, 0, h);
      c.quadraticCurveTo(-w * 0.9, h * 0.6, -w, -h * 0.05); c.lineTo(-w, -h * 0.8);
      c.quadraticCurveTo(-w * 0.6, -h * 0.75, 0, -h); c.closePath();
      c.fillStyle = col; c.fill(); c.lineWidth = lw * 0.6; c.strokeStyle = dark; c.stroke();
      c.fillStyle = 'rgba(4,8,24,.45)';                       // 横に伸びる壁（白で描いたときも見えるよう濃い色）
      c.fillRect(-w * 0.62, -h * 0.2, w * 1.24, h * 0.3);
      break;
    }
    case 'zigzag': {                                           // 稲妻
      c.beginPath();
      c.moveTo(s * 0.12, -s * 0.5); c.lineTo(-s * 0.26, s * 0.06); c.lineTo(-s * 0.02, s * 0.06);
      c.lineTo(-s * 0.14, s * 0.5); c.lineTo(s * 0.28, -s * 0.08); c.lineTo(s * 0.04, -s * 0.08); c.closePath();
      c.fillStyle = col; c.fill(); c.lineWidth = lw * 0.6; c.strokeStyle = dark; c.stroke();
      break;
    }
    case 'mini': {                                             // 小さくなる玉（内向きの矢印）
      c.strokeStyle = rgba(col, 0.55); c.lineWidth = lw * 0.6; c.setLineDash([lw, lw * 0.9]);
      c.beginPath(); c.arc(0, 0, s * 0.42, 0, TAU); c.stroke(); c.setLineDash([]);
      c.strokeStyle = col; c.lineWidth = lw;
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4, ox = Math.cos(a), oy = Math.sin(a);
        c.beginPath(); c.moveTo(ox * s * 0.4, oy * s * 0.4); c.lineTo(ox * s * 0.22, oy * s * 0.22);
        c.moveTo(ox * s * 0.22 + oy * s * 0.07, oy * s * 0.22 - ox * s * 0.07); c.lineTo(ox * s * 0.22, oy * s * 0.22); c.lineTo(ox * s * 0.22 - oy * s * 0.07, oy * s * 0.22 + ox * s * 0.07);
        c.stroke();
      }
      disk(0, 0, s * 0.13, '#ffffff');
      break;
    }
    case 'giant': {                                            // 大きくなるマレット（外向きの矢印）
      disk(0, 0, s * 0.24, col);
      disk(0, 0, s * 0.1, '#ffffff');
      c.strokeStyle = col; c.lineWidth = lw;
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4, ox = Math.cos(a), oy = Math.sin(a), e = s * 0.48;
        c.beginPath(); c.moveTo(ox * s * 0.31, oy * s * 0.31); c.lineTo(ox * e, oy * e);
        c.moveTo(ox * e - ox * s * 0.1 + oy * s * 0.07, oy * e - oy * s * 0.1 - ox * s * 0.07); c.lineTo(ox * e, oy * e); c.lineTo(ox * e - ox * s * 0.1 - oy * s * 0.07, oy * e - oy * s * 0.1 + ox * s * 0.07);
        c.stroke();
      }
      break;
    }
    case 'shock': {                                            // 衝撃波（はじける輪と光の筋）
      c.strokeStyle = col; c.lineWidth = lw * 1.3;
      c.beginPath(); c.arc(0, 0, s * 0.22, 0, TAU); c.stroke();
      c.lineWidth = lw * 0.9;
      for (let i = 0; i < 8; i++) {
        const a = i * TAU / 8 + Math.PI / 8, r0 = s * 0.32, r1 = s * (i % 2 ? 0.44 : 0.5);
        c.beginPath(); c.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); c.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); c.stroke();
      }
      disk(0, 0, s * 0.1, col);
      break;
    }
    case 'widegoal': {                                         // 広がるゴール（枠と外向きの矢印）
      c.strokeStyle = col; c.lineWidth = lw * 1.3;
      c.beginPath(); c.moveTo(-s * 0.2, -s * 0.05); c.lineTo(-s * 0.2, s * 0.3); c.lineTo(s * 0.2, s * 0.3); c.lineTo(s * 0.2, -s * 0.05); c.stroke();
      c.fillStyle = rgba(col, 0.35); c.fillRect(-s * 0.2, s * 0.02, s * 0.4, s * 0.28);
      c.lineWidth = lw;
      for (const d of [-1, 1]) {
        c.beginPath(); c.moveTo(d * s * 0.08, -s * 0.28); c.lineTo(d * s * 0.46, -s * 0.28);
        c.moveTo(d * s * 0.36, -s * 0.38); c.lineTo(d * s * 0.46, -s * 0.28); c.lineTo(d * s * 0.36, -s * 0.18); c.stroke();
      }
      break;
    }
    case 'mirror': {                                           // 左右が入れ替わる矢印
      c.strokeStyle = col; c.fillStyle = col; c.lineWidth = lw * 1.2;
      const arrow = (y, d) => {
        c.beginPath(); c.moveTo(-d * s * 0.36, y); c.lineTo(d * s * 0.22, y); c.stroke();
        c.beginPath(); c.moveTo(d * s * 0.42, y); c.lineTo(d * s * 0.18, y - s * 0.13); c.lineTo(d * s * 0.18, y + s * 0.13); c.closePath(); c.fill();
      };
      arrow(-s * 0.16, 1); arrow(s * 0.16, -1);
      break;
    }
    case 'heavy': {                                            // 重り
      c.strokeStyle = col; c.lineWidth = lw * 1.3;
      c.beginPath(); c.arc(0, -s * 0.22, s * 0.16, Math.PI * 1.05, Math.PI * 1.95); c.stroke();
      c.beginPath();
      c.moveTo(-s * 0.24, -s * 0.18); c.lineTo(s * 0.24, -s * 0.18); c.lineTo(s * 0.4, s * 0.4); c.lineTo(-s * 0.4, s * 0.4); c.closePath();
      c.fillStyle = col; c.fill(); c.lineWidth = lw * 0.6; c.strokeStyle = dark; c.stroke();
      c.fillStyle = 'rgba(4,8,24,.4)';
      c.beginPath(); c.moveTo(-s * 0.14, s * 0.06); c.lineTo(s * 0.14, s * 0.06); c.lineTo(s * 0.18, s * 0.2); c.lineTo(-s * 0.18, s * 0.2); c.closePath(); c.fill();
      break;
    }
  }
  c.restore();
}

// ===== 50_ui.js =====
'use strict';
/* =====================================================================
   画面の流れ（タイトル → 必殺技 → ステージ → 試合 → 結果）
   ボタンは data-act で、Acts の同じ名前の関数を呼ぶ
   ===================================================================== */
const Sel = {
  skill: SKILLS.some(s => s.id === store.get('skill')) ? store.get('skill') : 'fast',
  stage: STAGE_META.some(s => s.id === store.get('stage')) ? store.get('stage') : 'pillars',
};
const Acts = {};

const UI = {
  screen: null,
  flow: 'cpu',              // 'cpu' か 'online'
  icons: [],                // 必殺技のアイコン（動かす）
  confetti: [],

  show(name) {
    for (const s of $$('.screen')) s.classList.remove('show');
    const ae = document.activeElement;                      // 入力欄に文字を打つ画面から離れたら、入力欄から外す（長押しで「ペースト」が出ないように）
    if (ae && ae.tagName === 'INPUT' && name !== 'lobby') ae.blur();
    this.screen = name;
    if (name === 'title' && !Attract.on && Game.state !== 'match') Attract.start();   // タイトルの背景は、いつも動いているように
    if (name) {
      const s = $('#s-' + name);
      void s.offsetWidth;                                   // 出てくる動きを毎回やり直す
      s.classList.add('show');
    }
    $('#pause-btn').classList.toggle('hidden', !!name || Game.state !== 'match');
  },
  hideAll() { this.show(null); },
  /* もし拡大されてしまったら、元の大きさに戻す（ビューポートの指定を書き直すと戻る） */
  unzoomWatch() {
    const vv = window.visualViewport, meta = document.querySelector('meta[name=viewport]');
    if (!vv || !meta) return;
    const base = meta.getAttribute('content');
    let busy = false;
    vv.addEventListener('resize', () => {
      if (busy || vv.scale <= 1.01) return;
      busy = true;
      meta.setAttribute('content', base.replace('maximum-scale=1', 'maximum-scale=1.01'));
      setTimeout(() => { meta.setAttribute('content', base); busy = false; }, 60);
    });
  },

  /* ---- 必殺技の一覧 ---- */
  buildSkillList() {
    const box = $('#skill-list');
    box.innerHTML = '';
    this.icons = [];
    SKILLS.forEach((sk, i) => {
      const ty = SKILL_TYPE[sk.type];
      const c = el('button', 'card');
      c.style.setProperty('--c', ty.color);
      c.style.animationDelay = (i * 0.05) + 's';
      const cv = el('canvas', 'ic');
      cv.width = cv.height = 128;
      const b = el('span', 'badge', ty.label);
      b.style.background = ty.color;
      c.append(cv, el('span', 'nm', sk.name), b, el('span', 'ds', sk.desc));
      c.addEventListener('click', () => { Sel.skill = sk.id; store.set('skill', sk.id); Sound.ui(); this.markSkill(); });
      c.dataset.id = sk.id;
      box.appendChild(c);
      this.icons.push({ g: cv.getContext('2d'), id: sk.id });
    });
    this.markSkill();
  },
  markSkill() { for (const c of $$('#skill-list .card')) c.classList.toggle('sel', c.dataset.id === Sel.skill); },
  /* 選択画面のマーク（試合中と同じマーク）。選んでいる技は光って脈打つ */
  drawIcons(t) {
    for (const ic of this.icons) {
      const sk = SKILLS.find(s => s.id === ic.id), sel = Sel.skill === ic.id;
      ic.g.setTransform(2, 0, 0, 2, 0, 0);
      ic.g.clearRect(0, 0, 64, 64);
      const k = sel ? 1 + 0.06 * Math.sin(t * 6) : 1;
      drawSkillMark(ic.g, ic.id, 32, 32, 44 * k, SKILL_TYPE[sk.type].color, { glow: sel ? 0.7 + 0.3 * Math.sin(t * 6) : 0.25 });
    }
  },

  /* ---- ステージの一覧（見本の絵つき） ---- */
  buildStageList() {
    const box = $('#stage-list');
    box.innerHTML = '';
    STAGE_META.forEach((st, i) => {
      const c = el('button', 'card stage');
      c.style.setProperty('--c', st.id === 'dark' ? '#9d7bff' : COLORS.ui);
      c.style.animationDelay = (i * 0.04) + 's';
      const cv = el('canvas');
      cv.style.width = '76px'; cv.style.height = '120px';
      c.append(cv, el('span', 'nm', st.name), el('span', 'ds', st.desc));
      c.dataset.id = st.id;
      c.addEventListener('click', () => { Sel.stage = st.id; store.set('stage', st.id); Sound.ui(); this.markStage(); });
      box.appendChild(c);
      renderStagePreview(cv, st.id);
    });
    this.markStage();
  },
  markStage() { for (const c of $$('#stage-list .card')) c.classList.toggle('sel', c.dataset.id === Sel.stage); },

  /* ---- 結果 ---- */
  showResult(win, mine, theirs) {
    const t = $('#result-title');
    t.textContent = win ? '勝ち！' : '負け…';
    t.className = 'result-title ' + (win ? 'win' : 'lose');
    $('#result-score').innerHTML = `<span class="me">${mine}</span> - <span class="opp">${theirs}</span>`;
    const opp = SKILLS.find(s => s.id === Match.skill[1 - Match.me]), stg = STAGE_META.find(s => s.id === Match.stageId);
    $('#result-note').textContent = `相手の技：${opp ? opp.name : ''} ／ ステージ：${stg ? stg.name : ''}`;
    $('#btn-rematch').disabled = false;
    $('#btn-rematch').textContent = 'もう一度';
    this.show('result');
    if (win) this.burstConfetti();
  },
  message(title, text) {
    $('#msg-title').textContent = title;
    $('#msg-text').textContent = text;
    this.show('msg');
  },
  wait(text) {
    $('#wait-text').textContent = text;
    this.show('wait');
  },

  /* ---- 勝ったときの紙吹雪（画面の座標） ---- */
  burstConfetti() {
    const cols = [COLORS.ready, COLORS.me, COLORS.opp, '#ffffff', SKILL_TYPE.defense.color, SKILL_TYPE.disrupt.color];
    for (let i = 0; i < 140; i++) {
      this.confetti.push({ x: Layout.vw * rand(0.1, 0.9), y: -rand(10, Layout.vh * 0.6), vx: rand(-60, 60), vy: rand(80, 220),
                           r: rand(0, TAU), vr: rand(-8, 8), w: rand(6, 11), h: rand(3, 6), c: pick(cols), sw: rand(0, TAU) });
    }
  },
  drawConfetti(dt) {
    if (!this.confetti.length) return;
    screenTransform(false);
    for (const p of this.confetti) {
      p.sw += dt * 5; p.x += (p.vx + Math.sin(p.sw) * 40) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(Math.cos(p.sw), 1);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    this.confetti = this.confetti.filter(p => p.y < Layout.vh + 30);
  },

  /* 一時停止ボタンを、台の左上の角に置く */
  placePause() {
    const b = $('#pause-btn'), p = Layout.toScreen(Layout.flip ? Layout.W : 0, Layout.flip ? Layout.L : 0);
    b.style.left = Math.max(4, p.x + 4) + 'px';
    b.style.top = Math.max(4, p.y + 4) + 'px';
  },

  init() {
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;
      const f = Acts[b.dataset.act];
      if (f) { Sound.unlock(); Sound.ui(); f(b); }
    });
    // ページのスクロール・拡大縮小・長押しメニュー・文字選択を止める（一覧のスクロールと入力欄は除く）
    // iPhone はビューポートの「拡大しない」指定を無視するので、2本指の動きとジェスチャーそのものを止める
    const allow = e => e.target.closest && (e.target.closest('.scroll') || e.target.closest('input'));
    const stop = e => { if (e.cancelable) e.preventDefault(); };
    document.addEventListener('touchstart', e => { if (e.touches.length > 1) stop(e); }, { passive: false });   // 2本目の指：つまんで拡大を始めさせない（試合の操作はポインターで受けるので止まらない）
    document.addEventListener('touchmove', e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1) || !allow(e)) stop(e); }, { passive: false });
    for (const g of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(g, stop, { passive: false });
    document.addEventListener('dblclick', stop, { passive: false });
    window.addEventListener('wheel', e => { if (e.ctrlKey) stop(e); }, { passive: false });        // パソコン：Ctrl＋ホイール
    document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', ';'].includes(e.key)) stop(e); });
    canvas.addEventListener('touchstart', stop, { passive: false });   // 台の上の長押しで、文字選択やメニュー（ペースト）を出さない
    this.unzoomWatch();
    document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });
    document.addEventListener('selectstart', e => { if (!allow(e)) e.preventDefault(); });
    let lastTap = 0;
    document.addEventListener('touchend', e => {           // ダブルタップでの拡大を止める（ボタンと入力欄は除く。押したことが消えないように）
      const now = Date.now();
      const tappable = e.target.closest && e.target.closest('button, [data-act], input, .card');
      if (now - lastTap < 320 && !allow(e) && !tappable && e.cancelable) e.preventDefault();
      lastTap = now;
    }, { passive: false });
    $('#pause-btn').addEventListener('click', () => Acts.pause());
    $('#btn-share').classList.toggle('hidden', !navigator.share);
    const code = $('#code-in');
    code.addEventListener('paste', e => {                  // 貼り付けは、部屋コードか招待リンクのときだけ受け付ける（関係ない文字が入らないように）
      const t = (e.clipboardData && e.clipboardData.getData('text')) || '';
      const m = t.match(/[?&]room=([^&#\s]+)/), c = normCode(m ? m[1] : t);
      e.preventDefault();
      if (c.length === NET.CODE_LEN && (m || t.trim().length <= NET.CODE_LEN + 4)) code.value = c;
    });
    const tidy = () => { const v = normCode(code.value); if (v !== code.value) code.value = v; };
    code.addEventListener('input', e => { if (!e.isComposing) tidy(); });   // 日本語入力の変換中はさわらない
    code.addEventListener('compositionend', tidy);
    $('#code-in').addEventListener('keydown', e => { if (e.key === 'Enter') Acts.joinRoom(); });
    this.updateSoundBtn();
    this.buildSkillList();
    this.buildStageList();
    Layout.onResize.push(() => this.placePause());
  },
  updateSoundBtn() { $('#btn-sound').textContent = Sound.on ? '音：オン' : '音：オフ'; },
};

/* ---- ボタンの動き ---- */
Acts.cpu = () => { UI.flow = 'cpu'; $('#skill-step').textContent = '1 / 2'; $('#stage-step').textContent = '2 / 2'; $('#s-skill .back').textContent = 'もどる'; UI.markSkill(); UI.show('skill'); };
Acts.online = () => { UI.flow = 'online'; $('#skill-step').textContent = ''; $('#stage-step').textContent = ''; Net.openLobby(); };
Acts.sound = () => { Sound.setOn(!Sound.on); UI.updateSoundBtn(); };
Acts.back = () => {
  if (UI.screen === 'stage') { UI.markSkill(); return UI.show('skill'); }   // ステージ選び → 技選びへ（オンラインのホストも部屋は閉じない）
  if (UI.flow === 'online') return Acts.toTitle();                         // オンラインの技選び：部屋から出る
  UI.show('title');
};
Acts.skillOk = () => {
  if (UI.flow === 'cpu') { UI.markStage(); return UI.show('stage'); }
  Net.chooseSkill(Sel.skill);
};
Acts.stageRandom = () => {
  const ids = STAGE_META.map(s => s.id).filter(id => id !== Sel.stage);
  Sel.stage = pick(ids); store.set('stage', Sel.stage); UI.markStage();
  const c = $(`#stage-list .card[data-id="${Sel.stage}"]`);
  if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
};
Acts.stageOk = () => {
  if (UI.flow === 'cpu') return startCpuMatch();
  Net.chooseStage(Sel.stage);
};
Acts.rematch = () => {
  if (UI.flow === 'cpu') return startCpuMatch();
  Net.requestRematch();
};
Acts.changeSkill = () => {
  if (UI.flow === 'cpu') { Attract.start(); UI.markSkill(); return UI.show('skill'); }
  Net.requestReselect();
};
Acts.toTitle = () => {
  if (UI.flow === 'online') Net.leave();
  if (Match.active) Match.abort();
  UI.flow = 'cpu';
  Attract.start();
  UI.show('title');
};
Acts.pause = () => {
  if (Game.state !== 'match') return;
  if (Match.mode === 'cpu') Match.paused = true;
  $('#pause-note').textContent = Match.mode === 'cpu' ? '' : 'オンライン対戦は止まりません\nやめると相手に知らせます';
  Input.reset();
  UI.show('pause');
};
Acts.resume = () => { Match.paused = false; UI.hideAll(); };
Acts.quit = () => Acts.toTitle();

/* CPU戦を始める（CPUの技は毎回ランダム） */
function startCpuMatch() {
  const cpuSkill = pick(SKILLS).id;
  Match.start({ mode: 'cpu', skills: [Sel.skill, cpuSkill], stage: Sel.stage });
}

// ===== 60_net.js =====
'use strict';
/* =====================================================================
   オンライン対戦（PeerJS / WebRTC でスマホ同士を直接つなぐ）
   - 部屋を作る側（ホスト）が物理を計算する。部屋コードの前に NET.PEER_PREFIX をつけた名前で待つ
   - ゲストは自分のマレットの位置と速さ、必殺技ボタンの入力を送る
   - ホストはパック・両者のマレット・点数・ゲージなどを送り返す
   - 通信は2本：確実に届く「ctl」（開始・技の発動・出来事）と、速さ優先の「st」（毎フレームの状態）
   ===================================================================== */
const Net = {
  peer: null, ctl: null, st: null,
  role: null,               // 'host' / 'guest'
  code: '',
  phase: 'idle',            // idle / lobby / select / match / result
  mySkill: null, theirSkill: null, stage: null,
  rematchMe: false, rematchThem: false,
  lastRecv: 0, sendAcc: 0, pingAcc: 0, outEvents: [], lastInput: 0,
  leaving: false, connTimer: 0, retries: 0, op: 0,

  now() { return performance.now() / 1000; },
  get isHost() { return this.role === 'host'; },

  init() {
    Events.on((type, a) => {                                 // ホスト：出来事をゲストへ送るためにためる
      if (this.role !== 'host' || this.phase !== 'match') return;
      if (type === 'mtouch' || type === 'over') return;          // 試合終了はゲスト側でも出すので送らない
      if (type === 'skill') return;                              // 技を押したことは送らない（構えたことを相手に知らせない）
      this.outEvents.push([type].concat(a.map(v => (typeof v === 'number' ? Math.round(v * 10) / 10 : v))));
    });
  },

  /* PeerJS を読み込む（タグで読めていなければ、別の配信元から読む） */
  loadPeer() {
    if (window.Peer) return Promise.resolve();
    return new Promise((resolve, reject) => {
      let i = 0;
      const next = () => {
        if (window.Peer) return resolve();
        if (i >= NET.PEERJS_URLS.length) return reject(new Error('peerjs'));
        const s = document.createElement('script');
        s.src = NET.PEERJS_URLS[i++]; s.async = true;
        const to = setTimeout(() => { s.onload = s.onerror = null; next(); }, 8000);
        s.onload = () => { clearTimeout(to); window.Peer ? resolve() : next(); };
        s.onerror = () => { clearTimeout(to); next(); };
        document.head.appendChild(s);
      };
      // タグでの読み込みが終わるのを少し待ってから
      let waited = 0;
      const poll = setInterval(() => {
        waited += 200;
        if (window.Peer) { clearInterval(poll); resolve(); }
        else if (waited >= 1500) { clearInterval(poll); next(); }
      }, 200);
    });
  },
  peerOpts() { return Object.assign({ debug: 0, config: { iceServers: NET.ICE_SERVERS } }, NET.PEER_SERVER || {}); },

  /* ---- ロビー ---- */
  openLobby() {
    this.cleanup();
    this.phase = 'lobby';
    $('#lobby-menu').classList.remove('hidden');
    $('#lobby-host').classList.add('hidden');
    this.status('');
    UI.show('lobby');
  },
  status(msg, err) {
    const s = $('#lobby-status');
    s.textContent = msg;
    s.classList.toggle('err', !!err);
  },
  makeCode() {
    let c = '';
    for (let i = 0; i < NET.CODE_LEN; i++) c += NET.CODE_CHARS[(Math.random() * NET.CODE_CHARS.length) | 0];
    return c;
  },
  inviteUrl() { return location.href.split(/[?#]/)[0] + '?room=' + this.code; },

  async createRoom() {
    this.cleanup();
    this.phase = 'lobby';
    this.role = 'host';
    const op = this.op;
    this.status('部屋を作っています…');
    try { await this.loadPeer(); }
    catch (e) { if (op === this.op) this.status('通信の準備ができませんでした\n電波の良い所でもう一度お試しください', true); return; }
    if (op !== this.op || UI.screen !== 'lobby') return;          // 待っている間に「もどる」などを押した
    this.retries = 0;
    this.openHostPeer();
  },
  openHostPeer() {
    this.code = this.makeCode();
    const peer = new Peer(NET.PEER_PREFIX + this.code, this.peerOpts());
    this.peer = peer;
    peer.on('open', () => {
      if (this.peer !== peer) return;
      $('#lobby-menu').classList.add('hidden');
      $('#lobby-host').classList.remove('hidden');
      $('#room-code').textContent = this.code;
      $('#invite-url').textContent = this.inviteUrl();
      this.status('相手が参加するのを待っています…');
    });
    peer.on('connection', conn => this.acceptConn(conn));
    peer.on('error', err => {
      if (this.peer !== peer) return;
      if (err.type === 'unavailable-id' && this.retries++ < 5) { peer.destroy(); return this.openHostPeer(); }
      this.onPeerError(err);
    });
    peer.on('disconnected', () => {                           // 案内役のサーバーから切れた：待っている間はつなぎ直す
      if (this.peer === peer && this.phase === 'lobby' && !peer.destroyed) { try { peer.reconnect(); } catch (e) { /* つなぎ直せなくても続ける */ } }
    });
  },
  acceptConn(conn) {
    if (conn.label === 'st') {                                // 状態用の通信は、いまの相手からのものだけ受ける
      if (this.ctl && conn.peer === this.ctl.peer) { this.st = conn; this.setupConn(conn); }
      else setTimeout(() => { try { conn.close(); } catch (e) { /* もう閉じている */ } }, 400);
      return;
    }
    if (this.ctl && (this.ctl.open || this.phase !== 'lobby')) {   // すでに相手がいる：あいさつが来たら断る
      conn.on('data', d => {
        if (!d || d.t !== 'hello') return;
        try { conn.send({ t: 'full' }); } catch (e) { /* 送れなくても閉じる */ }
        setTimeout(() => { try { conn.close(); } catch (e) { /* もう閉じている */ } }, 400);
      });
      return;
    }
    this.ctl = conn;
    this.setupConn(conn);
    this.status('相手とつないでいます…');
  },

  async joinRoom(code) {
    code = normCode(code);
    if (code.length !== NET.CODE_LEN) return this.status(NET.CODE_LEN + '文字の部屋コードを入力してください', true);
    this.cleanup();
    this.phase = 'lobby';
    this.role = 'guest';
    this.code = code;
    const op = this.op;
    this.status('接続しています…');
    try { await this.loadPeer(); }
    catch (e) { if (op === this.op) this.status('通信の準備ができませんでした\n電波の良い所でもう一度お試しください', true); return; }
    if (op !== this.op || UI.screen !== 'lobby') return;          // 待っている間に「もどる」などを押した
    const peer = new Peer(undefined, this.peerOpts());
    this.peer = peer;
    peer.on('open', () => {
      if (this.peer !== peer) return;
      const id = NET.PEER_PREFIX + code;
      this.ctl = peer.connect(id, { label: 'ctl', reliable: true, serialization: 'json' });
      this.setupConn(this.ctl);
      this.ctl.on('open', () => {
        this.send({ t: 'hello', v: NET.PROTO });
        this.st = peer.connect(id, { label: 'st', reliable: false, serialization: 'json' });
        this.setupConn(this.st);
      });
    });
    peer.on('error', err => { if (this.peer === peer) this.onPeerError(err); });
    clearTimeout(this.connTimer);
    this.connTimer = setTimeout(() => {
      if (this.phase === 'lobby' && this.role === 'guest' && !(this.ctl && this.ctl.open)) {
        this.fail('つながりませんでした\n部屋コードを確かめるか\n同じWi-Fiにする・モバイル回線にするなど\n通信環境を変えてもう一度お試しください');
      }
    }, NET.CONNECT_TIMEOUT * 1000);
  },

  onPeerError(err) {
    const t = err && err.type;
    if (this.phase !== 'lobby') return;                      // つながったあとは、通信が本当に切れたときだけ知らせる
    if (t === 'peer-unavailable') return this.fail('部屋が見つかりませんでした\n部屋コードを確かめてください');
    if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') {
      if (this.phase === 'match' || this.phase === 'result' || this.phase === 'select') return;   // 直接つながっていれば続けられる
      return this.fail('通信サーバーにつながりませんでした\n電波の良い所でもう一度お試しください');
    }
    if (t === 'browser-incompatible') return this.fail('このブラウザはオンライン対戦に対応していません');
    this.fail('つながりませんでした（' + (t || '不明') + '）\nもう一度お試しください');
  },
  fail(msg) {
    const inLobby = this.phase === 'lobby';
    this.cleanup();
    if (inLobby && UI.screen === 'lobby') { this.phase = 'lobby'; $('#lobby-menu').classList.remove('hidden'); $('#lobby-host').classList.add('hidden'); this.status(msg, true); }
    else { if (Match.active) Match.abort(); UI.flow = 'online'; Attract.start(); UI.message('つながりませんでした', msg); }
  },

  setupConn(conn) {
    conn.on('data', d => { try { this.onData(d, conn); } catch (e) { console.error(e); } });
    conn.on('close', () => { if (conn === this.ctl) this.onLost(); });
    conn.on('error', () => { if (conn === this.ctl) this.onLost(); });
  },
  send(o) { if (this.ctl && this.ctl.open) { try { this.ctl.send(o); } catch (e) { /* 次のフレームでまた送る */ } } },
  sendFast(o) {
    const c = this.st && this.st.open ? this.st : this.ctl;
    if (c && c.open) { try { c.send(o); } catch (e) { /* 落ちても次で上書きされる */ } }
  },

  /* ---- 受け取り ---- */
  onData(d) {
    if (!d || typeof d !== 'object') return;
    this.lastRecv = this.now();
    switch (d.t) {
      case 'hello':
        if (!this.isHost) return;
        if (d.v !== NET.PROTO) { this.send({ t: 'bad' }); return; }
        this.send({ t: 'welcome', v: NET.PROTO });
        this.onConnected();
        break;
      case 'welcome': if (!this.isHost) this.onConnected(); break;
      case 'bad': this.fail('相手とゲームの版が違います\n両方でページを読み込み直してください'); break;
      case 'full': this.fail('この部屋はもう対戦中です'); break;
      case 'skill': this.theirSkill = d.id; this.checkStart(); break;
      case 'start':                                           // 技を決めて待っている・再戦を待っているときだけ受ける（選び直しとの行き違い対策）
        if (!this.isHost && ((this.phase === 'select' && this.mySkill) || (this.phase === 'result' && this.rematchMe))) this.startGuest(d);
        break;
      case 'in': if (this.isHost) this.applyInput(d); break;
      case 'press': if (this.isHost && this.phase === 'match') Match.pressSkill(1); break;
      case 's': if (!this.isHost && this.phase === 'match') GuestSync.push(d); break;
      case 'ev': if (!this.isHost) for (const e of d.l) Events.emit(e[0], ...e.slice(1)); break;
      case 'over': if (!this.isHost) GuestSync.finish(d.sc); break;
      case 'rematch': this.rematchThem = true; this.onRematchWish(); break;
      case 'reselect': toast('相手が技とステージを選び直します'); this.goSelect(); break;
      case 'bye': this.onLost(true); break;
      case 'ping': this.send({ t: 'pong' }); break;
    }
  },

  onConnected() {
    clearTimeout(this.connTimer);
    toast('つながりました！');
    Sound.unlock();
    this.goSelect();
  },
  goSelect() {
    this.phase = 'select';
    this.mySkill = null; this.theirSkill = null; this.stage = null;
    this.rematchMe = this.rematchThem = false;
    if (Match.active) Match.abort();
    if (!Attract.on) Attract.start();
    $('#skill-step').textContent = this.isHost ? 'ホスト' : 'ゲスト';
    $('#s-skill .back').textContent = '退出';
    $('#stage-step').textContent = 'ホスト';
    UI.markSkill();
    UI.show('skill');
  },

  /* ---- 選択 ---- */
  chooseSkill(id) {
    this.mySkill = id;
    this.send({ t: 'skill', id });
    if (this.isHost) { UI.markStage(); UI.show('stage'); }
    else UI.wait('ホストがステージを選んでいます…');
  },
  chooseStage(id) {
    if (!this.isHost) return;
    this.stage = id;
    if (!this.checkStart()) UI.wait('相手が必殺技を選んでいます…');
  },
  checkStart() {
    if (!this.isHost || this.phase !== 'select' || !this.mySkill || !this.theirSkill || !this.stage) return false;
    this.startHost();
    return true;
  },
  startHost() {
    const server = Math.random() < 0.5 ? 0 : 1;
    this.phase = 'match';
    this.rematchMe = this.rematchThem = false;
    this.outEvents = [];
    Match.start({ mode: 'host', skills: [this.mySkill, this.theirSkill], stage: this.stage, server });
    this.send({ t: 'start', aspect: Layout.aspect, skills: [this.mySkill, this.theirSkill], stage: this.stage, server });
    this.lastRecv = this.now();
  },
  startGuest(d) {
    this.phase = 'match';
    this.rematchMe = this.rematchThem = false;
    this.stage = d.stage;
    Match.start({ mode: 'guest', skills: d.skills, stage: d.stage, aspect: d.aspect, server: d.server });
    GuestSync.reset();
    this.lastRecv = this.now();
  },

  /* ---- 試合中 ---- */
  applyInput(d) {
    const m = Physics.mallets[1];
    if (!m || this.phase !== 'match') return;
    m.remote = true;
    const c = Table.clampMallet(1, d.x, d.y, m.r);
    if (d.a && !m.active) { m.x = m.px = c.x; m.y = m.py = c.y; m.vx = m.vy = 0; }   // 現れた瞬間は、その場所へ移す（途中を飛んでパックをはじかない）
    m.active = !!d.a;
    m.tx = c.x; m.ty = c.y; m.rvx = d.vx; m.rvy = d.vy;
    this.lastInput = this.now();
  },
  sendPress() { this.send({ t: 'press' }); },

  update(dt) {
    if (!this.role || this.phase === 'idle' || this.phase === 'lobby') return;
    const now = this.now();
    this.pingAcc += dt;
    if (this.pingAcc > 1) { this.pingAcc = 0; this.send({ t: 'ping' }); }
    if (now - this.lastRecv > NET.LOST_TIMEOUT) { this.onLost(); return; }
    if (this.phase !== 'match' || !Match.active) return;
    if (this.isHost) {
      const m = Physics.mallets[1];                           // 届いた速さで、次が届くまで少し先へ進めておく
      if (m && m.remote && now - this.lastInput < 0.12) {
        const c = Table.clampMallet(1, m.tx + m.rvx * dt, m.ty + m.rvy * dt, m.r);
        m.tx = c.x; m.ty = c.y;
      }
    }
    this.sendAcc += dt;
    if (this.sendAcc < 1 / TUNE.NET_SEND_HZ) return;
    this.sendAcc = 0;
    if (this.isHost) {
      if (this.outEvents.length) { this.send({ t: 'ev', l: this.outEvents }); this.outEvents = []; }
      this.sendFast(this.snapshot());
    } else {
      const m = Physics.mallets[Match.me];
      if (m) this.sendFast({ t: 'in', x: r1(m.x), y: r1(m.y), vx: r1(m.vx), vy: r1(m.vy), a: m.active ? 1 : 0 });
    }
  },

  /* ホストの状態をまとめる（数は小数1桁に丸めて軽くする） */
  snapshot() {
    const s = Skills.state, m0 = Physics.mallets[0];
    return {
      t: 's', T: Math.round(this.now() * 1000) / 1000, st: Match.state, tm: Math.round(Match.timer * 100) / 100, it: Match.intro ? 1 : 0, sv: Match.server,
      sc: Match.score, g: [s.armed[0] ? 1 : Match.gauge[0], Match.gauge[1]].map(v => Math.round(v * 100) / 100),   // ホストが構え中なら、ゲストには満タンのまま見せる
      r: Match.rally, sec: Match.second ? 1 : 0,
      sg: Math.round(Stage.t * 1000) / 1000,
      m: [r1(m0.x), r1(m0.y), r1(m0.vx), r1(m0.vy), m0.active ? 1 : 0],
      p: Physics.pucks.map(p => [p.id, r1(p.x), r1(p.y), r1(p.vx), r1(p.vy),
        (p.ghost ? 1 : 0) | (p.vanish ? 2 : 0) | (p.boost > 1 ? 4 : 0) | (p.curve ? 8 : 0) | (p.skill === 'split' ? 16 : 0) |
        (p.zig ? 32 : 0) | (p.r < Table.pr * 0.9 ? 64 : 0),
        Math.round(p.vis * 100) / 100, p.lastHit]),
      k: [/* ホストの構え中の技は送らない */ 0, s.armed[1] || 0, r1(s.wall[0]), r1(s.wall[1]), r1(s.heavy[0]), r1(s.heavy[1]),
          r1(s.giant[0]), r1(s.giant[1]), r1(s.wide[0]), r1(s.wide[1]), r1(s.mirror[0]), r1(s.mirror[1])],
      fz: Skills.freeze > 0 || Match.hitStop > 0 ? 1 : 0,
    };
  },
  onMatchOver() {
    if (this.role !== 'host') return;
    if (this.outEvents.length) { this.send({ t: 'ev', l: this.outEvents }); this.outEvents = []; }
    this.send({ t: 'over', sc: Match.score });
    this.phase = 'result';
  },

  /* ---- 試合のあと ---- */
  requestRematch() {
    this.rematchMe = true;
    this.send({ t: 'rematch' });
    const b = $('#btn-rematch');
    b.disabled = true; b.textContent = '相手を待っています…';
    this.onRematchWish();
  },
  onRematchWish() {
    if (this.phase !== 'result') return;
    if (this.rematchThem && !this.rematchMe) $('#result-note').textContent = '相手が「もう一度」を選びました';
    if (this.rematchMe && this.rematchThem && this.isHost) { this.phase = 'select'; this.startHost(); }
  },
  requestReselect() { this.send({ t: 'reselect' }); this.goSelect(); },

  /* ---- 切断 ---- */
  onLost(bye) {
    if (this.leaving || !this.role || this.phase === 'idle') return;
    if (this.phase === 'lobby' && this.role === 'host' && !(this.ctl && this.ctl.open)) { this.ctl = null; return; }
    const wasMatch = Match.active;
    this.cleanup();
    if (wasMatch) Match.abort();
    UI.flow = 'online';
    Attract.start();
    UI.message('接続が切れました', bye ? '相手が対戦をやめました' : '相手との接続が切れました');
  },
  leave() {
    if (!this.role) return;
    this.leaving = true;
    this.send({ t: 'bye' });
    const peer = this.peer;
    setTimeout(() => { try { if (peer) peer.destroy(); } catch (e) { /* もう閉じている */ } }, 150);
    this.peer = null;
    this.cleanup(true);
    this.leaving = false;
  },
  cleanup(keepPeer) {
    this.op++;                                                // 進行中の接続の操作を無効にする
    clearTimeout(this.connTimer);
    const old = [this.ctl, this.st];
    this.ctl = this.st = null;
    for (const c of old) { try { if (c) c.close(); } catch (e) { /* もう閉じている */ } }
    if (!keepPeer && this.peer) { try { this.peer.destroy(); } catch (e) { /* もう閉じている */ } }
    this.peer = null;
    this.role = null; this.phase = 'idle';
    this.mySkill = this.theirSkill = this.stage = null;
    this.outEvents = [];
  },
};
function r1(v) { return Math.round(v * 10) / 10; }
/* 部屋コードをそろえる：全角→半角、小文字→大文字、英数字以外は消す */
function normCode(s) { return String(s || '').normalize('NFKC').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NET.CODE_LEN); }

Acts.createRoom = () => Net.createRoom();
Acts.joinRoom = () => Net.joinRoom($('#code-in').value);
Acts.copyInvite = () => {
  const url = Net.inviteUrl();
  const done = () => toast('招待リンクをコピーしました');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url, done));
  else fallbackCopy(url, done);
};
Acts.shareInvite = () => {
  if (navigator.share) navigator.share({ title: 'エアホッケーで対戦しよう', text: '部屋コード ' + Net.code, url: Net.inviteUrl() }).catch(() => {});
};
Acts.leaveLobby = () => { Net.cleanup(); UI.flow = 'cpu'; UI.show('title'); };
Acts.leaveOnline = () => Acts.toTitle();

function fallbackCopy(text, done) {
  const ta = el('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;left:-999px;top:0;';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('コピーできませんでした\n長押しでコピーしてください'); }
  ta.remove();
}

// ===== 61_net_sync.js =====
'use strict';
/* =====================================================================
   ゲスト側の表示
   - 自分のマレットは、自分の画面ですぐに動かす
   - 相手のマレットとパックは、届いた状態の間をなめらかに補間して表示する（少しだけ過去を表示する）
   ===================================================================== */
const GuestSync = {
  buf: [],                  // 届いた状態 { T, d }
  offset: null,             // 自分の時計 − ホストの時計（遅れの少ない値を使う）
  samples: [],
  pucks: new Map(),         // パックID → 表示用のパック
  stageT: 0,

  reset() { this.buf = []; this.offset = null; this.samples = []; this.pucks.clear(); this.stageT = 0; },

  push(d) {
    const now = Net.now();
    this.samples.push(now - d.T);
    if (this.samples.length > 90) this.samples.shift();
    this.offset = Math.min(...this.samples);
    if (this.buf.length && d.T <= this.buf[this.buf.length - 1].T) return;   // 古い・順番が入れ替わった状態は捨てる
    this.buf.push({ T: d.T, d });
    if (this.buf.length > 40) this.buf.shift();
    const s = d;                                              // 補間しない値は、最新のものを使う
    if (Match.state === 'goal' && s.st === 'countdown') this.homeMallet();   // 得点後の仕切り直し：消えている自分のマレットは定位置へ
    if (Match.state !== s.st || Math.abs(Match.timer - s.tm) > 0.15) Match.timer = s.tm;
    Match.state = s.st; Match.intro = !!s.it; Match.server = s.sv;
    Match.score = s.sc.slice(); Match.gauge = s.g.slice(); Match.rally = s.r; Match.second = !!s.sec;
    Physics.rally = s.r;
    const k = s.k;
    Skills.state.armed = [k[0] || null, k[1] || null];
    Skills.state.wall = [k[2], k[3]];
    Skills.state.heavy = [k[4], k[5]];
    Skills.state.giant = [k[6] || 0, k[7] || 0];
    Skills.state.wide = [k[8] || 0, k[9] || 0];
    Skills.state.mirror = [k[10] || 0, k[11] || 0];
    Skills.freeze = s.fz ? 0.05 : 0;
    Match.hitStop = s.fz ? 0.05 : 0;
  },

  homeMallet() {
    const m = Physics.mallets[Match.me];
    if (!m || m.active) return;                               // 指で持っているマレットはそのまま
    m.x = m.px = m.tx = Table.W / 2;
    m.y = m.py = m.ty = Match.me === 0 ? Table.L * 0.82 : Table.L * 0.18;
    m.vx = m.vy = m.ivx = m.ivy = 0;
  },

  update(dt) {
    if (!Match.active) return;
    Match.t += dt;
    if (Match.state === 'countdown' || Match.state === 'goal') Match.timer = Math.max(0, Match.timer - dt);
    // 自分のマレット（重い腕もここで反映）
    for (const s of [0, 1]) Skills.state.heavy[s] = Math.max(0, Skills.state.heavy[s] - dt);
    Skills.state.wall = Skills.state.wall.map(v => Math.max(0, v - dt));
    for (const k of ['giant', 'wide', 'mirror']) Skills.state[k] = Skills.state[k].map(v => Math.max(0, v - dt));
    Skills.applyMallets(dt);
    Table.updateGoals(dt);
    Physics.updateMallets(dt, Match.me);
    if (!this.buf.length || this.offset == null) { Stage.set(this.stageT, dt); Table.clampGoal(); Table.buildWalls(); return; }
    const rt = Net.now() - this.offset - NET.INTERP_DELAY;    // 表示するホストの時刻
    let a = this.buf[0], b = this.buf[this.buf.length - 1];
    for (let i = this.buf.length - 1; i > 0; i--) {
      if (this.buf[i - 1].T <= rt) { a = this.buf[i - 1]; b = this.buf[i]; break; }
    }
    let u, extra = 0;
    if (rt >= b.T) { u = 1; a = b; extra = Math.min(rt - b.T, 0.1); }   // 新しいのが届いていない：速さで少し先へ
    else if (rt <= a.T) u = 0;
    else u = (rt - a.T) / (b.T - a.T || 1);
    const A = a.d, B = b.d, L = Table.L;
    // 相手（ホスト）のマレット
    const om = Physics.mallets[1 - Match.me];
    if (om) {
      om.px = om.x; om.py = om.y;
      om.active = !!B.m[4];
      const uu = A.m[4] ? u : 1;                                  // 現れた瞬間は、途中を補間せず現れた場所に出す
      om.x = lerp(A.m[0], B.m[0], uu) + B.m[2] * extra; om.y = lerp(A.m[1], B.m[1], uu) + B.m[3] * extra;
      const c = Table.clampMallet(om.owner, om.x, om.y, om.r); om.x = c.x; om.y = c.y;
      om.vx = B.m[2]; om.vy = B.m[3];
    }
    // パック
    const pa = new Map(A.p.map(q => [q[0], q])), list = [];
    for (const q of B.p) {
      const id = q[0], o = pa.get(id);
      let x = q[1], y = q[2];
      if (o && Math.hypot(q[1] - o[1], q[2] - o[2]) < L * 0.25) { x = lerp(o[1], q[1], u); y = lerp(o[2], q[2], u); }
      x += q[3] * extra; y += q[4] * extra;
      if (extra > 0) { x = clamp(x, Table.pr, Table.W - Table.pr); y = clamp(y, -Table.pr, Table.L + Table.pr); }   // 先読みで壁の外へ出さない
      let p = this.pucks.get(id);
      if (!p) { p = Physics.newPuck(x, y); p.id = id; this.pucks.set(id, p); }
      p.x = x; p.y = y; p.vx = q[3]; p.vy = q[4];
      const f = q[5];
      p.ghost = !!(f & 1); p.vanish = !!(f & 2); p.boost = f & 4 ? SKILL.FAST_BOOST : 1; p.curve = f & 8 ? 1 : 0;
      p.skill = f & 4 ? 'fast' : f & 16 ? 'split' : f & 32 ? 'zigzag' : f & 64 ? 'mini' : null;
      p.zig = f & 32 ? (p.zig || { t: 0, dir: 1 }) : null;
      p.r = f & 64 ? Table.pr * SKILL.MINI_SCALE : Table.pr;
      p.vis = o ? lerp(o[6], q[6], u) : q[6];
      p.lastHit = q[7];
      list.push(p);
    }
    for (const id of this.pucks.keys()) if (!B.p.some(q => q[0] === id)) this.pucks.delete(id);
    Physics.pucks = list;
    // ステージの時刻（動く壁・シャッター・ゴールの幅）
    this.stageT = lerp(A.sg, B.sg, u) + extra;
    Stage.set(this.stageT, dt);
    Table.clampGoal();
    Table.buildWalls();
  },

  finish(score) {
    Match.score = score.slice();
    Net.phase = 'result';
    Match.finish();
  },
};

// ===== 90_main.js =====
'use strict';
/* =====================================================================
   起動とメインループ
   ===================================================================== */
const Game = {
  state: 'menu',            // 'menu'（画面を選んでいる）／'match'（試合中）
  wake: null,

  enterMatch() {
    this.state = 'match';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // 入力欄などから外す（試合中の長押しで「ペースト」が出ないように）
    Attract.on = false;
    UI.confetti = [];
    UI.hideAll();
    UI.placePause();
    $('#pause-btn').classList.remove('hidden');
    this.keepAwake(true);
  },
  exitMatch() {
    this.state = 'menu';
    Layout.locked = false;
    $('#pause-btn').classList.add('hidden');
    Input.reset();
    this.keepAwake(false);
  },
  /* 試合中は画面が消えないようにする（対応している端末だけ） */
  async keepAwake(on) {
    try {
      if (on && navigator.wakeLock && !this.wake) {
        this.wake = await navigator.wakeLock.request('screen');
        this.wake.addEventListener('release', () => { this.wake = null; });   // 画面が隠れると解除されるので、戻ったら取り直す
      }
      if (!on && this.wake) { await this.wake.release(); this.wake = null; }
    } catch (e) { this.wake = null; }
  },
};

Physics.onMalletHit = (p, m, power, nx, ny) => Match.onMalletHit(p, m, power, nx, ny);

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
  lastTime = now;
  if (!window.__hold) tick(dt, now / 1000);                 // __hold は確認用（自動テストで時間を止めて1コマずつ進める）
  requestAnimationFrame(frame);
}
function tick(dt, t) {
  try {
    if (Game.state === 'match') {
      if (Match.mode === 'guest') GuestSync.update(dt); else Match.update(dt);
      Net.update(dt);
      Fx.update(Match.paused ? 0 : dt);
      Slide.update(dt);
      drawMatch(t);
    } else {
      Attract.update(dt);
      Net.update(dt);
      Fx.update(dt);
      Slide.update(dt);
      Attract.draw(t);
      UI.drawConfetti(dt);
      if (UI.screen === 'skill') UI.drawIcons(t);
    }
  } catch (e) {
    console.error(e);
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (Game.state === 'match' && Match.mode === 'cpu' && !Match.paused) Acts.pause(); }
  else { if (Game.state === 'match') Game.keepAwake(true); if (Sound.ac) Sound.unlock(); }
});

/* 起動 */
Layout.init();
Sound.init();
Fx.init();
Net.init();
Input.init();
UI.init();
Attract.start();
UI.show('title');
requestAnimationFrame(frame);

/* 招待リンク（?room=コード）で開かれたら、そのまま参加する */
(() => {
  const code = new URLSearchParams(location.search).get('room');
  if (!code) return;
  try { history.replaceState(null, '', location.href.split(/[?#]/)[0]); } catch (e) { /* 書き換えられなくても参加できる */ }
  UI.flow = 'online';
  Net.openLobby();
  $('#code-in').value = normCode(code);
  Net.joinRoom($('#code-in').value);
})();
