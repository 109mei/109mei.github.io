<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>フローチャートカード ラボ</title><meta name="description" content="高校「情報Ⅰ」のフローチャートカード授業（見る係が伝え、作る係がカードを並べる）を、ひとりで体験したり、研修で模擬授業をしたりできる体験ラボ（試作）"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#172027" media="(prefers-color-scheme: dark)"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2034%2034%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%229%22%20fill%3D%22%2316212c%22/%3E%3Crect%20x%3D%229%22%20y%3D%225%22%20width%3D%2216%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23ffd23f%22/%3E%3Cpath%20d%3D%22M17%2011v3%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M17%2014l6.5%204.5L17%2023l-6.5-4.5z%22%20fill%3D%22%236cc58e%22/%3E%3Cpath%20d%3D%22M17%2023v3%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22/%3E%3Crect%20x%3D%2211%22%20y%3D%2226%22%20width%3D%2212%22%20height%3D%223.5%22%20rx%3D%221.75%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="icon-180.png"><meta property="og:type" content="website"><meta property="og:title" content="フローチャートカード ラボ"><meta property="og:description" content="高校「情報Ⅰ」のフローチャートカード授業（見る係が伝え、作る係がカードを並べる）を、ひとりで体験したり、研修で模擬授業をしたりできる体験ラボ（試作）"><meta property="og:url" content="https://109mei.github.io/flowchart-card-lab/"><meta property="og:image" content="https://109mei.github.io/flowchart-card-lab/og.png"><meta name="twitter:card" content="summary_large_image"><link rel="canonical" href="https://109mei.github.io/flowchart-card-lab/"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="c <style>
/* フローチャートカード 体験ラボ（導入デモ）
   配置：上の帯に4つの入口（体験する・模擬授業・授業の中身・作る人向け）。スマホでは下のタブ。本文は1列で、画面ごとに「いちばん大きいボタン」を1つだけ置く。
   色：方眼紙の地に墨の文字。黄色（--mark）は「いまここ・押すところ」だけに使う（主なボタン・案内の光・実行中のカード・いまの段階）。
       カードの色（青＝キャラの動き、だいだい＝くり返し、緑＝もし、紫＝点数、赤＝ゲームオーバー、金＝クリア）はカードと役割の印だけに使い、画面の飾りには使わない。
   字：BIZ UDPゴシック 1書体。差は大きさと太さでつける。目じるし：動く流れ図（ゲームが動くと、そのカードに黄色い印が流れ線にそって下りていく）。 */
:root {
  --paper: #f1f3ee; --grid: rgba(22,33,44,.045); --surface: #ffffff; --sunk: #e8ece6; --ink: #16212c; --muted: #485461; --line: #d2d8d0; --line2: #b4bdb4;
  --mark: #ffd23f; --mark-ink: #16212c; --mark-soft: #fff3c4; --mark-edge: #b08600;
  --tip-bg: #16212c; --tip-fg: #ffffff; --tip-edge: transparent;
  --ui: #16212c; --ui-ink: #ffffff; --ui-soft: #e3e8ed; --hi: #ffd23f; --focus: #1d6fd8;
  --c-move: #1f5fd1; --c-loop: #c96200; --c-if: #137a3a; --c-score: #6d3fd0; --c-over: #c62828; --c-clear: #9a6a00; --c-start: #5b6676; --c-ref: #57626e;
  --t-move: #e8effc; --t-loop: #fdf0e3; --t-if: #e6f4eb; --t-score: #efe9fb; --t-over: #fbe9e9; --t-clear: #fff3cf; --t-ref: #f1f3f6;
  --ok: #137a3a; --ng: #c62828; --warn: #8a5a00; --star: #e0a800; --flow: #3d4854;
  --board-ink: #111a24; --board-ink2: #1d2a38; --chalk: #f3f6f8; --chalk-dim: #9fb0c0;
  --font: "BIZ UDPGothic", "BIZ UDPゴシック", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --fs-cap: 13px; --fs-s: 14.5px; --fs-b: 16px; --fs-l: 18px; --fs-h3: 19px; --fs-h2: 24px; --fs-h1: 32px; --fs-hero: clamp(34px, 4.6vw, 58px);
  --r: 14px; --r-s: 9px; --wrap: 1180px; --top-h: 64px; --tab-h: 0px;
  --shadow: 0 1px 0 rgba(22,33,44,.05), 0 12px 26px -16px rgba(22,33,44,.35);
  --lift: 0 1px 0 rgba(22,33,44,.06), 0 18px 34px -18px rgba(22,33,44,.45);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1519; --grid: rgba(232,238,242,.035); --surface: #172027; --sunk: #11191f; --ink: #e8edf1; --muted: #a6b2bc; --line: #29343d; --line2: #3a4753;
  --mark: #ffd23f; --mark-ink: #16212c; --mark-soft: #3b3416; --mark-edge: #ffd23f;
  --tip-bg: #26323e; --tip-fg: #f4f7f9; --tip-edge: rgba(255, 210, 63, .55);
  --ui: #e8edf1; --ui-ink: #11191f; --ui-soft: #1f2a33; --hi: #ffd23f; --focus: #8fb4e3;
  --c-move: #7aa7f5; --c-loop: #f0a55a; --c-if: #6cc58e; --c-score: #b79bf2; --c-over: #f08080; --c-clear: #e8c35a; --c-start: #9ba7b6; --c-ref: #9aa7b3;
  --t-move: #1b2a44; --t-loop: #3a2a17; --t-if: #18321f; --t-score: #2a2141; --t-over: #3a1d1d; --t-clear: #3a3115; --t-ref: #1d252d;
  --ok: #6cc58e; --ng: #f08080; --warn: #e2b45a; --flow: #aebac4;
  --board-ink: #0a1016; --board-ink2: #16212c; --chalk: #f3f6f8; --chalk-dim: #9fb0c0;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 26px -16px rgba(0,0,0,.7); --lift: 0 1px 0 rgba(0,0,0,.3), 0 18px 34px -18px rgba(0,0,0,.8); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0f1519; --grid: rgba(232,238,242,.035); --surface: #172027; --sunk: #11191f; --ink: #e8edf1; --muted: #a6b2bc; --line: #29343d; --line2: #3a4753;
  --mark: #ffd23f; --mark-ink: #16212c; --mark-soft: #3b3416; --mark-edge: #ffd23f;
  --tip-bg: #26323e; --tip-fg: #f4f7f9; --tip-edge: rgba(255, 210, 63, .55);
  --ui: #e8edf1; --ui-ink: #11191f; --ui-soft: #1f2a33; --hi: #ffd23f; --focus: #8fb4e3;
  --c-move: #7aa7f5; --c-loop: #f0a55a; --c-if: #6cc58e; --c-score: #b79bf2; --c-over: #f08080; --c-clear: #e8c35a; --c-start: #9ba7b6; --c-ref: #9aa7b3;
  --t-move: #1b2a44; --t-loop: #3a2a17; --t-if: #18321f; --t-score: #2a2141; --t-over: #3a1d1d; --t-clear: #3a3115; --t-ref: #1d252d;
  --ok: #6cc58e; --ng: #f08080; --warn: #e2b45a; --flow: #aebac4;
  --board-ink: #0a1016; --board-ink2: #16212c; --chalk: #f3f6f8; --chalk-dim: #9fb0c0;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 26px -16px rgba(0,0,0,.7); --lift: 0 1px 0 rgba(0,0,0,.3), 0 18px 34px -18px rgba(0,0,0,.8); color-scheme: dark; }

html { height: 100%; scroll-padding-top: calc(var(--top-h) + 12px + env(safe-area-inset-top, 0px)); scroll-padding-bottom: calc(var(--tab-h) + 12px); }
body { min-height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: var(--fs-b); line-height: 1.75;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px;
  -webkit-font-smoothing: antialiased;
  /* 日本語は文節で折り返す（「ジ／ェム」のような切れ方を防ぐ）。収まらないときだけ途中で折る */
  word-break: auto-phrase; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button, a, label, select, summary { touch-action: manipulation; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
main:focus, main:focus-visible { outline: none; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.4; letter-spacing: .02em; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: var(--fs-s); } .tiny { font-size: var(--fs-cap); }
.num { font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }

/* ---------- 上の帯（スマホでは下にタブ） ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { max-width: var(--wrap); margin: 0 auto; display: flex; align-items: center; gap: 8px 22px; min-height: var(--top-h); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink); }
.brand svg { flex: 0 0 auto; }
.brand b { display: block; font-size: 17px; letter-spacing: .04em; white-space: nowrap; line-height: 1.3; }
.brand small { display: block; font-size: 12px; color: var(--muted); letter-spacing: .02em; white-space: nowrap; line-height: 1.3; }
.nav { display: flex; gap: 4px; align-items: center; }
.nav a { position: relative; display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 10px; color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 700; white-space: nowrap; }
.nav a svg { width: 20px; height: 20px; flex: 0 0 auto; color: var(--muted); }
.nav a:hover { background: var(--sunk); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--surface); }
.nav a[aria-current="page"] svg { color: var(--mark); }
.memo-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.memo-btn:hover { border-color: var(--ink); }
.memo-btn .cnt { background: var(--ink); color: var(--surface); border-radius: 999px; padding: 0 7px; font-size: 12px; min-width: 1.5em; text-align: center; }
.tabbar { display: none; }
@media (max-width: 860px) {
  :root { --tab-h: 62px; --top-h: 54px; }
  .topbar .nav { display: none; }
  .brand small { display: none; }
  .tabbar { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-top: 1px solid var(--line);
    padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); box-shadow: 0 -6px 20px -14px rgba(0,0,0,.35); }
  .tabbar a { display: grid; justify-items: center; gap: 1px; padding: 5px 2px 3px; border-radius: 10px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 700; line-height: 1.3; }
  .tabbar a svg { width: 24px; height: 24px; } .tabbar a span { white-space: nowrap; }
  .tabbar a[aria-current="page"] { color: var(--ink); background: var(--mark-soft); }
  .tabbar a[aria-current="page"] svg { color: var(--ink); }
  body { padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); }
}

@media (max-width: 400px) { .tabbar a { font-size: 10.5px; } }

/* ---------- 本文 ---------- */
main { min-width: 0; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 860px) { main { padding-block: 18px 40px; } }
.view { max-width: var(--wrap); margin: 0 auto; display: grid; gap: 22px; }
.view.wide { max-width: 1480px; }
.view > .seg, .view > .row, .view > .kinds { justify-self: start; }
.vhead { display: grid; gap: 8px; }
.vhead h1 { font-size: var(--fs-h1); }
.vhead p { color: var(--muted); max-width: 64ch; font-size: var(--fs-l); line-height: 1.7; }
.vhead .row { margin-top: 4px; }
@media (max-width: 600px) { .vhead h1 { font-size: 26px; } .vhead p { font-size: 16px; } }
.crumb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--fs-cap); color: var(--muted); }
.crumb a { color: var(--muted); }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.subtabs a { text-decoration: none; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line2); font-weight: 700; font-size: 15px; color: var(--ink); background: var(--surface); }
.subtabs a[aria-current="page"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ---------- 部品 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.panel.flat { box-shadow: none; }
.panel h2 { font-size: var(--fs-h3); margin-bottom: 12px; }
.panel h3 { font-size: 16px; margin-block: 14px 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line2); background: var(--surface); padding: 8px 16px; border-radius: 10px; white-space: nowrap; font-weight: 700; font-size: 15px; line-height: 1.4; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink); }
/* 大きいボタンは文が長くなることがある（「もう1問：ステージ1 おちてくるジェム」など）。狭い画面では折り返して、はみ出さない */
@media (max-width: 600px) { .btn.cta, .btn.big { white-space: normal; max-width: 100%; text-align: center; text-wrap: balance; } }
.cta-t > span { display: inline-block; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.cta { background: var(--mark); color: var(--mark-ink); border: 2px solid var(--mark-ink); box-shadow: 0 4px 0 var(--mark-ink); padding: 12px 22px; font-size: 18px; border-radius: 14px; transform: translateY(0); transition: transform .08s ease, box-shadow .08s ease; }
.btn.cta:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--mark-ink); }
.btn.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--mark-ink); }
:root[data-theme="dark"] .btn.cta { border-color: #000; box-shadow: 0 4px 0 #000; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.cta { border-color: #000; box-shadow: 0 4px 0 #000; } }
.btn.go { background: var(--mark); color: var(--mark-ink); border-color: var(--mark-ink); }
.btn.danger { color: var(--ng); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 5px 11px; font-size: 14px; border-radius: 9px; }
.btn.big { padding: 12px 20px; font-size: 17px; border-radius: 12px; }
.btn[disabled] { opacity: .42; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.chip { border: 1.5px solid var(--line2); background: var(--surface); padding: 5px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; font-weight: 700; }
.tag.move { color: var(--c-move); border-color: var(--c-move); } .tag.loop { color: var(--c-loop); border-color: var(--c-loop); }
.tag.if { color: var(--c-if); border-color: var(--c-if); } .tag.score { color: var(--c-score); border-color: var(--c-score); }
.tag.over { color: var(--c-over); border-color: var(--c-over); } .tag.clear { color: var(--c-clear); border-color: var(--c-clear); }
.tag.solid { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tag.mark { background: var(--mark); color: var(--mark-ink); border-color: var(--mark-ink); }
select, input[type="text"], input[type="number"], textarea { border: 1.5px solid var(--line2); background: var(--surface); border-radius: 9px; padding: 7px 10px; max-width: 100%; box-sizing: border-box; }
textarea { width: 100%; min-height: 84px; resize: vertical; line-height: 1.6; }
label.f { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
label.f > span { font-weight: 700; color: var(--ink); }
label.f input, label.f textarea, label.f select { color: var(--ink); }
.seg { display: inline-flex; border: 1.5px solid var(--line2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 15px; font-size: 15px; font-weight: 700; border-right: 1.5px solid var(--line2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button[disabled] { opacity: .4; cursor: not-allowed; }
.note-role { border: 1.5px dashed var(--line2); border-radius: 10px; padding: 9px 13px; font-size: 14.5px; color: var(--ink); background: var(--sunk); }
.hidden-answer { border: 1.5px dashed var(--line2); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); font-size: 14.5px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + var(--tab-h) + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 12px; z-index: 60; font-size: 15px; font-weight: 700; box-shadow: var(--lift); max-width: calc(100vw - 40px); pointer-events: none; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
.split.make { grid-template-columns: minmax(0, .7fr) minmax(0, 1.3fr); }
@media (max-width: 1100px) { .split.make { grid-template-columns: 1fr; } }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 700; white-space: nowrap; }
td.ok { color: var(--ok); font-weight: 700; } td.ng { color: var(--ng); font-weight: 700; }
pre.code { background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-size: 14px; line-height: 1.65; margin: 0; font-family: var(--font); white-space: pre; }
details.fold { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.fold > summary { cursor: pointer; padding: 11px 15px; font-weight: 700; font-size: 16px; }
details.fold > div { padding: 4px 15px 15px; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 700; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--muted); }
.kicker i { width: 10px; height: 10px; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 2px var(--mark-ink); font-style: normal; }
.prose { display: grid; gap: 10px; max-width: 64ch; }
.prose p { line-height: 1.85; }
.stack { display: grid; gap: 12px; }
#h-board, #pl-board, #r-board, .boardbox { width: 100%; display: grid; justify-items: center; }

/* ---------- 問題集 ---------- */
.lib { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }
@media (max-width: 1150px) { .lib { grid-template-columns: 1fr; } }
.ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; align-content: start; }

/* ---------- ゲームの盤 ---------- */

/* ---------- 組む・ためす ---------- */

.palette { display: grid; gap: 6px; }
@media (max-width: 760px) { .palette { grid-auto-flow: column; grid-template-rows: repeat(2, auto); grid-auto-columns: minmax(190px, 62%); overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; padding-bottom: 6px; } .palette .pal { scroll-snap-align: start; } .palette .grp { display: none; } }
.palette .grp { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 6px; }
.pal { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 5px 6px 4px; background: var(--surface); text-align: left; cursor: grab; color: inherit; font: inherit; touch-action: manipulation; }
.pal:hover { border-color: var(--muted); }

.card { display: block; width: 100%; height: auto; }

@media (max-width: 600px) { .sheet { grid-template-columns: 18px minmax(0, 1.8fr) minmax(0, 1fr); gap: 4px 5px; } .lane { padding: 8px 6px 10px; } }

.end-term { justify-self: center; font-size: 12px; border: 2px solid var(--c-start); color: var(--c-start); border-radius: 999px; padding: 1px 16px; position: relative; margin-top: 8px; }
.end-term.on::before { content: ""; position: absolute; left: calc(50% - 1px); bottom: calc(100% + 2px); width: 2px; height: 13px; background: var(--flow); }
.connector { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

/* 紙をまたぐ結合子。丸を本線（いいえの道）のまん中に置き、線を丸までつなぐ */

  .editor:not([hidden]) { position: sticky; bottom: 12px; z-index: 15; background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; box-shadow: var(--lift); }
  .bench .pal-panel { position: sticky; top: calc(var(--top-h) + 14px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - var(--top-h) - 28px); overflow: auto; overscroll-behavior: contain; }
}

  .editor:not([hidden]) { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; max-height: 52vh; overflow: auto; overscroll-behavior: contain; margin: 0; background: var(--surface); border-top: 2px solid var(--ink); border-radius: 14px 14px 0 0;
    padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); box-shadow: 0 -8px 24px rgba(0,0,0,.18); }
  body.ed-open .view { padding-bottom: 52vh; }
}
.editor .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.runner > * { width: 100%; }

<script>
// フローチャートカード ラボ：実行エンジン（v3 試作）
// 2つの時間の進み方
//   card  … カード1枚＝1手（授業 v2.1 と同じ。キー入力なし）
//   frame … 「ずっとくり返す」の1回＝1コマ（遊ぶ版・ゲームジャム。キー入力あり）
// 行 = [本線のカード|null, いいえの道のカード|null]
// カード
//   {k:"配置", c, p:"中,上"} {k:"動かす", c, d:"上|下|左|右"} {k:"矢印", c} {k:"隠す", c} {k:"表示", c}
//   {k:"点数"} {k:"終わる", e:"ゲームオーバー|クリア"} {k:"待つ"}
//   {k:"ここから", n} {k:"ずっと"} {k:"ここまで"}
//   {k:"もし", a, b}（同じマス） {k:"もしキー", key:"上|下|左|右|スペース"} {k:"もし場所", c, ps:["中,上",…]} {k:"もし点数", n}
//   {k:"合流"}
// 判定は v2.1 と同じく、手（コマ）ごとの「見えているキャラの位置・点数・終わり」を比べる。
const FCL = (() => {
  const XS = ["左", "中", "右"], YS = ["上", "中", "下"];
  const POS = {}; YS.forEach((y, j) => XS.forEach((x, i) => { POS[`${x},${y}`] = [i, j]; }));
  const POS_NAMES = Object.keys(POS);
  const NAME = {}; for (const k of POS_NAMES) NAME[POS[k].join(",")] = k;
  const DIR = { "上": [0, -1], "下": [0, 1], "左": [-1, 0], "右": [1, 0] };
  const ARROW = { "上": "↑", "下": "↓", "左": "←", "右": "→" };
  const KEYS = ["上", "下", "左", "右", "スペース"];
  const KEYLABEL = { "上": "↑", "下": "↓", "左": "←", "右": "→", "スペース": "スペース" };
  const IFK = new Set(["もし", "もしキー", "もし場所", "もし点数"]);
  const LOOPK = new Set(["ここから", "ずっと"]);
  const ACTK = new Set(["配置", "動かす", "矢印", "隠す", "表示", "点数", "終わる", "待つ"]);
  const CONTROL = new Set([...IFK, ...LOOPK, "ここまで", "合流"]);
  const SHORT = { "ここから": "ここから くり返す", "ずっと": "ずっと くり返す", "ここまで": "ここまでを くり返す", "合流": "ここで道が1つにもどる",
    "もし": "もし", "もしキー": "もし（キー）", "もし場所": "もし（場所）", "もし点数": "もし（点数）" };

  class ParseError extends Error { constructor(msg, row) { super(msg); this.row = row; } }

  // 行 → 木。各ノードに元の位置 at=[行, 列]
  function parse(rows) {
    const root = []; const stack = [root]; const loopOpen = []; let inIf = null;
    rows.forEach((row, idx) => {
      const i = idx + 1; const main = row[0], right = row[1];
      if (inIf === null) {
        if (right) throw new ParseError(`${i}行目：いいえの道（右の列）のカードは、「もし」と「ここで道が1つにもどる」の間にしか置けません`, i);
        if (!main) return;
        const k = main.k;
        if (LOOPK.has(k)) { const node = Object.assign({}, main, { body: [], at: [idx, 0] }); stack[stack.length - 1].push(node); stack.push(node.body); loopOpen.push(i); }
        else if (k === "ここまで") { if (!loopOpen.length) throw new ParseError(`${i}行目：「ここまでを くり返す」の前に「ここから」か「ずっと」がありません`, i); stack.pop(); loopOpen.pop(); }
        else if (IFK.has(k)) { inIf = { card: main, yes: [], no: [], at: [idx, 0] }; }
        else if (k === "合流") throw new ParseError(`${i}行目：「ここで道が1つにもどる」の前に「もし」がありません`, i);
        else stack[stack.length - 1].push(Object.assign({}, main, { at: [idx, 0] }));
      } else {
        if (main && main.k === "合流") {
          if (right) throw new ParseError(`${i}行目：「ここで道が1つにもどる」の行の右の列にはカードを置けません`, i);
          stack[stack.length - 1].push(Object.assign({}, inIf.card, { yes: inIf.yes, no: inIf.no, at: inIf.at }));
          inIf = null; return;
        }
        [[main, 0], [right, 1]].forEach(([card, col]) => {
          if (!card) return;
          if (CONTROL.has(card.k)) throw new ParseError(`${i}行目：「もし」の中には「${SHORT[card.k] || card.k}」は置けません`, i);
          (col === 0 ? inIf.yes : inIf.no).push(Object.assign({}, card, { at: [idx, col] }));
        });
      }
    });
    if (inIf) throw new ParseError("「もし」のあとに「ここで道が1つにもどる」がありません", null);
    if (loopOpen.length) throw new ParseError(`${loopOpen[loopOpen.length - 1]}行目の くり返しに対応する「ここまでを くり返す」がありません`, loopOpen[loopOpen.length - 1]);
    return root;
  }

  const LIMIT = { limit: true };
  const STOP = { stop: true };

  // 実行（ジェネレーター）。コマ（手）ごとに記録を yield し、次のコマのキーを受け取る
  function* runGen(tree, opt = {}) {
    const mode = opt.mode || "card";
    const maxF = opt.maxFrames || (mode === "card" ? 80 : 300);
    const st = { chars: {}, score: 0, hand: 0, log: [], end: null, path: [], visits: [], keys: new Set(), events: [], steps: 0, limited: false, mode };
    const snap = () => Object.keys(st.chars).sort().filter(k => st.chars[k].v).map(k => [k, NAME[st.chars[k].x + "," + st.chars[k].y]]);
    const ghostSnap = () => Object.keys(st.chars).sort().filter(k => !st.chars[k].v).map(k => [k, NAME[st.chars[k].x + "," + st.chars[k].y]]);
    function* frame(at, kind, who, desc) {
      st.hand += 1;
      const e = { hand: st.hand, chars: snap(), ghosts: ghostSnap(), score: st.score, end: st.end, at, kind, who: who || null, desc: desc || "", events: st.events,
        hidden: who ? !!(st.chars[who] && !st.chars[who].v) : false };
      st.log.push(e); st.events = [];
      if (st.hand >= maxF) { st.limited = true; throw LIMIT; }
      const k = yield e;
      st.keys = new Set(k || []);
    }
    function step() { if (++st.steps > 200000) { st.limited = true; throw LIMIT; } }
    function act(n) {
      const ch = n.c !== undefined ? st.chars[n.c] : null;
      switch (n.k) {
        case "配置": { const [x, y] = POS[n.p]; st.chars[n.c] = { x, y, v: true }; st.events.push({ t: "pop", c: n.c }); return `配置 ${n.c} ${n.p}`; }
        case "動かす": {
          if (ch) { const [dx, dy] = DIR[n.d]; if (ch.x + dx >= 0 && ch.x + dx <= 2 && ch.y + dy >= 0 && ch.y + dy <= 2) { ch.x += dx; ch.y += dy; } }
          return `動かす ${n.c} ${ARROW[n.d]}`;
        }
        case "矢印": {
          let d = null; for (const k of ["上", "下", "左", "右"]) if (st.keys.has(k)) d = k;
          if (d && ch) { const [dx, dy] = DIR[d]; if (ch.x + dx >= 0 && ch.x + dx <= 2 && ch.y + dy >= 0 && ch.y + dy <= 2) { ch.x += dx; ch.y += dy; } }
          return `矢印 ${n.c} ${d ? ARROW[d] : "なし"}`;
        }
        case "隠す": if (ch && ch.v) st.events.push({ t: "poof", c: n.c }); if (ch) ch.v = false; return `隠す ${n.c}`;
        case "表示": if (ch && !ch.v) st.events.push({ t: "pop", c: n.c }); if (ch) ch.v = true; return `表示 ${n.c}`;
        case "点数": st.score += 1; st.events.push({ t: "plus" }); return "点数＋1";
        case "終わる": st.end = n.e; st.events.push({ t: n.e }); return `終わる ${n.e}`;
        case "待つ": return "待つ";
      }
      throw new Error("不明なカード " + n.k);
    }
    function cond(n) {
      switch (n.k) {
        case "もし": { const A = st.chars[n.a], B = st.chars[n.b]; return !!(A && B && A.v && B.v && A.x === B.x && A.y === B.y); }
        case "もしキー": return mode === "frame" && st.keys.has(n.key);
        case "もし場所": { const A = st.chars[n.c]; return !!(A && A.v && (n.ps || []).includes(NAME[A.x + "," + A.y])); }
        case "もし点数": return st.score >= (n.n || 0);
      }
      return false;
    }
    function* exe(block) {
      for (const n of block) {
        step();
        st.visits.push({ at: n.at, hand: st.hand });
        if (ACTK.has(n.k)) {
          const desc = act(n);
          if (mode === "card") { yield* frame(n.at, n.k, n.c, desc); if (n.k === "終わる") throw STOP; }
          else if (n.k === "待つ" || n.k === "終わる") { yield* frame(n.at, n.k, n.c, desc); if (n.k === "終わる") throw STOP; }
        } else if (n.k === "ここから") {
          for (let r = 0; r < (n.n || 0); r++) yield* exe(n.body);
        } else if (n.k === "ずっと") {
          if (mode === "frame") yield* frame(n.at, "はじめ", null, "はじめのようす");
          for (;;) { const h = st.hand; yield* exe(n.body); if (mode === "frame") yield* frame(n.at, "コマ", null, "1コマ"); else if (st.hand === h) { st.limited = true; throw LIMIT; } }
        } else if (IFK.has(n.k)) {
          const yes = cond(n);
          st.path.push([st.hand, yes ? "はい" : "いいえ", n.at]);
          yield* exe(yes ? n.yes : n.no);
        } else throw new Error("不明なカード " + n.k);
      }
    }
    try {
      yield* exe(tree);
      if (mode === "frame" && (st.events.length || st.hand === 0)) yield* frame(null, "おわり", null, "おわり");

        { name: "何もしない", inputs: [], frames: 20 },
        { name: "押し続ける", inputs: Array.from({ length: 20 }, () => [S]), frames: 20 },
        { name: "とちゅうでやめる", inputs: [[S], [S], [S], [S], [S], [], []], frames: 20 },
      ],
      demos: ["押し続ける", "とちゅうでやめる"],
    },
  ];

  // 授業 v2.1 の10題（class_v21.json から。映像をまねる）
  const CLASS_RULE = {
    "見本1": [{ kind: "動き", text: "ねこが【中,下】、ボールが【中,上】に出る" }, { kind: "動き", text: "ねこが右・左のステップを3回" }, { kind: "動き", text: "最後にボールが1マス下がる" }],
    "1回目": [{ kind: "動き", text: "ねこが【左,下】に出る" }, { kind: "動き", text: "ボールが【中,上】に出て2マス下がり、隠れる" }, { kind: "動き", text: "そのたびに、ねこが右へ1マス（2回くり返す）" }],
    "2回目": [{ kind: "動き", text: "ねこが【左,上】に出る" }, { kind: "動き", text: "ボールが【右,中】に出て2マス左へ進み、隠れる" }, { kind: "動き", text: "そのたびに、ねこが下へ1マス（2回くり返す）" }],
    "3回目": [{ kind: "動き", text: "ボールが【中,上】から2マス落ちてくる" }, { kind: "点数", text: "ねこと同じマスなら＋1" }, { kind: "ゲームオーバー", text: "受けられなかったら、その場でゲームオーバー" }],
    "4回目": [{ kind: "動き", text: "ボールが【右,中】から2マス左へ進む" }, { kind: "点数", text: "ねこと同じマスなら＋1" }, { kind: "ゲームオーバー", text: "受けられなかったら、その場でゲームオーバー" }],
  };
  // 絵をゲームらしい CC0 素材（Kenney）にしたので、名前も読みかえる（並べ方・動きはそのまま。元の class_v21.json は変えない）
  const RENAME21 = { "ねこ": "ヒーロー", "ボール": "ジェム" };
  // 絵（宝石）に合う言い方にそろえる（転がる → 落ちてくる・飛んでくる）。そのあと名前を読みかえる
  const PHRASE21 = [["ころがるボール", "おちてくるジェム"], ["ボールが1マスころがる", "ジェムが1マス落ちる"], ["ボールが上からころがって", "ジェムが上から落ちてきて"], ["ボールが右からころがって", "ジェムが右から飛んできて"]];
  const rn = s => typeof s === "string" ? PHRASE21.reduce((t, [a, b]) => t.split(a).join(b), s).replace(/ねこ|ボール/g, m => RENAME21[m]) : s;

  function classProblems(list) {
    return list.map(t0 => {
      const t = Object.assign({}, t0, { label: rn(t0.label), story: rn(t0.story), cast: t0.cast.map(rn), rows: rnRows(t0.rows), dummy: t0.dummy ? rnRows(t0.dummy) : null, spare: t0.spare ? rnRows(t0.spare) : null });
      const [stageLabel, name] = t.label.split("　");
      return {
        id: "v21-" + t.id, title: name || t.label, stageLabel, group: "授業", genre: [t.bonus ? "ボーナス" : t.stage ? "ステージ" + t.stage : "見本"], mode: "card", styles: ["映像"],

        cast: t.cast.map(n => ({ name: n, sprite: n })), lead: t.story, concept: t.concept,
        rules: (CLASS_RULE[t.id] || [{ kind: "動き", text: t.story }]).map(r => ({ kind: r.kind, text: rn(r.text) })),
        rows: t.rows, dummy: t.dummy, spare: t.spare, tests: [], demos: [],
      };
    });
  }

  // ------------------------------------------------ 授業の流れ（模擬授業）
  // 1回の進め方（授業案 v2.0 の 8.「1回の進め方（15〜16分）」）。合計15分。16分の回は「伝える・並べる」を8分にする（app4_more.js の stepsOf）
  const STEPS16 = [
    { name: "配る", sec: 30, who: "作る係は後ろを向く。お題の「配るカード」を班に渡す" },
    { name: "見る", sec: 60, who: "映像を2回続けて再生。見る係はメモを取らない" },
    { name: "伝える・並べる", sec: 420, who: "見る係が言葉で伝え、作る係が書いて並べる。3分で映像の3回目" },
    { name: "入力・実行・直す", sec: 240, who: "作る係が入力して実行。×なら何手目でずれたかを見る係に伝える" },
    { name: "答え合わせ", sec: 120, who: "多かった誤りを1つ取り上げる。1回目・3回目は並べ方を映さない" },

  const LESSONS = [
    {

      phases: [

        { min: 15, name: "ステージ1 ころがるボール", problem: "v21-1回目", steps: true, students: "作る：ペアX。プレイマットあり", teacher: "巡回して誤りの種類と支援を記録。並べ方は映さない" },
        { min: 15, name: "ステージ2 よこからボール", problem: "v21-2回目", steps: true, students: "作る：ペアY。プレイマットあり", teacher: "1回目の並べ方は伏せて片付けてから始める" },
        { min: 5, name: "まとめ", students: "ステージ1・2の正解の並べ方と Python を並べて見る", teacher: "「ねこの配置は、くり返しの中か外か」を問う" },

    {

      phases: [
        { min: 7, name: "見本2 キャッチのれんしゅう", problem: "v21-見本2", students: "もし・道がもどる・いいえの道（空）を、予想→実行→調べる→変える", teacher: "プレイマットとチップを回収。「通るのはどちらか片方の道だけ」を1手ずつ見せる" },
        { min: 16, name: "ステージ3 ボールキャッチ", problem: "v21-3回目", steps: true, students: "作る：ペアY。プレイマットなし", teacher: "作る係はメモも取らない。並べ方は映さない" },
        { min: 16, name: "ステージ4 よこからキャッチ", problem: "v21-4回目", steps: true, students: "作る：ペアX。プレイマットなし", teacher: "3回目の並べ方は伏せる" },
        { min: 6, name: "まとめ", students: "ステージ3・4の正解を、カード・Python・共通テスト用の書き方で見る", teacher: "いいえの道は else にあたる" },
        { min: 3, name: "ふり返り", students: "ふり返りシート", teacher: "成績には使わない自己評価を含む" },
        { min: 2, name: "片付け", students: "記録の保存", teacher: "アプリの「記録」で CSV を保存" },
      ],
    },
    {
      id: "play-1", title: "遊んで見つける（試案）", source: "試案（まだ試していない）。遊ぶ → 見つける → 組む → テスト の順", minutes: 50,
      phases: [
        { min: 5, name: "はじめ：道わたりを先生が遊ぶ", problem: "道わたり", students: "見る。何が起きたかを口で言う", teacher: "「〜したら〜になる」の言い方を見せる。矢印キーとスペースだけ" },
        { min: 6, name: "遊ぶ：ジャンプでよける", problem: "ジャンプでよける", students: "1人2回まで遊ぶ。ゲームオーバーもクリアも起こしてみる", teacher: "クリアの決まりは教えない" },
        { min: 7, name: "見つけたことを書く", problem: "ジャンプでよける", students: "「〜したら〜になる」を班で5つ書く", teacher: "見つけた数を板書（答えは言わない）" },
        { min: 15, name: "組む", problem: "ジャンプでよける", students: "書いた文を1つずつカードにする。落ちる・跳ぶの順番に注意", teacher: "ずっとくり返す・キーの もし を見せる" },
        { min: 10, name: "テストして直す", problem: "ジャンプでよける", students: "テストの入力（何もしない・ちょうどよく跳ぶ ほか）で判定。×のコマを見て直す", teacher: "ずれたコマを手がかりに問い返す" },

        { min: 3, name: "ふり返り", students: "見つけた決まりのうち、カードにできなかったもの", teacher: "" },
      ],

  ];

  for (const L of LESSONS) for (const ph of L.phases) for (const k of ["name", "students", "teacher"]) ph[k] = rn(ph[k]);
  return { SPRITES, SPRITE_ALIAS, THEMES, CARDS, HOLD, GROUPS, PLAY, classProblems, LESSONS, STEPS16, rename21: rn };

  if (p.id === SANDBOX_ID) return U.sandbox.rows;

  return (U.sheets[key] = U.sheets[key] || []);
}
function setRows(rows) {
  const B = S.build, p = buildProblem();
  while (rows.length && !rows[rows.length - 1][0] && !rows[rows.length - 1][1]) rows.pop();

  return c;

// ---------------------------------------------------------------- 動く流れ図（カードの順にゲームが動き、いま動いたカードに黄色い印が下りていく）
function liveFlow(fig, p, opts = {}) {
  const rows = p.rows;
  fig.innerHTML = `<div class="lf-stage"><div class="hud lf-hud"><span class="stg">${esc(fullTitle(p))}</span><span><b data-lf="h">0</b> 手目</span></div>

    <div class="lf-cards" aria-hidden="true"><span class="lf-mark"></span><div class="lf-term">はじめ</div>${rows.map((r, i) => r[0] ? `<div class="lf-card" data-r="${i}">${cardSVG(r[0], { mode: "card" })}</div>` : "").join("")}<div class="lf-term end">おわり</div></div>
    ${opts.caption ? `<figcaption>${esc(opts.caption)}</figcaption>` : ""}`;
  const board = new Board(p); $(".lf-board", fig).appendChild(board.el);
  // くり返しの範囲：「ここから」から「ここまで」へもどる矢印を、カードの右に引く
  const drawLoops = () => {
    for (const x of $$(".lf-loop", fig)) x.remove();

    for (const c of cs) { const k = (rows[+c.dataset.r] || [])[0]; if (!k) continue;
      if (k.k === "ここから" || k.k === "ずっと") open.push(c);
      else if (k.k === "ここまで" && open.length) { const a = open.pop(); const top = a.offsetTop + a.offsetHeight / 2, bot = c.offsetTop + c.offsetHeight / 2;
        $(".lf-cards", fig).insertAdjacentHTML("beforeend", `<span class="lf-loop" style="top:${top}px;height:${bot - top}px"><i>${k.k === "ここまで" && (rows[+a.dataset.r] || [])[0].n ? (rows[+a.dataset.r][0].n + "回") : ""}</i></span>`); } }
  };
  requestAnimationFrame(drawLoops);
  const st = E.run(E.parse(rows), { mode: "card" });
  const mark = $(".lf-mark", fig), cards = $(".lf-cards", fig), now = $(".lf-now", fig), hand = $('[data-lf="h"]', fig);
  const point = e => {
    for (const c of $$(".lf-card.now", fig)) c.classList.remove("now");
    const c = e && e.at ? $(`.lf-card[data-r="${e.at[0]}"]`, fig) : null;
    if (c) { c.classList.add("now"); mark.style.transform = `translateY(${c.offsetTop - 5}px)`; mark.style.height = (c.offsetHeight + 10) + "px"; mark.style.opacity = "1"; }
    else mark.style.opacity = "0";
    const card = e && e.at ? (rows[e.at[0]] || [])[e.at[1]] : null;
    now.innerHTML = card ? `<span class="small muted">いま動いたカード</span>${cardSVG(card, { mode: "none" })}` : "";
    hand.textContent = e ? e.hand : 0;
  };

    for (let k = 0; k < (opts.loop ? 60 : 1); k++) {
      if (!fig.isConnected) return;
      point(null);

// ---------------------------------------------------------------- 案内の光（押すところを黄色く囲み、吹き出しで言う）
let coachState = null; let coachWait = null;
function coach(target, html, opts = {}) {
  coachClose(); if (!target || !target.isConnected) return;
  // スマホで書く欄（画面の下に出る）が開いているときは、閉じてから案内する（吹き出しが書く欄のボタンをふさがないように）
  const ed = document.getElementById("b-editor");
  if (document.body.classList.contains("ed-open") && ed && !ed.hidden && getComputedStyle(ed).position === "fixed" && !ed.contains(target)) {
    const mo = new MutationObserver(() => { if (!document.body.classList.contains("ed-open")) { mo.disconnect(); coachWait = null; setTimeout(() => { if (target.isConnected && !coachState) coach(target, html, opts); }, 250); } });
    mo.observe(document.body, { attributes: true, attributeFilter: ["class"] }); coachWait = mo; return;
  }
  const ring = document.createElement("div"); ring.className = "coach-ring"; ring.setAttribute("aria-hidden", "true");
  const tip = document.createElement("div"); tip.className = "coach-tip"; tip.setAttribute("role", "status");
  tip.innerHTML = `<div class="ct-step">${esc(opts.step || "案内")}</div><div class="ct-body">${html}</div><div class="row"><button type="button" class="btn small primary" data-c="ok">わかった</button><button type="button" class="btn small ghost" data-c="off">案内をやめる</button></div>`;
  document.body.append(ring, tip);
  // 吹き出しは、上の帯と下のタブのあいだに出す。案内の相手が画面の外へ出たら隠す
  const band = () => { const tb = document.querySelector(".topbar"), tab = document.querySelector(".tabbar"); return { t: (tb ? tb.getBoundingClientRect().bottom : 0) + 8, b: window.innerHeight - (tab && getComputedStyle(tab).display !== "none" ? tab.offsetHeight : 0) - 8 }; };
  const place = () => {
    if (!target.isConnected) { coachClose(); return; }
    const r = target.getBoundingClientRect(); const pad = 6; const vw = document.documentElement.clientWidth; const B = band();
    const off = r.bottom < B.t + 4 || r.top > B.b - 4; ring.hidden = off; tip.hidden = off; if (off) return;
    Object.assign(ring.style, { left: (r.left - pad) + "px", top: (r.top - pad) + "px", width: (r.width + pad * 2) + "px", height: (r.height + pad * 2) + "px" });
    const tw = Math.min(330, vw - 32); tip.style.width = tw + "px";
    const th = tip.offsetHeight; let top = r.bottom + 14; let below = true;
    if (top + th > B.b && r.top - th - 14 > B.t) { top = r.top - th - 14; below = false; }
    top = Math.max(B.t, Math.min(top, B.b - th));
    let left = Math.max(16, Math.min(r.left + r.width / 2 - tw / 2, vw - tw - 16));
    tip.style.left = left + "px"; tip.style.top = top + "px"; tip.dataset.side = below ? "below" : "above";
    tip.style.setProperty("--ax", Math.max(18, Math.min(tw - 18, r.left + r.width / 2 - left)) + "px");
  };
  const onScroll = () => requestAnimationFrame(place);
  window.addEventListener("scroll", onScroll, true); window.addEventListener("resize", onScroll);
  tip.querySelector('[data-c="ok"]').addEventListener("click", () => { coachClose(); opts.onOk && opts.onOk(); });
  tip.querySelector('[data-c="off"]').addEventListener("click", () => { if (S.demo) S.demo.guide = false; coachClose(); toast("案内をやめました。体験の「1. しくみ」から、いつでも案内をつけなおせます。"); });
  if (opts.reveal && opts.reveal.isConnected) { const a = opts.reveal.getBoundingClientRect(), b = target.getBoundingClientRect(); if (a.top < 70 || b.bottom + 170 > window.innerHeight - 90) bringIntoView(opts.reveal, target, true); }
  else { const r0 = target.getBoundingClientRect(); if (r0.top < 70 || r0.bottom > window.innerHeight - 90) target.scrollIntoView({ block: "center", behavior: reduceMotion() ? "auto" : "smooth" }); }
  place(); setTimeout(place, 350);
  // 案内の相手を押したら、吹き出しを閉じる（「実行」を押したあとも盤の上に残らないように）
  const onTarget = () => coachClose(); target.addEventListener("click", onTarget);
  coachState = { ring, tip, onScroll, key: opts.key || "", target, onTarget };
}
// top の上端から bottom の下端までを、上の帯と下のタブのあいだに入れる（入りきらないときは上端をそろえる）
function bringIntoView(top, bottom, alignTop) {
  const tb = document.querySelector(".topbar"); const tH = (tb ? tb.getBoundingClientRect().bottom : 0) + 8;
  const tab = document.querySelector(".tabbar"); const bH = tab && getComputedStyle(tab).display !== "none" ? tab.offsetHeight + 8 : 12;
  const a = top.getBoundingClientRect(), b = (bottom || top).getBoundingClientRect(); const room = window.innerHeight - tH - bH;
  let dy = 0;
  if (b.bottom - a.top <= room && !alignTop) { if (a.top < tH) dy = a.top - tH; else if (b.bottom > window.innerHeight - bH) dy = b.bottom - (window.innerHeight - bH); }
  else dy = a.top - tH;
  if (Math.abs(dy) > 2) window.scrollBy({ top: dy, behavior: reduceMotion() ? "auto" : "smooth" });
}
function coachClose() {
  if (coachWait) { coachWait.disconnect(); coachWait = null; }
  if (!coachState) return;
  window.removeEventListener("scroll", coachState.onScroll, true); window.removeEventListener("resize", coachState.onScroll);
  if (coachState.target) coachState.target.removeEventListener("click", coachState.onTarget);
  coachState.ring.remove(); coachState.tip.remove(); coachState = null;
}

// ヒント：正解の並べ方と、上の行から順にくらべて、最初にちがう所を1つだけ言う
function demoHint(p) {
  const mine = getRows(); const n = Math.max(mine.length, p.rows.length);
  try { if (mine.some(r => r[0] || r[1]) && mine.every(r => r.every(x => !x || !missingOf(x).length)) && E.judge(Object.assign({}, p, { tests: testsOf(p) }), mine).ok)
    return `<p><b>いまの並べ方は、お題と同じ動きです。</b>正解の並べ方と行の位置などがちがっても、同じ動きなら○です。</p>`; } catch (e) { }
  for (let i = 0; i < n; i++) for (const c of [0, 1]) {
    const a = (mine[i] || [])[c] || null, b = (p.rows[i] || [])[c] || null;
    const ta = a ? cardText(a) : "", tb = b ? cardText(b) : "";
    if (ta === tb) continue;
    const where = `${i + 1}行目${c === 1 ? "の いいえの道" : ""}`;
    return `<p><b>${where}</b>は、${b ? `「${esc(tb)}」です。` : "空けておきます。"}${a && b && defOf(a).id === defOf(b).id ? "（カードの種類は合っています。書いた中身を見直しましょう）" : ""}</p>`;
  }
  return `<p>正解と同じ並べ方です。「判定」を押してみましょう。</p>`;
}

// お題とあなたの並べ方を、同じ手ずつ並べて動かす。ずれた手で止めて、2つの盤に印をつける
async function quickRun(ctx, qb) {
  const { m, p, board } = ctx; const comp = compileMine(ctx); clearRun(ctx);
  if (comp.error) { $("#r-result", m).innerHTML = `<div class="result err">${esc(comp.error)}</div>`; return; }
  Sound.unlock();
  const res = E.judge(Object.assign({}, p, { tests: testsOf(p) }), comp.rows); const t = res.tests[0];
  const stM = E.run(comp.tree, { mode: "card" }); const TL = (t.target && t.target.log) || E.run(E.parse(p.rows), { mode: "card" }).log;
  const stopAt = res.ok ? Infinity : t.hand; const token = ++runSeq; const sp = speedOf(p);
  qb.board.clear(); qb.f.textContent = "0"; qb.s.textContent = "0";
  await sleep(Math.min(350, sp)); if (token !== runSeq) return;
  const n = Math.max(stM.log.length, TL.length);
  for (let i = 0; i < n; i++) {
    if (token !== runSeq) return;
    const a = TL[i], e = stM.log[i];
    if (a) { qb.board.paint(a); qb.f.textContent = a.hand; bump(qb.s, a.score); }
    if (e) { board.paint(e); $("#r-f", m).textContent = e.hand; bump($("#r-s", m), e.score); hl(ctx, e.at); showNow(ctx, e, stM); $("#r-desc", m).textContent = `${e.hand}手目：${say(e, p)}${e.at ? `（${e.at[0] + 1}行目）` : ""}`; }
    if (i + 1 >= stopAt) break;
    await sleep(sp);
  }
  if (token !== runSeq) return;
  hl(ctx, null); judgeMine(ctx);
  // お題の盤も、あなたの盤と同じ手の様子にそろえる
  const k = res.ok ? TL.length - 1 : Math.min(TL.length - 1, t.hand - 1);
  if (k >= 0 && TL[k]) { qb.board.paint(TL[k], true); qb.f.textContent = TL[k].hand; qb.s.textContent = TL[k].score || 0; }
  if (!res.ok) { for (const b of [qb.board, board]) b.el.classList.add("diff");
    // ずれた手を動かした行を光らせる（どのカードでちがったかが分かる）
    const e = stM.log[t.hand - 1]; if (e && e.at) { hl(ctx, e.at); $("#r-desc", m).textContent = `${t.hand}手目で動いたのは、光っている ${e.at[0] + 1}行目のカード（${say(e, p)}）です。このカードか、その前のカードを見直そう。`; } }
  const qp = $(`.q-pick[data-q="${CSS.escape(p.id)}"] small`, document); if (res.ok && qp && !qp.querySelector(".ok")) qp.insertAdjacentHTML("beforeend", ' <i class="ok" aria-label="○になった">○</i>');
}
