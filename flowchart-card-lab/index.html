<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>フローチャートカード ラボ</title><meta name="description" content="フローチャートカード教材を、映像をまねる・遊んで見つける の2つのやり方でためし、カードを並べて判定し、役になりきって気づきをメモする作業台（試作）"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#172027" media="(prefers-color-scheme: dark)"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2034%2034%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%2322374f%22/%3E%3Crect%20x%3D%228%22%20y%3D%225%22%20width%3D%2218%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23ffd84d%22/%3E%3Cpath%20d%3D%22M17%2011v3%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M17%2014l7%205-7%205-7-5z%22%20fill%3D%22%236cc58e%22/%3E%3Cpath%20d%3D%22M17%2024v3%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="icon-180.png"><meta property="og:type" content="website"><meta property="og:title" content="フローチャートカード ラボ"><meta property="og:description" content="フローチャートカード教材を、映像をまねる・遊んで見つける の2つのやり方でためし、カードを並べて判定し、役になりきって気づきをメモする作業台（試作）"><meta property="og:url" content="https://109mei.github.io/flowchart-card-lab/"><meta property="og:image" content="https://109mei.github.io/flowchart-card-lab/og.png"><meta name="twitter:card" content="summary_large_image"><link rel="canonical" href="https://109mei.github.io/flowchart-card-lab/"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="フローチャートカード教材を、映像をまねる・遊んで見つける の2つのやり方でためし、役になりきって気づきをメモする実験台">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* フローチャートカード ラボ
   レイアウト：左に道具の棚（ナビ）、上に役と気づきメモ。作業台は「流れ図テンプレート定規」と方眼紙をモチーフにする。
   書体は BIZ UDPゴシック 1書体（印刷物とそろえる）。色は、カードの役割色（青＝キャラの動き、だいだい＝くり返し、緑＝もし、紫＝点数、赤＝ゲームオーバー、金＝クリア）を、そのまま画面の意味の色に使う。 */
:root {
  --paper: #f2f4f1; --grid: rgba(23,33,43,.045); --surface: #ffffff; --sunk: #e9ede8; --ink: #17212b; --muted: #57626e; --line: #d3d9d3; --line2: #bcc4bd;
  --ui: #22384f; --ui-ink: #ffffff; --ui-soft: #e3e9f0; --hi: #ffd84a; --focus: #2f6fd6;
  --c-move: #1f5fd1; --c-loop: #c96200; --c-if: #137a3a; --c-score: #6d3fd0; --c-over: #c62828; --c-clear: #9a6a00; --c-start: #5b6676; --c-ref: #57626e;
  --t-move: #e8effc; --t-loop: #fdf0e3; --t-if: #e6f4eb; --t-score: #efe9fb; --t-over: #fbe9e9; --t-clear: #fff3cf; --t-ref: #f1f3f6;
  --ok: #137a3a; --ng: #c62828; --warn: #8a5a00; --star: #e0a800;
  --font: "BIZ UDPGothic", "BIZ UDPゴシック", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --r: 10px; --shadow: 0 1px 2px rgba(23,33,43,.06), 0 6px 18px rgba(23,33,43,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1418; --grid: rgba(228,234,238,.04); --surface: #172027; --sunk: #121a20; --ink: #e4eaee; --muted: #9aa7b3; --line: #2a3640; --line2: #3a4854;
  --ui: #8fb4e3; --ui-ink: #0d1520; --ui-soft: #1d2a37; --hi: #ffd84a; --focus: #8fb4e3;
  --c-move: #7aa7f5; --c-loop: #f0a55a; --c-if: #6cc58e; --c-score: #b79bf2; --c-over: #f08080; --c-clear: #e8c35a; --c-start: #9ba7b6; --c-ref: #9aa7b3;
  --t-move: #1b2a44; --t-loop: #3a2a17; --t-if: #18321f; --t-score: #2a2141; --t-over: #3a1d1d; --t-clear: #3a3115; --t-ref: #1d252d;
  --ok: #6cc58e; --ng: #f08080; --warn: #e2b45a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0f1418; --grid: rgba(228,234,238,.04); --surface: #172027; --sunk: #121a20; --ink: #e4eaee; --muted: #9aa7b3; --line: #2a3640; --line2: #3a4854;
  --ui: #8fb4e3; --ui-ink: #0d1520; --ui-soft: #1d2a37; --hi: #ffd84a; --focus: #8fb4e3;
  --c-move: #7aa7f5; --c-loop: #f0a55a; --c-if: #6cc58e; --c-score: #b79bf2; --c-over: #f08080; --c-clear: #e8c35a; --c-start: #9ba7b6; --c-ref: #9aa7b3;
  --t-move: #1b2a44; --t-loop: #3a2a17; --t-if: #18321f; --t-score: #2a2141; --t-over: #3a1d1d; --t-clear: #3a3115; --t-ref: #1d252d;
  --ok: #6cc58e; --ng: #f08080; --warn: #e2b45a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark; }

html { height: 100%; }
body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.65;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button, a, label, select, summary { touch-action: manipulation; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.35; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 上の帯 ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar-in { display: flex; align-items: center; gap: 10px 16px; min-height: 58px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: 0 0 auto; }
.brand b { font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: .04em; }
.spacer { flex: 1; }
.roles { display: inline-flex; border: 1px solid var(--line2); border-radius: 999px; padding: 3px; gap: 2px; background: var(--sunk); flex-wrap: wrap; }
.roles button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; font-size: 13px; white-space: nowrap; }
.roles button[aria-pressed="true"] { background: var(--ui); color: var(--ui-ink); font-weight: 700; }
.roles .lab { font-size: 12px; color: var(--muted); padding: 4px 6px 4px 8px; align-self: center; }
.save { font-size: 12px; color: var(--muted); white-space: nowrap; }
.memo-btn { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); background: var(--hi); color: #17212b; font-weight: 700; padding: 5px 14px; border-radius: 999px; }
.memo-btn .cnt { background: #17212b; color: #ffd84a; border-radius: 999px; padding: 0 7px; font-size: 12px; min-width: 1.5em; text-align: center; }

/* 定規（流れ図テンプレート） */
.ruler { height: 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; overflow: hidden; color: var(--line2); }
.ruler svg { flex: 0 0 auto; }

/* ---------- 全体の配置 ---------- */
.shell { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 77px); }
@media (max-width: 899px) { .shell { grid-template-columns: 1fr; } }
.nav { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(77px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 77px); box-sizing: border-box; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; }
.nav a:hover { background: var(--sunk); }
.nav a[aria-current="page"] { background: var(--ui-soft); font-weight: 700; }
.nav a svg { width: 20px; height: 20px; flex: 0 0 auto; }
.nav .sep { height: 1px; background: var(--line); margin: 8px 4px; }
.nav .foot { margin-top: auto; font-size: 11px; color: var(--muted); padding: 8px; line-height: 1.5; }
@media (max-width: 899px) {
  .nav { position: static; height: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-left, 0px)); gap: 4px; }
  .nav a { white-space: nowrap; padding: 6px 10px; } .nav .sep, .nav .foot { display: none; }
}
main { min-width: 0; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { main { padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); } }
.view { max-width: 1440px; display: grid; gap: 18px; }
.view > .seg, .view > .row, .view > .kinds { justify-self: start; }
.vhead { display: flex; align-items: flex-end; gap: 10px 18px; flex-wrap: wrap; }
.vhead h1 { font-size: 24px; }
.vhead p { margin: 0; color: var(--muted); max-width: 70ch; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }

/* ---------- 部品 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.panel.flat { box-shadow: none; }
.panel h2 { font-size: 16px; margin-bottom: 10px; }
.panel h3 { font-size: 14px; margin-block: 12px 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line2); background: var(--surface); padding: 7px 14px; border-radius: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ui); color: var(--ui-ink); border-color: var(--ui); font-weight: 700; }
.btn.go { background: var(--c-if); color: #fff; border-color: var(--c-if); font-weight: 700; }
:root[data-theme="dark"] .btn.go { color: #0d1520; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.go { color: #0d1520; } }
.btn.danger { color: var(--ng); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { border: 1px solid var(--line2); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ui); color: var(--ui-ink); border-color: var(--ui); font-weight: 700; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.tag.move { color: var(--c-move); border-color: var(--c-move); } .tag.loop { color: var(--c-loop); border-color: var(--c-loop); }
.tag.if { color: var(--c-if); border-color: var(--c-if); } .tag.score { color: var(--c-score); border-color: var(--c-score); }
.tag.over { color: var(--c-over); border-color: var(--c-over); } .tag.clear { color: var(--c-clear); border-color: var(--c-clear); }
.tag.solid { background: var(--ink); color: var(--surface); border-color: var(--ink); }
select, input[type="text"], input[type="number"], textarea { border: 1px solid var(--line2); background: var(--surface); border-radius: 8px; padding: 6px 9px; max-width: 100%; box-sizing: border-box; }
textarea { width: 100%; min-height: 84px; resize: vertical; line-height: 1.6; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.f > span { font-weight: 700; color: var(--ink); }
label.f input, label.f textarea, label.f select { color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 14px; font-size: 14px; border-right: 1px solid var(--line2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ui); color: var(--ui-ink); font-weight: 700; }
.seg button[disabled] { opacity: .4; cursor: not-allowed; }
.note-role { border: 1px dashed var(--line2); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--muted); background: var(--sunk); }
.hidden-answer { border: 1px dashed var(--line2); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 10px; z-index: 60; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 40px);  pointer-events: none;}
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }
.split.make { grid-template-columns: minmax(0, .7fr) minmax(0, 1.3fr); }
@media (max-width: 1100px) { .split.make { grid-template-columns: 1fr; } }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 700; white-space: nowrap; }
td.ok { color: var(--ok); font-weight: 700; } td.ng { color: var(--ng); font-weight: 700; }
pre.code { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 13px; line-height: 1.6; margin: 0; font-family: var(--font); white-space: pre; }
details.fold { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.fold > summary { cursor: pointer; padding: 8px 12px; font-weight: 700; font-size: 14px; }
details.fold > div { padding: 4px 12px 12px; }

/* ---------- ホーム ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 24px; align-items: center; }
@media (max-width: 1000px) { .hero { grid-template-columns: 1fr; } }
.hero h1 { font-size: clamp(26px, 3.4vw, 40px); letter-spacing: .01em; line-height: 1.3; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--hi) 62%); padding: 0 2px; }
:root[data-theme="dark"] .hero h1 em { color: #17212b; background: var(--hi); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero h1 em { color: #17212b; background: var(--hi); } }
.hero p { color: var(--muted); max-width: 58ch; font-size: 16px; }
.hero .row { margin-top: 14px; }
.stage-demo { display: grid; justify-items: center; gap: 8px; }
#h-board, #pl-board, #r-board, .boardbox { width: 100%; display: grid; justify-items: center; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi span { font-size: 12px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; color: var(--ink); text-decoration: none; }
.tile:hover { border-color: var(--muted); }
.tile svg { flex: 0 0 auto; width: 36px; height: 36px; color: var(--ui); }
.tile div { display: grid; gap: 3px; min-width: 0; }
.tile b { font-size: 15px; } .tile span { font-size: 13px; color: var(--muted); }

/* ---------- 問題集 ---------- */
.lib { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; align-items: start; }
@media (max-width: 1150px) { .lib { grid-template-columns: 1fr; } }
.ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; align-content: start; }
.ptile { display: grid; gap: 6px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 10px; color: var(--ink); }
.ptile:hover { border-color: var(--line2); }
.ptile[aria-pressed="true"] { border-color: var(--ui); box-shadow: 0 0 0 2px var(--ui) inset; }
.ptile .t { font-weight: 700; font-size: 14px; line-height: 1.35; }
.ptile .meta { display: flex; flex-wrap: wrap; gap: 4px; }
.ptile .board { width: 100%; }
.stars { color: var(--star); letter-spacing: .06em; }
.detail { position: sticky; top: calc(96px + env(safe-area-inset-top, 0px)); display: grid; gap: 12px; }
@media (max-width: 1150px) { .detail { position: static; } }
.rulelist { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.rulelist li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14px; }
.handout { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.handout .h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.sentences { margin: 0; padding-left: 0; list-style: none; font-size: 14px; display: grid; gap: 2px; }
.sentences li { display: flex; gap: 8px; }
.sentences .n { color: var(--muted); min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- ゲームの盤 ---------- */
.board { box-sizing: border-box; position: relative; width: min(100%, 440px); aspect-ratio: 1 / 1; max-width: 100%; border-radius: 16px; overflow: hidden; border: 4px solid #2f5a25; box-shadow: 0 6px 18px rgba(0,0,0,.18); user-select: none; }
.board.mini { border-width: 2px; border-radius: 9px; box-shadow: none; }
.board.theme-field { background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 16.666%, rgba(0,0,0,0) 16.666% 33.333%), radial-gradient(circle at 30% 20%, #9ad97f, #5fae4b 70%); border-color: #2f5a25; }
.board.theme-space { background: radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 72% 12%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 40% 70%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 86% 64%, #cfe3ff 50%, transparent 51%), radial-gradient(1px 1px at 22% 88%, #fff 50%, transparent 51%), radial-gradient(circle at 70% 30%, #23376a, #0b1430 70%); border-color: #0a1024; }
.board.theme-road { background: linear-gradient(#7cc56a 0 33.333%, #3d4148 33.333% 66.666%, #7cc56a 66.666%); border-color: #2c2f35; }
.board.theme-road::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 0; border-top: 3px dashed rgba(255,255,255,.7); }
.board.theme-night { background: radial-gradient(circle at 50% 50%, #26304a, #0b0f1c 75%); border-color: #070a12; }
.board.theme-sky { background: linear-gradient(#8fd3ff, #d9f1ff); border-color: #2f6f9a; }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.cell { border: 1px dashed rgba(255,255,255,.45); position: relative; }
.board.theme-sky .cell { border-color: rgba(30,80,120,.25); }
.cell span { position: absolute; left: 4px; top: 4px; font-size: 12px; font-weight: 700; color: #fff; background: rgba(0,0,0,.3); border-radius: 5px; padding: 0 4px; white-space: nowrap; }

// フローチャートカード ラボ：実行エンジン（v3 試作）
// 2つの時間の進み方
//   card  … カード1枚＝1手（授業 v2.1 と同じ。キー入力なし）
//   frame … 「ずっとくり返す」の1回＝1コマ（遊ぶ版・ゲームジャム。キー入力あり）
// 行 = [本線のカード|null, いいえの道のカード|null]

//   {k:"点数"} {k:"終わる", e:"ゲームオーバー|クリア"} {k:"待つ"}

//   {k:"もし", a, b}（同じマス） {k:"もしキー", key:"上|下|左|右|スペース"} {k:"もし場所", c, ps:["中,上",…]} {k:"もし点数", n}
//   {k:"合流"}
// 判定は v2.1 と同じく、手（コマ）ごとの「見えているキャラの位置・点数・終わり」を比べる。

  const XS = ["左", "中", "右"], YS = ["上", "中", "下"];

  const IFK = new Set(["もし", "もしキー", "もし場所", "もし点数"]);
  const LOOPK = new Set(["ここから", "ずっと"]);
  const ACTK = new Set(["配置", "動かす", "矢印", "隠す", "表示", "点数", "終わる", "待つ"]);
  const CONTROL = new Set([...IFK, ...LOOPK, "ここまで", "合流"]);
  const SHORT = { "ここから": "ここから くり返す", "ずっと": "ずっと くり返す", "ここまで": "ここまでを くり返す", "合流": "ここで道が1つにもどる",
    "もし": "もし", "もしキー": "もし（キー）", "もし場所": "もし（場所）", "もし点数": "もし（点数）" };

        if (LOOPK.has(k)) { const node = Object.assign({}, main, { body: [], at: [idx, 0] }); stack[stack.length - 1].push(node); stack.push(node.body); loopOpen.push(i); }
        else if (k === "ここまで") { if (!loopOpen.length) throw new ParseError(`${i}行目：「ここまでを くり返す」の前に「ここから」か「ずっと」がありません`, i); stack.pop(); loopOpen.pop(); }

        else if (k === "合流") throw new ParseError(`${i}行目：「ここで道が1つにもどる」の前に「もし」がありません`, i);
        else stack[stack.length - 1].push(Object.assign({}, main, { at: [idx, 0] }));
      } else {
        if (main && main.k === "合流") {
          if (right) throw new ParseError(`${i}行目：「ここで道が1つにもどる」の行の右の列にはカードを置けません`, i);
          stack[stack.length - 1].push(Object.assign({}, inIf.card, { yes: inIf.yes, no: inIf.no, at: inIf.at }));
          inIf = null; return;
        }
        [[main, 0], [right, 1]].forEach(([card, col]) => {
          if (!card) return;
          if (CONTROL.has(card.k)) throw new ParseError(`${i}行目：「もし」の中には「${SHORT[card.k] || card.k}」は置けません`, i);
          (col === 0 ? inIf.yes : inIf.no).push(Object.assign({}, card, { at: [idx, col] }));

    });

  }

  const LIMIT = { limit: true };
  const STOP = { stop: true };

  // 実行（ジェネレーター）。コマ（手）ごとに記録を yield し、次のコマのキーを受け取る
  function* runGen(tree, opt = {}) {
    const mode = opt.mode || "card";
    const maxF = opt.maxFrames || (mode === "card" ? 80 : 300);
    const st = { chars: {}, score: 0, hand: 0, log: [], end: null, path: [], visits: [], keys: new Set(), events: [], steps: 0, limited: false, mode };
    const snap = () => Object.keys(st.chars).sort().filter(k => st.chars[k].v).map(k => [k, NAME[st.chars[k].x + "," + st.chars[k].y]]);
    function* frame(at, kind, who, desc) {
      st.hand += 1;
      const e = { hand: st.hand, chars: snap(), score: st.score, end: st.end, at, kind, who: who || null, desc: desc || "", events: st.events,
        hidden: who ? !!(st.chars[who] && !st.chars[who].v) : false };
      st.log.push(e); st.events = [];
      if (st.hand >= maxF) { st.limited = true; throw LIMIT; }
      const k = yield e;

    }
    function step() { if (++st.steps > 200000) { st.limited = true; throw LIMIT; } }

      const ch = n.c !== undefined ? st.chars[n.c] : null;
      switch (n.k) {
        case "配置": { const [x, y] = POS[n.p]; st.chars[n.c] = { x, y, v: true }; st.events.push({ t: "pop", c: n.c }); return `配置 ${n.c} ${n.p}`; }
        case "動かす": {
          if (ch) { const [dx, dy] = DIR[n.d]; if (ch.x + dx >= 0 && ch.x + dx <= 2 && ch.y + dy >= 0 && ch.y + dy <= 2) { ch.x += dx; ch.y += dy; } }
          return `動かす ${n.c} ${ARROW[n.d]}`;
        }
        case "矢印": {
          let d = null; for (const k of ["上", "下", "左", "右"]) if (st.keys.has(k)) d = k;
          if (d && ch) { const [dx, dy] = DIR[d]; if (ch.x + dx >= 0 && ch.x + dx <= 2 && ch.y + dy >= 0 && ch.y + dy <= 2) { ch.x += dx; ch.y += dy; } }
          return `矢印 ${n.c} ${d ? ARROW[d] : "なし"}`;
        }
        case "隠す": if (ch && ch.v) st.events.push({ t: "poof", c: n.c }); if (ch) ch.v = false; return `隠す ${n.c}`;
        case "表示": if (ch && !ch.v) st.events.push({ t: "pop", c: n.c }); if (ch) ch.v = true; return `表示 ${n.c}`;
        case "点数": st.score += 1; st.events.push({ t: "plus" }); return "点数＋1";
        case "終わる": st.end = n.e; st.events.push({ t: n.e }); return `終わる ${n.e}`;
        case "待つ": return "待つ";
      }
      throw new Error("不明なカード " + n.k);
    }
    function cond(n) {
      switch (n.k) {
        case "もし": { const A = st.chars[n.a], B = st.chars[n.b]; return !!(A && B && A.v && B.v && A.x === B.x && A.y === B.y); }
        case "もしキー": return mode === "frame" && st.keys.has(n.key);
        case "もし場所": { const A = st.chars[n.c]; return !!(A && A.v && (n.ps || []).includes(NAME[A.x + "," + A.y])); }
        case "もし点数": return st.score >= (n.n || 0);
      }
      return false;
    }
    function* exe(block) {
      for (const n of block) {
        step();
        st.visits.push({ at: n.at, hand: st.hand });
        if (ACTK.has(n.k)) {
          const desc = act(n);
          if (mode === "card") { yield* frame(n.at, n.k, n.c, desc); if (n.k === "終わる") throw STOP; }
          else if (n.k === "待つ" || n.k === "終わる") { yield* frame(n.at, n.k, n.c, desc); if (n.k === "終わる") throw STOP; }
        } else if (n.k === "ここから") {
          for (let r = 0; r < (n.n || 0); r++) yield* exe(n.body);
        } else if (n.k === "ずっと") {
          if (mode === "frame") yield* frame(n.at, "はじめ", null, "はじめのようす");
          for (;;) { const h = st.hand; yield* exe(n.body); if (mode === "frame") yield* frame(n.at, "コマ", null, "1コマ"); else if (st.hand === h) { st.limited = true; throw LIMIT; } }
        } else if (IFK.has(n.k)) {
          const yes = cond(n);
          st.path.push([st.hand, yes ? "はい" : "いいえ", n.at]);
          yield* exe(yes ? n.yes : n.no);
        } else throw new Error("不明なカード " + n.k);
      }
    }
    try {
      yield* exe(tree);
      if (mode === "frame" && (st.events.length || st.hand === 0)) yield* frame(null, "おわり", null, "おわり");
    } catch (e) { if (e !== LIMIT && e !== STOP) throw e; }
    return st;
  }

  function run(tree, opt = {}) {
    const g = runGen(tree, opt); const inputs = opt.inputs || []; let i = 0; let r = g.next();
    while (!r.done) { r = g.next(inputs[i] || []); i++; }
    return r.value;
  }

  const sig = e => JSON.stringify([e.chars, e.score, e.end]);
  function compare(a, b) {
    const A = a.log, B = b.log;
    for (let i = 0; i < Math.min(A.length, B.length); i++) if (sig(A[i]) !== sig(B[i])) return { ok: false, hand: i + 1 };
    if (A.length !== B.length) return { ok: false, hand: Math.min(A.length, B.length) + 1 };
    return { ok: true, hand: null };
  }

  // 問題の判定。card：1回の実行を比べる。frame：テストの入力ごとに比べる
  function judge(problem, rows) {
    let tree; try { tree = parse(rows); } catch (e) { if (e instanceof ParseError) return { error: e.message }; throw e; }
    const tTree = parse(problem.rows);

    }
    const tests = (problem.tests && problem.tests.length ? problem.tests : [{ name: "何もしない", inputs: [], frames: 20 }]).map(ts => {
      const o = { mode: "frame", inputs: ts.inputs || [], maxFrames: ts.frames || 40 };
      const t = run(tTree, o), s = run(tree, o);
      return Object.assign({ name: ts.name, target: t, mine: s }, compare(t, s));
    });
    return { ok: tests.every(t => t.ok), tests };
  }

  function countCards(rows) { const c = {}; for (const r of rows) for (const x of r) if (x) c[x.k] = (c[x.k] || 0) + 1; return c; }

  return { XS, YS, POS, POS_NAMES, NAME, DIR, ARROW, KEYS, KEYLABEL, IFK, LOOPK, ACTK, CONTROL, ParseError, parse, runGen, run, compare, judge, countCards };
})();
if (typeof module !== "undefined") module.exports = FCL;

function sentencesHTML(rows) {

    const [m, r] = row; if (!m && !r) return;
    if (m && m.k === "ここまで") depth = Math.max(0, depth - 1);
    if (m && m.k === "合流") inIf = false;
    const pad = "　".repeat(depth + (inIf ? 1 : 0));
    if (m) out.push(`<li><span class="n">${i + 1}</span><span>${pad}${inIf ? "<b class='muted'>はい：</b>" : ""}${esc(cardText(m))}</span></li>`);
    if (r) out.push(`<li><span class="n">${i + 1}</span><span>${pad}<b class='muted'>いいえ：</b>${esc(cardText(r))}</span></li>`);
    if (m && E.LOOPK.has(m.k)) depth++;

function toPython(tree, mode, ind = 0) {
  const sp = "    ".repeat(ind); const out = []; const s = v => `"${v}"`;
  for (const n of tree) {
    switch (n.k) {
      case "配置": { const [x, y] = n.p.split(","); out.push(`${sp}配置(${s(n.c)}, ${s(x)}, ${s(y)})`); break; }
      case "動かす": out.push(`${sp}動かす(${s(n.c)}, ${s(n.d)})`); break;
      case "矢印": out.push(`${sp}矢印で動かす(${s(n.c)})`); break;
      case "隠す": out.push(`${sp}隠す(${s(n.c)})`); break;
      case "表示": out.push(`${sp}表示する(${s(n.c)})`); break;
      case "点数": out.push(`${sp}点数 = 点数 + 1`); break;
      case "終わる": out.push(`${sp}終わる(${s(n.e)})`); break;
      case "待つ": out.push(`${sp}次のコマへ()`); break;
      case "ここから": out.push(`${sp}for i in range(${n.n}):`); out.push(n.body.length ? toPython(n.body, mode, ind + 1) : `${sp}    pass`); break;
      case "ずっと": out.push(`${sp}while True:  # ゲームが終わるまで`); out.push(n.body.length ? toPython(n.body, mode, ind + 1) : `${sp}    pass`); if (mode === "frame") out.push(`${sp}    次のコマへ()`); break;
      default:
        if (E.IFK.has(n.k)) {
          const c = n.k === "もし" ? `同じマス(${s(n.a)}, ${s(n.b)})` : n.k === "もしキー" ? `押した(${s(n.key)})` : n.k === "もし場所" ? `いる(${s(n.c)}, [${(n.ps || []).map(s).join(", ")}])` : `点数 >= ${n.n}`;
          out.push(`${sp}if ${c}:`); out.push(n.yes.length ? toPython(n.yes, mode, ind + 1) : `${sp}    pass`);
          if (n.no.length) { out.push(`${sp}else:`); out.push(toPython(n.no, mode, ind + 1)); }
        }
    }
  }
  return out.filter(x => x !== "").join("\n");
}

function makeData(box) {

    ${Store.ref ? "" : `<p class="small" style="margin:0;color:var(--warn)">このブラウザに保存しています。iPhone の Safari などは、しばらく開かないと保存を消すことがあります。大事な問題やメモは、ときどき JSON で書き出してください。</p>`}

function captureCtx() {
  const c = { time: nowText(), view: S.view, role: U.prefs.role };
  let pid = null;
  if (S.view === "build") { pid = S.build.probId; c.rows = rowsPlain(getRows()); if (S.build.judge) c.judge = S.build.judge.text; if (S.build.edit) c.note = "正解の並べ方を編集中"; }
  else if (S.view === "play" || S.view === "library") { pid = S.probId; if (S.view === "play") c.style = S.style === "遊ぶ" ? "遊んで見つける" : "映像をまねる"; }
  else if (S.view === "lesson" && S.lesson) { const L = lessonOf(S.lesson.id); c.lesson = `${L.title}／${L.phases[S.lesson.i].name}`; }
  if (pid) { const p = prob(pid); c.probId = pid; c.prob = p ? (p.stageLabel ? p.stageLabel + " " : "") + p.title : pid; c.mode = p ? p.mode : ""; }
  return c;
}
function ctxLines(c) {

  $("#mm-save", pn).addEventListener("click", () => {
    const text = $("#mm-t", pn).value.trim(); if (!text) { $("#mm-t", pn).focus(); toast("メモを書いてください。"); return; }
    U.notes.push({ id: uid("n-"), kind: S.memoKind, text, ctx: captureCtx(), done: false }); Store.save(); renderMemoCount(); $("#mm-t", pn).value = ""; S.memoDraft = ""; toggleMemo(false); toast("メモを残しました。");
    if (S.view === "memo") render();
  });
  setTimeout(() => $("#mm-t", pn).focus(), 0);
}
function notesMarkdown(list) {
  const out = [`# フローチャートカード ラボ：気づきメモ（${nowText()} 書き出し、${list.length}件）`, "", "下のメモをもとに、ラボ（教材・カード・問題・アプリ）を直してください。"];
  list.forEach((n, i) => {
    const c = n.ctx || {};
    out.push("", `## ${i + 1}. [${n.kind}] ${c.prob || VIEW_NAME[c.view] || ""}${n.done ? "（済み）" : ""}`, `- 書いた時刻：${c.time || ""}`);
    for (const l of ctxLines(c)) out.push(`- ${l}`);
    out.push(`- メモ：${n.text.replace(/\n/g, "\n  ")}`);
    if (c.rows && c.rows.length) { out.push("- そのときの並べ方："); for (const r of c.rows) out.push(`  - ${r}`); }
  });
  const found = Object.entries(U.found || {}).filter(([, L]) => L && L.length);
  if (found.length) {
    out.push("", "## 遊ぶ・見るで「見つけたこと」");
    for (const [pid, L] of found) { const pp = prob(pid); out.push(`- ${pp ? pp.title : pid}：`); for (const t of L) out.push(`  - ${t}`); }
  }
  return out.join("\n");
}
function viewMemo(m) {
  const F = ["すべて", "のこり", "済み", ...NOTE_KINDS];
  const list = U.notes.filter(n => S.memoFilter === "すべて" || (S.memoFilter === "のこり" ? !n.done : S.memoFilter === "済み" ? n.done : n.kind === S.memoFilter));
  const cnt = k => U.notes.filter(n => n.kind === k).length;
  m.innerHTML = `<div class="view">
  <div class="vhead"><div><div class="eyebrow">気づきメモ</div><h1>不具合・足りないカード・分かりにくい所</h1></div><p>上の「メモする」から、どの画面でも書けます。そのときの画面・役・問題・並べ方・判定を自動で添えます。「まとめてコピー」した文をチャットに貼れば、直す手がかりになります。</p></div>
  <div class="kpis">${NOTE_KINDS.slice(0, 4).map(k => `<div class="kpi"><b>${cnt(k)}</b><span>${k}</span></div>`).join("")}</div>
  <div class="row" role="group" aria-label="しぼりこみ">${F.map(f => `<button class="chip" data-f="${f}" aria-pressed="${S.memoFilter === f}">${f}</button>`).join("")}</div>
  <div class="row"><button class="btn primary" id="n-copy">表示中の${list.length}件をまとめてコピー（チャット用）</button><button class="btn" id="n-new">メモを書く</button><button class="btn" id="n-json">JSON で保存</button></div>
  <textarea class="out" id="n-out" hidden aria-label="まとめた文"></textarea>
  <div class="notes">${list.length ? list.slice().reverse().map(n => { const c = n.ctx || {}; return `<article class="noteitem${n.done ? " done" : ""}" data-id="${n.id}">
    <div class="top"><span class="tag kind-${esc(n.kind)}">${esc(n.kind)}</span><span class="muted">${esc(c.time || "")}</span><span class="tag">${esc(ROLE_NAME[c.role] || "")}</span><span class="muted">${esc(VIEW_NAME[c.view] || "")}${c.prob ? "／" + esc(c.prob) : ""}</span></div>
    <div class="body">${esc(n.text)}</div>
    ${(c.judge || (c.rows && c.rows.length) || c.style || c.lesson) ? `<details class="fold"><summary>そのときの様子</summary><div class="small">${ctxLines(c).map(esc).join("<br>")}${c.rows && c.rows.length ? `<ol style="margin:6px 0 0;padding-left:1.4em">${c.rows.map(r => `<li>${esc(r.replace(/^\d+\.\s*/, ""))}</li>`).join("")}</ol>` : ""}</div></details>` : ""}
    <div class="row"><button class="btn small" data-a="done">${n.done ? "まだにもどす" : "済みにする"}</button><button class="btn small" data-a="edit">直す</button>${c.probId && prob(c.probId) ? `<button class="btn small" data-a="open">この問題を開く</button>` : ""}<span data-del-w></span></div></article>`; }).join("") : `<div class="hidden-answer">まだメモがありません。役を選んで問題をためし、気づいたら「メモする」。</div>`}</div></div>`;
  for (const b of $$("[data-f]", m)) b.addEventListener("click", () => { S.memoFilter = b.dataset.f; viewMemo(m); });
  $("#n-copy", m).addEventListener("click", () => copyText(notesMarkdown(list), $("#n-out", m)));
  $("#n-new", m).addEventListener("click", () => toggleMemo(true));
  $("#n-json", m).addEventListener("click", () => offerFile(`ラボの気づきメモ_${nowText().slice(0, 10).replace(/-/g, "")}.json`, JSON.stringify(U.notes, null, 2)));
  for (const a of $$(".noteitem", m)) {
    const n = U.notes.find(x => x.id === a.dataset.id);
    $('[data-a="done"]', a).addEventListener("click", () => { n.done = !n.done; Store.save(); renderMemoCount(); viewMemo(m); });
    $('[data-a="edit"]', a).addEventListener("click", () => { const body = $(".body", a); body.innerHTML = `<textarea aria-label="メモを直す">${esc(n.text)}</textarea><div class="row" style="margin-top:6px"><button class="btn small primary">保存</button><button class="btn small">やめる</button></div>`;
      const [sv, cn] = $$("button", body); sv.addEventListener("click", () => { n.text = $("textarea", body).value.trim() || n.text; Store.save(); viewMemo(m); }); cn.addEventListener("click", () => viewMemo(m)); });
    const op = $('[data-a="open"]', a); if (op) op.addEventListener("click", () => { const c = n.ctx; if (c.view === "build") { S.build.probId = c.probId; go("build"); } else go(c.view === "play" ? "play" : "library", { probId: c.probId }); });
    confirmBtn($("[data-del-w]", a), "消す", () => { U.notes = U.notes.filter(x => x.id !== n.id); Store.save(); renderMemoCount(); viewMemo(m); }, true);
  }
}

// ---------------------------------------------------------------- 起動
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($(".projector")) closeProjector(); else if (!$("#memo-panel").hidden) toggleMemo(false); } });
Store.loadLocal();
shell();
function restoreUI() {
  const L = U.prefs.last; if (!L) return;
  if (L.probId && prob(L.probId)) S.probId = L.probId;
  if (L.build && prob(L.build)) S.build.probId = L.build;
  if (L.edit && L.edit.probId && U.custom[L.edit.probId]) S.build.edit = L.edit;
  if (L.lessonId) S.lessonId = L.lessonId;
  if (L.makeSel && U.custom[L.makeSel]) S.makeSel = L.makeSel;
}
restoreUI();
{ const h = (location.hash || "").slice(1); if (VIEW_NAME[h]) S.view = h; try { history.replaceState({ view: S.view }, "", "#" + S.view); } catch (e) { } }
render();
Store.connect(() => { restoreUI(); renderRoles(); renderMemoCount(); render(); });
window.__lab = { get U() { return U; }, S, go, prob, E, getRows, setRows, cardSVG };

})();
</script>
